# Zig.

[meta]
name = "zig"
display = "Zig"

[words]
keyword = [
  "align", "allowzero", "and", "asm", "async", "await", "break", "callconv",
  "catch", "comptime", "const", "continue", "defer", "else", "enum", "errdefer",
  "error", "export", "extern", "fn", "for", "if", "inline", "noalias",
  "noinline", "nosuspend", "opaque", "or", "orelse", "packed", "pub", "resume",
  "return", "struct", "suspend", "switch", "test", "threadlocal", "try",
  "union", "unreachable", "usingnamespace", "var", "volatile", "while",
]
type = [
  "anyerror", "anyframe", "anytype", "bool", "c_int", "comptime_float",
  "comptime_int", "f16", "f32", "f64", "f128", "i8", "i16", "i32", "i64",
  "i128", "isize", "noreturn", "type", "u8", "u16", "u32", "u64", "u128",
  "usize", "void",
]
constant = ["false", "null", "true", "undefined"]

[[comment]]
open = "///"

[[comment]]
open = "//"

[[string]]
open = '"'
close = '"'
escape = "\\"

[[string]]
open = "'"
close = "'"
escape = "\\"
max = 12

[number]
prefixes = ["0x", "0b", "0o"]
separator = "_"
exponent = "eEpP"

[symbols]
operator = "+-*/%=<>!&|^~?"
punctuation = "(){}[],;:."

[[sigil]]
open = "@"
role = "function"

[context]
name_after = { fn = "function", struct = "type", enum = "type", union = "type", error = "type" }
call_paren = true
upper_type = true
screaming_constant = true
member_dot = true

[[case]]
name = "a builtin is a function and a doc comment beats a line comment"
code = """
/// Adds.
pub fn add(a: u8) u8 { return @intCast(a); }"""
expect = ["comment /// Adds.", "keyword pub", "keyword fn", "function add", "type u8", "function @intCast"]

[[case]]
name = "a character literal does not eat the line"
code = "const c = 'x'; const d = 'y';"
expect = ["string 'x'", "string 'y'"]
