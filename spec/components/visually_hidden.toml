[meta]
name = "VisuallyHidden"
element = "span"
class = "nd-visually-hidden"
summary = "Hide content from the screen while keeping it for assistive technology."

[prop.focusable]
type = "bool"
default = "false"
attribute = "data-nd-focusable"
doc = "Whether the content is revealed when it receives focus, as a skip link is."

[prop.children]
type = "children"
doc = "The content."

[a11y]
notes = "Not `display: none` and not `visibility: hidden`, because both remove the content from the accessibility tree. The clip-path keeps it announced and out of the layout."
