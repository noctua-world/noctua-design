[meta]
name = "Em"
element = "em"
class = "nd-em"
# One of the marks that go inside a sentence, documented with the others.
page = "inline-text"
summary = "Mark stress emphasis on a word inside a sentence."

[prop.children]
type = "children"
doc = "The emphasised text."

[a11y]
notes = """
`em` marks stress emphasis and `strong` marks importance. A screen reader may
voice them differently, so use each one for its own meaning."""
