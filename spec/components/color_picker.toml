# When to reach for it, and when not to. Top-level rather than inside
# [meta], because a bare key after a table header belongs to that table.
guidance = "Use a colour picker when the colour is the user's own value, such as a label they are creating or a shape they are drawing. Where the answers are a fixed set of named colours, use `Segmented` or `Select` instead."

[meta]
name = "ColorPicker"
element = "div"
class = "nd-color-picker"
summary = "Let users choose a colour from a square, with every notation for it folded away."
ai = "custom"

# EVERY ID DERIVES FROM `name`, AND A CALLER WRITES NONE OF THEM.
#
# The trigger, the panel, the label, the two tabs, the field, both tracks, the
# entry, the status line and every row of codes. `Search` was rebuilt because
# the version before it derived its ids from an OPTIONAL name, so four fields
# on one page all carried `id="nd-search-"` and four labels pointed at
# whichever the browser resolved first. Required here, from the first line —
# and this component puts more ids on a page than any other, so the rule
# matters more here than anywhere it has been applied before.

[prop.name]
type = "text"
required = true
attribute = "data-nd-color-picker"
doc = "The form field name the colour is submitted under, and the root of every id here. **Required**, because ids derived from an optional name would be shared by every picker on the page."

[prop.label]
type = "text"
required = true
doc = "What the colour is for, in the reader's language, such as *Label colour*. It renders a real `<label>` on the control that carries the value, and it names the list of colours when `multiple` is on."

[prop.value]
type = "text"
doc = """The colour to start on, as `#rrggbb`, or `#rrggbbaa` with `alpha`. Hex only, because the no-script form is `<input type="color">`. Several values are separated by spaces when `multiple` is on."""

[prop.hint]
type = "text"
doc = "Extra guidance shown under the label. It is linked with `aria-describedby`, so a screen reader reads it with the control."

[prop.error]
type = "text"
doc = """The message shown when the answer is wrong, after a submission. It carries `role="alert"`, and nothing here writes over it or clears it."""

# --- The square in the page -------------------------------------------------

[prop.size]
type = "enum"
values = ["small", "medium", "large"]
default = "medium"
attribute = "data-nd-size"
doc = "The size of the chip, matching `Button` and `Swatch` step for step so a picker lines up in a row of controls. `medium` by default."

[prop.shape]
type = "enum"
values = ["pill", "rounded", "square"]
default = "rounded"
attribute = "data-nd-shape"
doc = "The chip's corners, from `Swatch`'s three: `pill`, `rounded` or `square`. `rounded` by default rather than `Swatch`'s `pill`, because this chip is a control users press."

[prop.trigger_label]
type = "text"
attribute = "data-nd-trigger-label"
doc = "The accessible name of the chip, with a `{value}` hole, such as *Choose a colour, currently {value}*. Without it the button falls back to `label`, which does not carry the colour."

[prop.glass]
type = "bool"
default = "false"
attribute = "data-nd-glass"
doc = "Frosts the chip. The panel stays opaque whatever this says, because a backdrop showing through would tint the colours the panel is judged by."

# --- Several colours --------------------------------------------------------

[prop.multiple]
type = "bool"
default = "false"
attribute = "data-nd-multiple"
doc = """Whether users build a list of colours. On, the trigger shows one chip per committed colour and the panel gains a row of them. Either way the store is one `<input type="color">` per value under one `name`."""

[prop.max]
type = "text"
attribute = "data-nd-max"
doc = "How many colours are allowed. Text rather than a number, because every prop crossing the two languages is text. At the limit the add control is disabled and `max_label` is shown."

[prop.max_label]
type = "text"
attribute = "data-nd-max-label"
doc = "The message shown at that limit, with a `{max}` hole. Set it wherever `max` is set."

# THE ELEVEN SENTENCES BELOW ARE NOT ATTRIBUTES, AND ELEVEN OF THEM SAID THEY
# WERE. Each declared a `data-nd-*` no body writes and no script reads: the
# words reach the DOM as an `aria-label`, a tab's label or the text of a
# control, which is why the picker works and why nothing ever reported it. The
# nine the runtime does read still declare theirs. `attribute` is a claim about
# the markup, so a prop that is not one says nothing.
[prop.add_label]
type = "text"
doc = "The accessible name of the control that adds the current colour to the list. Set it whenever `multiple` is on, because that control is the only way a colour joins the list."

[prop.remove_label]
type = "text"
attribute = "data-nd-remove-label"
doc = "The accessible name of each committed colour's remove control, with a `{value}` hole, so each one names the colour it removes."

[prop.added_label]
type = "text"
attribute = "data-nd-added-label"
doc = "The message read out when a colour joins the list, with a `{value}` hole. Nothing moves focus when one does, so without it a screen reader gets no confirmation."

[prop.removed_label]
type = "text"
attribute = "data-nd-removed-label"
doc = "The message read out when a colour is taken off the list, with a `{value}` hole. The control that removed it has left the page, so focus has moved."

[prop.status]
type = "text"
attribute = "data-nd-status"
doc = "How many colours there are, with a `{count}` hole. It may carry one form per plural category, written as `one:…|other:…`, as `Search.status` does."

# --- The free spectrum ------------------------------------------------------

[prop.spectrum_label]
type = "text"
doc = "The name of the free-choice tab. It is shown only when `palette` adds a second tab, because a single tab is a heading rather than a tab."

[prop.area_label]
type = "text"
doc = "The name of the saturation and value field, which is the square users drag in. It is two sliders in one box, named once, with each axis carrying its own value."

[prop.hue_label]
type = "text"
doc = """The name of the hue track. It is a real `<input type="range">`, which provides the keyboard, the thumb and the value."""

[prop.alpha]
type = "bool"
default = "false"
attribute = "data-nd-alpha"
doc = "Whether the colour can be transparent. Off by default. On, the codes gain their alpha forms and the native input gains the `alpha` attribute. A browser without that attribute gives an opaque colour."

[prop.alpha_label]
type = "text"
doc = "The name of the transparency track. Set it whenever `alpha` is on."

# --- The system's own colours -----------------------------------------------

[prop.palette]
type = "bool"
default = "false"
attribute = "data-nd-palette"
doc = "Whether the Noctua ramps are offered beside the spectrum. Off by default. On, the panel gains a second tab holding every palette from `noctua-colors`, and the codes gain a **token** row such as `--nc-violet-solid`."

[prop.palette_label]
type = "text"
doc = "The name of that tab. Set it whenever `palette` is on."

# --- Typing a colour --------------------------------------------------------

[prop.entry]
type = "bool"
default = "true"
attribute = "data-nd-entry"
doc = "Whether users can type or paste a colour. **On by default**. It accepts hex, `rgb()`, `hsl()` and `oklch()`, and rejects everything else, including the CSS colour names."

[prop.entry_label]
type = "text"
doc = "The name of that field. It is a real label rather than a placeholder, which would disappear as soon as users type."

[prop.entry_invalid_label]
type = "text"
attribute = "data-nd-entry-invalid-label"
doc = "The message shown when a string is not a colour, with a `{value}` hole. The colour already chosen does **not** change."

# --- Taking one off the screen ----------------------------------------------

[prop.eyedropper]
type = "bool"
default = "false"
attribute = "data-nd-eyedropper"
doc = "Whether a control appears for picking a colour off the screen. Off by default, and **absent rather than disabled** where the browser has no `EyeDropper`. What it returns is validated like typed input."

[prop.eyedropper_label]
type = "text"
doc = "The name of that control. It is a glyph, so this is the only name it has."

# --- The colours already used -----------------------------------------------

[prop.recent]
type = "text"
attribute = "data-nd-recent"
doc = "The storage key the last few colours are kept under. **Without it there is no recent row**, which is the default, because storing colours writes to the user's browser. Stored values that are not colours are dropped."

[prop.recent_label]
type = "text"
doc = "The heading over that row. Set it whenever `recent` is set."

[prop.forget_label]
type = "text"
doc = "The name of the control that empties the recent row. Set it whenever `recent` is set, so users can clear what was stored."

# --- The codes --------------------------------------------------------------

[prop.codes_label]
type = "text"
doc = "The summary on the folded panel of notations, such as *Codes*. It is a `Disclosure`, so the panel starts closed and the colour stays on screen."

[prop.formats]
type = "text"
default = "hex rgb hsl oklch"
attribute = "data-nd-formats"
doc = "Which notations to offer, separated by spaces, in the order shown: `hex`, `rgb`, `hsl`, `oklch`, `token`. An unknown name is dropped. `token` appears only on the Noctua tab, however it is listed."

[prop.copy_label]
type = "text"
attribute = "data-nd-copy-label"
doc = "The name of each row's copy control, with a `{format}` hole, such as *Copy the hex notation*, so the controls are told apart."

[prop.copied_label]
type = "text"
attribute = "data-nd-copied-label"
doc = "The message the live region carries once a copy has succeeded. Without it the control still works and swaps its glyph, with no confirmation for a screen reader. Nothing is announced when a copy **fails**."

# --- The platform -----------------------------------------------------------

# NO ATTRIBUTE, BECAUSE NO BODY WRITES ONE. The words below reach the DOM as
# a control's name or as its text, which is why the component works and why
# nothing reported the declaration. `attribute` is a claim about the markup.
[prop.close_label]
type = "text"
doc = "The name of the control that closes the panel. Escape closes it too, and a pointer-only user has no Escape."

[prop.disabled]
type = "bool"
default = "false"
attribute = "disabled"
doc = "Stops users changing the colour. It writes the real `disabled` attribute on the `<input>` elements and on every control in the panel. That also keeps the value out of the submitted form."

[prop.required]
type = "bool"
default = "false"
doc = "Whether a colour is needed. It goes on the **native input**, never on a control the script has hidden, because the browser anchors its message to the invalid control. A colour input always has a value, so it is never violated."

[state.invalid]
attribute = "data-nd-invalid"
doc = "Set when `error` is given, or when the entry field cannot read a string as a colour. The border changes and a message appears. The colour already chosen does not change."

[state.expanded]
attribute = "aria-expanded"
doc = "Whether the panel is open. It sits on the trigger rather than on the panel, which is where a screen reader reads it."

[state.copied]
attribute = "data-nd-done"
doc = "Set when a notation has just reached the clipboard. It sits on the copy control for the two seconds its glyph is a tick, the same state and window `CodeBlock` uses."

[keyboard]
"Enter or Space" = "Opens the panel from the chip. This is the browser's own behaviour, because the chip is a real button."
"Escape" = "Closes the panel and **keeps** the colour chosen."
"Arrow keys" = "Moves the point in the field, or the track that has focus, by one step."
"Shift + an arrow" = "The same, ten steps at a time."
"Home / End" = "Moves to the ends of whichever track has focus."
"Tab" = "Moves through the panel and out of it. Focus is not trapped, because the panel is a popover rather than a dialog."

[a11y]
needs_name = true
notes = """Every chip carries its notation as its accessible name, so colours that look alike are still told apart. The saturation and value field is two real `<input type="range">` elements."""
