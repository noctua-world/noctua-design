guidance = """
Use a code block for a block of code. For a fragment inside a sentence, use
`Code`. The code arrives as a prop rather than as children, which is what lets
the block number a line and colour a token. The script adds the copy control
and the collapse.
"""

[meta]
name = "CodeBlock"
element = "figure"
class = "nd-codeblock"
summary = "Show a block of highlighted code, in any of thirty-four languages."
ai = "custom"

[prop.code]
type = "text"
required = true
doc = "The code. Text rather than children, because a component that cannot read its own content cannot number a line, mark one or colour a token."

[prop.language]
type = "text"
attribute = "data-nd-language"
doc = "Which language to read it as: `rust`, `ts`, `sh`, `diff`. An alias resolves to its language, and a name nothing recognises renders as plain text. Free text rather than an enum, because the list lives in `spec/grammars/`."

[prop.theme]
type = "enum"
values = ["auto", "spectrum", "duotone", "muted", "mono"]
variants = false
default = "auto"
attribute = "data-nd-code-theme"
doc = "Which syntax theme paints it. `auto` follows the reader's page setting, and resolves to `mono` under more contrast, a monochrome display, forced colours and print. Any other value overrides both. The attribute is always written."

[prop.filename]
type = "text"
doc = "The file this came from, shown in the bar above the block. It is also the accessible name of the scrollable region, which otherwise falls back on the language."

[prop.caption]
type = "text"
doc = "A sentence under the block, in the reader's language."

[prop.numbered]
type = "bool"
default = "false"
attribute = "data-nd-numbered"
doc = "Whether every line is numbered. Off by default. The numbers are drawn by a CSS counter and are not selectable, so copying the block copies the code and not a column of digits."

[prop.start_line]
type = "text"
doc = "What the first line is numbered, for an excerpt that starts partway into a file. Text, because a spec prop is text, an enum or a flag. It is parsed, and anything unparseable is 1."

[prop.mark_lines]
type = "text"
doc = "Lines to emphasise, as `3,7-9`. Each marked line gets a tint and a rule down its leading edge. A line singled out by colour alone cannot be found by a dichromat."

[prop.focus]
type = "bool"
default = "false"
attribute = "data-nd-focus"
doc = "Whether every line `mark_lines` did not name is dimmed. Off by default, and it does nothing without marks. It is a separate flag rather than a mode, so the marking and the dimming are set apart."

[prop.wrap]
type = "bool"
default = "false"
attribute = "data-nd-wrap"
doc = "Whether long lines wrap instead of scrolling. Off by default. Prefer wrapping where the line is prose-like and scrolling where it is structure."

[prop.max_lines]
type = "text"
doc = "Collapses the block to this many lines behind a control. **With the script blocked the whole block is visible** and no control claims otherwise, because the collapse is an enhancement."

[prop.expand_label]
type = "text"
doc = "The name of the control that opens a collapsed block. Its presence is the opt-in: with no name there is no collapse, because this package cannot name a chevron in the reader's language."

[prop.collapse_label]
type = "text"
doc = "The name that control takes once the block is open."

[prop.wrap_label]
type = "text"
doc = "The name of the control that toggles wrapping. Its presence is the opt-in, for the same reason."

[prop.copy]
type = "text"
doc = "The accessible name of the copy control, and the opt-in for it: with no name there is no control. It copies the original text, never the markup and never the line numbers."

[prop.copied]
type = "text"
doc = "What the live region says once the copy succeeds. Without it the control still works and still swaps its glyph, but a screen reader user gets no confirmation."

[prop.glass]
type = "bool"
default = "false"
attribute = "data-nd-glass"
doc = "Frosts the block. Off by default, and rarely right, because code is read for a long time and a moving backdrop under it makes that harder."

[keyboard]
"Tab" = "Reaches the code, then the controls in the bar. The code is its own focusable element rather than the `<pre>`."
"Arrow keys" = "Scroll the code once it has focus. A block that scrolls and cannot be focused fails WCAG 2.1.1."

[a11y]
notes = """
Colour is never the only signal: a comment is italic, a keyword is bold, and a
marked line carries a rule at its edge. The scrollable region is reachable by
keyboard and named by `filename` or the language.
"""
