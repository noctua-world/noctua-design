[meta]
name = "Truncate"
element = "span"
class = "nd-truncate"
summary = "Clip text to a fixed number of lines and keep the full value available."
ai = "custom"

[prop.lines]
type = "enum"
values = ["1", "2", "3", "4"]
default = "1"
attribute = "data-nd-lines"
doc = "How many lines are shown before the text is clipped: 1, 2, 3 or 4. One line by default."

[prop.title]
type = "text"
attribute = "title"
doc = "The full text, written into the `title` attribute. Pointer users see it on hover."

[prop.children]
type = "children"
doc = "The text to clip."

[a11y]
# NO NAME IS OWED, AND ASKING FOR ONE WAS THE DEFECT. This said `needs_name`
# on a role-less `<span>` with no naming prop, so the reference printed a
# requirement nothing here can satisfy, one line above the note saying the
# clipping is visual. It also made the variant grid stamp `aria-labelledby` on
# every specimen, which replaced the clipped text in the accessible tree with
# the caption beside it — the one thing this component promises not to do.
notes = "The clipping is visual only. The full text stays in the accessible tree, so a screen reader reads the whole value. Cutting the announcement too would hide content from readers who cannot see the ellipsis."
