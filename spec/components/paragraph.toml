[meta]
name = "Paragraph"
element = "p"
class = "nd-paragraph"
summary = "Render a paragraph of prose."
ai = "inline"

[prop.size]
type = "enum"
values = ["small", "body", "lead"]
default = "body"
attribute = "data-nd-size"
doc = "The text size, from the type scale: `small`, `body` or `lead`. `body` is the default."

[prop.tone]
type = "enum"
values = ["default", "muted", "danger", "success"]
default = "default"
attribute = "data-nd-tone"
doc = "The colour of the text: `default`, `muted` for text that supports the text around it, `danger` or `success`. The words say what went wrong or right, because a colour alone tells some readers nothing."

[prop.children]
type = "children"
doc = "The text."
