# When to reach for it, and when not to. Top-level rather than inside
# [meta], because a bare key after a table header belongs to that table.
guidance = """
Use an icon beside a word, where the drawing repeats what the word says. On its
own it needs a `label`. A control that is only a drawing is
`Button { hide_label }` rather than a clickable icon.
"""

[meta]
name = "Icon"
element = "svg"
class = "nd-icon-glyph"
# A NAME, WHICH THE VARIANT GRID TURNS INTO THAT DRAWING. A component whose
# picture is a drawing cannot carry markup for one: `spec/` is source, and a
# hand-written `<svg>` in it is what `gates::hand_drawn_icon` refuses.
# `pages::icon_markup` reads the geometry out of the generated module instead.
specimen = "palette"
summary = "Draw one of the declared icons, at the size of the text it stands beside."

# WHY THIS COMPONENT IS IN THE CATALOGUE AND ITS DRAWINGS ARE NOT.
#
# `/icons/` is the gallery: every drawing this system has, what each one means,
# and where it was vendored from. It answers *which icon*. This page answers
# what the component does — the three sizes, what an unlabelled one promises
# assistive technology, and why the name is a type rather than a string. Those
# are two questions and they had one page between them.
#
# AND THERE IS STILL ONE `Icon`. It was generated by
# `crates/noctua-design-emit/src/icons.rs` into a module of its own, outside the
# catalogue, so it had no props table and could not be found by searching for
# `size`. Adding a contract beside that emitter would have produced a SECOND
# component of the same name in the same crate, shadowed by the explicit
# re-export in `lib.rs` and reported by nothing. So the body moved into
# `controls.rs` and the icon emitter stopped writing those two files: one
# contract, one component, one name.
#
# WHAT THE ICON EMITTER STILL OWNS is everything that is about the drawings
# rather than about the component — `IconName`, `dist/icons.json`, the
# attribution, and the stroke weight both bodies read from
# `noctua_design_icons::STROKE_WIDTH`.

[prop.icon]
type = "text"
required = true
attribute = "data-nd-icon"
doc = """
Which drawing, by the name `spec/icons.toml` gives it. **Required**, and a real
type in both languages rather than a string. A name that is not an icon is then
a compile error instead of an empty box on a page.
"""

[prop.label]
type = "text"
attribute = "aria-label"
doc = """
Its accessible name. Absent is the common case and makes the icon `aria-hidden`,
which is right beside a word that already says it. Give one only where the
drawing carries the whole message.
"""

[prop.size]
type = "enum"
values = ["small", "medium", "large"]
default = "medium"
attribute = "data-nd-size"
doc = """
The rendered box, as a step of the type scale: the small step, the body step and
the h3 step. The drawing is `1em`, so an icon with no size takes the size of the
text around it.
"""

[a11y]
notes = """
An unlabelled icon is `aria-hidden` and `focusable="false"`, so it reaches no
screen reader and no tab order. A `label` makes it a `role="img"` carrying that
name instead, and the two states are exclusive.
"""
