# The long-form container, and the only thing that owns the measure.
#
# NOCTUA.md §9.7: the page may be as wide as the screen, the LINE may not. The
# cap belongs on the reading column rather than on a layout container, which is
# what leaves the rest of the width free for anything that is not prose.
[meta]
name = "Prose"
element = "div"
class = "nd-prose-block"
# The still picture needs REAL CHILDREN. Without this the grid falls
# back to the pangram placeholder, so every value of every enum prop
# draws one identical line of text — which is what the reader saw.
specimen = "<h3 class=\"nd-heading nd-identifier\" data-nd-size=\"h3\">Aa bb cc</h3><p class=\"nd-paragraph nd-identifier\" data-nd-size=\"body\">Aa bb cc dd ee ff gg hh ii jj kk ll mm nn oo pp qq rr ss tt uu vv ww xx yy zz aa bb cc dd ee ff gg hh ii jj kk ll mm nn oo pp qq rr ss tt</p>"
summary = "Holds long-form text in a column that caps its own line length."

[prop.measure]
type = "enum"
values = ["default", "lead", "none"]
default = "default"
attribute = "data-nd-measure"
doc = "Which line-length cap to apply. `default` is the reading measure and `lead` is the narrower one for an opening paragraph. `none` is for prose inside a column that already constrains it."

[prop.children]
type = "children"
doc = "The content."
