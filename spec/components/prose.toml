# The long-form container, and the only thing that owns the measure.
#
# NOCTUA.md §9.7: the page may be as wide as the screen, the LINE may not. The
# cap belongs on the reading column rather than on a layout container, which is
# what leaves the rest of the width free for anything that is not prose.
[meta]
name = "Prose"
element = "div"
class = "nd-prose-block"
summary = "Holds long-form text in a column that caps its own line length."

[prop.measure]
type = "enum"
values = ["default", "lead", "none"]
default = "default"
attribute = "data-nd-measure"
doc = "Which line-length cap to apply. `default` is the reading measure and `lead` is the narrower one for an opening paragraph. `none` is for prose inside a column that already constrains it."

# A DOCUMENT'S RHYTHM, FOR PROSE A PROGRAM WROTE. Without it a column puts one
# gap between every two blocks and leaves each heading its own room above. A
# help page drawn from Markdown (`NOCTUA.md §12.16`) is a run of blocks nobody
# spaced by hand, so the column spaces them: a heading starts a section and
# sits nearer what it heads than what it ends, and the first block starts at
# the top. Margins rather than the gap, because a gap cannot tell a heading's
# two sides apart.
[prop.flow]
type = "bool"
default = "false"
attribute = "data-nd-flow"
doc = """Spaces the blocks inside as a document. A heading gets more room above it than below, the first block none, and a break keeps its own. Use it for prose a program wrote, such as a page drawn from Markdown."""

[prop.children]
type = "children"
doc = "The content."
