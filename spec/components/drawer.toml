guidance = """
Use a drawer for a panel that opens along one edge of a window and stays beside the work. It is not modal. For a surface that must be answered first, use `Dialog`. At the bottom, put it in a flex column whose work has `flex: 1 1 0`.
"""

[meta]
name = "Drawer"
element = "div"
class = "nd-drawer"
page = "drawer"
summary = "Open a panel along one edge of a window, beside the work and never over it."

# A REGION BESIDE THE WORK, NOT A SURFACE OVER IT.
#
# The drawer of an application window is the region below its footer
# (`NOCTUA.md §12.11`). It is in the flow of the window: opening it takes room
# from what is above it and covers nothing, so no control the keyboard is on is
# ever hidden behind it (WCAG 2.4.11). It is not modal. Nothing behind it is
# inert, the focus walks in and out with Tab, and no key is taken from the
# window but Escape while the focus is inside.
#
# HOW FAR IT OPENS. Along the edge it opens from, a drawer is as large as what
# is in it and never larger than its cap, `--noctua-shell-drawer-max` of the
# room it divides with the work. With `share` it is that share of the room
# exactly, held to the same cap. Below a footer the room is what the footer
# leaves, so a drawer is shorter than the work above it in a window of any
# height. The element around a drawer needs a size of its own on that axis: a
# window is one, and a box as tall as its content is not. Past its size, the
# content scrolls and the rails stay.
#
# WHAT THE WINDOW OWES A DRAWER AT THE BOTTOM. A column laid out by flex, in
# which the work is the one other part that grows, from nothing (`flex: 1 1
# 0`). The drawer takes its share as a flex factor against the work's, which is
# how it is a share of what the footer leaves and not of the whole window.
#
# AND WHAT ANY OTHER WINDOW GETS. A box with a height of its own that is no
# flex column reads no factor, so there the drawer is its share of the whole
# box, under the same ceiling of its content. A flex column whose work starts
# from its content (`flex: 1 1 auto`) can leave nothing to hand out, and there
# an open drawer stands at its floor, `--noctua-target-min`: it was once drawn
# at no height with the focus inside it. `crates/noctua-design-styles/src/drawer.css`
# holds both, and `tests/browser/drawer.spec.js` asks for each.
#
# WHAT IS IN IT. Up to two `DrawerRail`s and one element of content, in the
# order the keyboard should reach them. The content is the caller's own
# element. It scrolls when it is taller than the drawer, so content with
# nothing focusable in it needs a `tabindex` of the caller's to be scrolled
# from the keyboard.
#
# COLLAPSED, IT IS OUT OF EVERYTHING, AND WHAT IS IN IT IS KEPT. The stylesheet
# takes it to nothing along its edge and hides it, which takes it out of the
# tab order and out of the accessibility tree with no script at all.
# `dist/drawer.js` writes `inert` as well, so nothing in it can be reached
# while it slides shut.
#
# THE CALLER TURNS IT, AND THE SCRIPT SAYS ONE THING. `collapsed` is a prop.
# Escape with the focus inside says `nd-drawer-dismiss` with the drawer's
# `name`, and what that closes is the caller's to decide: the page in focus, a
# step back in it, or the whole drawer. The script moves the focus once: out of
# a drawer that collapses around it, to where the focus was before it came in.
# It never moves the focus in. Where the specification is silent, that is the
# reading taken: opening a region is not a reason to take the keyboard from
# what the reader was typing in.

[prop.name]
type = "text"
required = true
attribute = "data-nd-drawer"
doc = "What this drawer is, as a script finds it. It is the `name` in `nd-drawer-dismiss`. Required."

# AN ID OF ITS OWN, FOR THE CONTROL THAT TURNS IT. A control that opens or
# shuts a drawer names it in `aria-controls` and says in `aria-expanded`
# whether it is open, and `aria-controls` takes an id.
[prop.id]
type = "text"
attribute = "id"
doc = "The drawer's id, for the control that opens and shuts it to name in `controls`."

[prop.label]
type = "text"
required = true
attribute = "aria-label"
doc = "The name of the drawer, in the reader's language. It becomes `aria-label` on the `region`. Required."

[prop.side]
type = "enum"
values = ["bottom", "start", "end"]
default = "bottom"
attribute = "data-nd-side"
# A drawer opens to a share of the WINDOW around it. A picture of one alone has
# no window, so no share is taken and the three values draw one box.
variants = false
doc = "The edge it opens from: `bottom`, `start` or `end`. At the bottom it grows to `--noctua-shell-drawer-max` of the room a footer leaves. That needs a flex column whose work has `flex: 1 1 0`. Any other box gives it that share of the whole box."

# THE SHARE THE CALLER KEEPS FOR IT. An interface that lets a reader resize its
# drawer holds a share in its state and draws the drawer at it, whatever is in
# the drawer. It is an attribute and the stylesheet has a rule for each whole
# percentage, so it is drawn with no `style` attribute and no script: a page
# served under `style-src 'self'` has every `style` attribute refused.
#
# A value that is no whole number from 1 to 100 writes nothing, and the drawer
# is as large as its content. Neither body guesses at one.
[prop.share]
type = "text"
attribute = "data-nd-share"
doc = "A whole percentage from `1` to `100`, held to `--noctua-shell-drawer-max`. It is of the room a footer leaves, in a flex column whose work has `flex: 1 1 0`. In any other box it is of the whole box. Without it the drawer is as large as its content."

[prop.collapsed]
type = "bool"
default = "false"
attribute = "data-nd-collapsed"
doc = "Whether the drawer is shut. A collapsed drawer keeps what is in it and shows none of it. It is out of the tab order and hidden from assistive technology."

[prop.children]
type = "children"
doc = "The rails and the content, in the order the keyboard reaches them: up to two `DrawerRail`s and one element between them."

[a11y]
needs_name = true
role = "region"
notes = """
A `role="region"`, named by `label`. It is not modal: nothing behind it is inert and Tab leaves it. Collapsed, it is hidden and `inert`. Open at the bottom it is at least `--noctua-target-min` tall, so the focus is never in a drawer of no height.
"""

[keyboard]
Tab = "Moves through the drawer and out of it. Nothing is held inside."
Escape = "Says `nd-drawer-dismiss` with the drawer's `name`. A surface open inside the drawer takes the key first."
