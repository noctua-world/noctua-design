# What a `MessageBar` has to do, in both languages, in a real browser.

[[case]]
name = "it announces itself as a status without interrupting"
note = "`role=\"status\"` is polite: a screen reader finishes the sentence it is on before reading it. `alert` is the other one, and using it for anything that is not urgent is how a page becomes something a reader turns the announcements off for."
props = { tone = "warning" }
children = "The export is missing two columns."
expect = { attrs = { role = "status" }, text = "The export is missing two columns." }

[[case]]
name = "a dismissible bar carries the control that takes it away"
note = "`[keyboard]` promises Enter or Space on that control, and it gets both by being a `<button>`. `dist/message-bar.js` is what reveals it, so a page with no script shows no control it cannot honour."
props = { tone = "warning", dismissible = true, dismiss_label = "Dismiss" }
children = "The export is missing two columns."
expect = { attrs = { "data-nd-dismissible" = "true" } }

[[case]]
name = "an alert interrupts, and says so"
note = "The two live regions are different promises. A bar that says `alert` and means `status` interrupts a reader for nothing."
props = { tone = "danger", alert = true }
children = "The upload failed."
expect = { attrs = { role = "alert" } }

[[case]]
name = "a line says it is one, and the time left is drawn only by a script counting"
note = "`presentation` is what the stylesheet draws a line from. A deadline that has passed is the one a case can freeze: the script draws no time left and stops there, and the polite region is in the document from the start, because a region written in the task that inserted it announces nothing."
props = { presentation = "line", tone = "danger", alert = true, deadline = "0", countdown_label = "one:{count} second left|other:{count} seconds left" }
children = "The local server is not running."
expect = { attrs = { "data-nd-presentation" = "line", role = "alert", "data-nd-deadline" = "0" }, visible = ["[data-nd-message-bar-countdown]"], present = ["[data-nd-message-bar-said]"] }

[[case]]
name = "with no deadline there is nothing to count"
note = "The countdown and its region are rendered only where a deadline is, so a bar that counts nothing carries no empty timer for a screen reader to land on."
props = { presentation = "line", tone = "danger" }
children = "The local server is stopped."
expect = { attrs = { "data-nd-presentation" = "line" }, absent = ["data-nd-deadline"], hidden = ["[data-nd-message-bar-countdown]", "[data-nd-message-bar-said]"] }

[[case]]
name = "the action is a button carrying the caller's hook"
note = "The press is the caller's own code, so the control is found by `data-nd-action`, as a `Button` with an `action` is. It is visible with or without this package's script, because nothing here answers it."
props = { presentation = "line", tone = "danger", action_label = "Restore now", action = "restore" }
children = "The local server is not running."
expect = { visible = ["button.nd-message-bar-action[data-nd-action='restore']"] }
