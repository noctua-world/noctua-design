# When to reach for it, and when not to. Top-level rather than inside
# [meta], because a bare key after a table header belongs to that table.
guidance = """
Use a time input to ask for one time of day, in separate labelled boxes for the
hour, the minute and sometimes the second. `clock` follows the reader's locale.
The form posts a twenty-four hour value whatever they were shown.
"""

[meta]
name = "TimeInput"
element = "fieldset"
class = "nd-time-input"
# Drawn numerals rather than live boxes: a specimen of a `needs_name` component
# must not render a nameless control. `DateInput` says the same.
specimen = "<span class=\"nd-time-input-figure\"><span class=\"nd-identifier\">09</span><span class=\"nd-identifier\">30</span></span>"
summary = "Asks for one time of day, in separate boxes, on the reader's own clock."

[prop.name]
type = "text"
required = true
attribute = "data-nd-time-input"
doc = "The field's name and the root of every id in it. The boxes post `{name}-hour`, `{name}-minute` and, with `seconds`, `{name}-second`. **Required**."

[prop.legend]
type = "text"
required = true
doc = "The question, in the reader's language, drawn by `Field` as a real `<legend>`. **Required**, because a fieldset with no legend gives a screen reader a group with no name."

[prop.hour_label]
type = "text"
required = true
doc = "The name of the first box, in the reader's language. **Required**, because the `<legend>` names the group rather than any one box, and three numbered boxes need three names."

[prop.minute_label]
type = "text"
required = true
doc = "The name of the second box, in the reader's language. **Required**, for the same reason."

[prop.second_label]
type = "text"
doc = "The name of the third box, in the reader's language. Wanted in practice by `seconds`."

[prop.meridiem_label]
type = "text"
doc = "The name of the morning and afternoon control, where the reader's locale has one. Wanted in practice by `clock = \"auto\"` or `\"12\"`, because the control appears only for some readers."

[prop.am_label]
type = "text"
attribute = "data-nd-am-label"
doc = "The word for before noon in the reader's language, such as *AM* or *Manhã*. Not derived, because the platform's own formatter spells it differently in each locale."

[prop.pm_label]
type = "text"
attribute = "data-nd-pm-label"
doc = "The word for after noon, on the same terms."

[prop.value]
type = "text"
attribute = "data-nd-value"
doc = "The time to start with, as `HH:MM` or `HH:MM:SS` on a twenty-four hour clock. That is the shape a server sends and the shape it gets back, whatever clock the reader is shown."

[prop.seconds]
type = "bool"
default = "false"
attribute = "data-nd-seconds"
doc = "Whether a third box asks for seconds. Off by default, because few of the things people schedule happen at a named second."

[prop.clock]
type = "enum"
values = ["auto", "12", "24"]
variants = false
default = "auto"
attribute = "data-nd-clock"
doc = "Which clock the boxes are read on. `auto` asks the reader's own locale. `12` and `24` are for a page whose subject has a clock of its own, such as a flight schedule. **What is submitted is twenty-four hour either way**."

[prop.min]
type = "text"
attribute = "data-nd-min"
doc = "The earliest time allowed, as `HH:MM`. A time before it is refused with `min_label` rather than rewritten, so the reader's own numbers stay."

[prop.max]
type = "text"
attribute = "data-nd-max"
doc = "The latest time allowed, on the same terms. It may be **earlier** than `min`, which is how a window that crosses midnight is stated."

[prop.step]
type = "text"
attribute = "data-nd-step"
doc = "How many minutes one press of an arrow moves the minute box. One by default. A booking form usually wants fifteen, so a reader reaches `:45` in three presses."

[prop.now_label]
type = "text"
attribute = "data-nd-now-label"
doc = "The name of a control that fills the boxes with the current time. Absent, there is no such control."

[prop.required_label]
type = "text"
attribute = "data-nd-required-label"
doc = "What it says when the boxes are empty and an answer was needed. The platform cannot say it, because `required` on three boxes refuses each of them separately."

[prop.missing_label]
type = "text"
attribute = "data-nd-missing-label"
doc = "What it says when some boxes are filled and others are not, with a `{part}` hole naming the empty one. Half a time is the commonest way this field goes wrong."

[prop.invalid_label]
type = "text"
attribute = "data-nd-invalid-label"
doc = "What it says when the numbers are not a time, such as twenty-five o'clock. It has a `{value}` hole, and the numbers stay exactly as typed."

[prop.min_label]
type = "text"
attribute = "data-nd-min-label"
doc = "What it says before `min`, with a `{min}` hole."

[prop.max_label]
type = "text"
attribute = "data-nd-max-label"
doc = "What it says after `max`, with a `{max}` hole."

[prop.hint]
type = "text"
doc = "What a reader needs to know before answering, such as *For example, 09 30*. Drawn by `Field`, and carried on the fieldset's `aria-describedby` so it is read with the group."

[prop.error]
type = "text"
doc = "What is wrong, after a submission. The caller's own sentence, with `role=\"alert\"`."

[prop.required]
type = "bool"
default = "false"
attribute = "required"
doc = "Whether an answer is needed. It goes on every box, and the sentence a reader gets when they leave one empty is `missing_label` rather than the platform's."

[prop.disabled]
type = "bool"
default = "false"
attribute = "disabled"
doc = "Stops users changing any of the boxes. It uses the real `disabled` attribute, which also keeps the value out of the submitted form."

[prop.pad]
type = "bool"
default = "true"
attribute = "data-nd-pad"
doc = "Whether a single digit is shown as `09` when the box loses focus. **On by default**, so a column of times is two digits throughout. It never pads while the box has focus, where the zero would be a character to delete."

[prop.size]
type = "enum"
values = ["small", "medium", "large"]
variants = false
default = "medium"
attribute = "data-nd-size"
doc = "The size of the boxes, matching the rest of the form."

[prop.glass]
type = "bool"
default = "false"
attribute = "data-nd-glass"
doc = "Whether the boxes are frosted, over a ground opaque enough to read two digits against."

[state.invalid]
attribute = "aria-invalid"
doc = "Set when one of the messages above applies. Every box takes the danger tone rather than the offending box alone, because the wrong answer is the time."

[state.resolved]
attribute = "data-nd-resolved"
doc = "Set when the script has re-laid the boxes to the reader's clock. It sits on the fieldset, so a test can tell a served twenty-four hour row from a chosen one."

[a11y]
needs_name = true
notes = """
It is a `<fieldset>` with a `<legend>`, and every box has its own name, because
a `<label>` points at one element. The messages are the caller's sentences in
one live region rather than the platform's three bubbles.
"""

[keyboard]
"Up arrow / Down arrow" = "Steps the box that has focus by one hour, one `step` of minutes or one second, and wraps at the ends."
"Left arrow / Right arrow" = "Moves between the boxes, at the ends of what is typed. Inside a number the arrows move the caret."
"A separator, or a full box" = "Moves to the next box. Typing `0930` or `9:30` fills both boxes with no keystroke in between."
"Backspace in an empty box" = "Moves back to the previous box and puts the caret at its end."
