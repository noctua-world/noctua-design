[meta]
name = "Del"
element = "del"
class = "nd-del"
# One of the marks that go inside a sentence, documented with the others.
page = "inline-text"
summary = "Shows text that has been removed from the document."

[prop.cite]
type = "text"
attribute = "cite"
doc = "A URL explaining the change."

[prop.datetime]
type = "text"
attribute = "datetime"
doc = "When the text was removed, as a machine-readable timestamp."

[prop.label]
type = "text"
doc = "A word read out before the text to say that it was removed. Supply it in the reader's language, because this package ships no reader-facing words of its own."

[prop.children]
type = "children"
doc = "The removed text."

[a11y]
notes = """
Most screen readers do not report a strikethrough, so deleted text sounds the
same as current text. `label` is the word that says it was removed, and it is
needed when the deletion carries meaning."""
