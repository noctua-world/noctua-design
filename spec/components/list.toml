[meta]
name = "List"
element = "ul"
class = "nd-list"
# The still picture needs REAL CHILDREN. Without this the grid falls
# back to the pangram placeholder, so every value of every enum prop
# draws one identical line of text — which is what the reader saw.
specimen = "<li class=\"nd-list-item nd-identifier\">Aa</li><li class=\"nd-list-item nd-identifier\">Bb</li><li class=\"nd-list-item nd-identifier\">Cc</li>"
summary = "Group items as an ordered, unordered or description list, with nesting."

[prop.kind]
type = "enum"
values = ["unordered", "ordered", "description"]
elements = ["ul", "ol", "dl"]
default = "unordered"
doc = "Which kind of list to render: `unordered` is a `<ul>`, `ordered` an `<ol>`, `description` a `<dl>`. It changes the element and not only the marker, so a screen reader is told the right thing."

[prop.marker]
type = "enum"
values = ["default", "none"]
default = "default"
attribute = "data-nd-marker"
doc = "The marker on each item. `none` removes it and keeps the list semantics. `default` draws it, and is the default."

[prop.spacing]
type = "enum"
values = ["tight", "default", "loose"]
default = "default"
attribute = "data-nd-spacing"
doc = "The gap between items: `tight`, `default` or `loose`."

[prop.children]
type = "children"
doc = "The list items."

[a11y]
# THE ROLE IS WRITTEN NOW, AND THIS SENTENCE USED TO BE THE ONLY PLACE IT
# EXISTED. Nothing emitted `role="list"`, while the stylesheet did both things
# that take the role away: every list is a flex column and `marker: none`
# removes the marker. A `<dl>` is left alone, because `list` is the role of a
# `<ul>` and an `<ol>` and a description list maps differently.
notes = "`marker: none` removes the visual marker only. A flex list and a marker-less one each lose their semantics in some engines, so `list` and `listitem` are restated. A description list keeps its own mapping."
