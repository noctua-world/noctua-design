guidance = """
Use an avatar group to show several people as one thing, such as the reviewers
on a change or the members of a room. Name the group with `label`, pass the
avatars to show as children, and write `more` for the people not shown.
"""

[meta]
name = "AvatarGroup"
element = "ul"
class = "nd-avatar-group"
page = "avatars"
summary = "Shows several people as one overlapping group, with a count for the rest."

[prop.label]
type = "text"
required = true
doc = "The name of the group, such as *Reviewers* or *In this room*. **Required**, because the group is a `role=\"list\"` and a list with no name gives a screen reader only its length. `Toolbar` and `Pagination` require one too."

[prop.more]
type = "text"
doc = "The word for the people not shown, such as `+5` or `mais 5`. The caller writes it, because the wording changes with the language. Absent, no counter is drawn, which suits a group showing everyone."

[prop.more_label]
type = "text"
doc = "What the counter means, as a whole phrase: *5 more reviewers*. The chip holds two characters, so this is the only accessible name it has. Wanted in practice by `more`."

[prop.more_href]
type = "text"
doc = "Where the counter leads, usually the full list on a page of its own. With it the counter is a real `<a>`. Without it the counter is not a control and takes no focus."

[prop.size]
type = "enum"
values = ["small", "medium", "large"]
default = "medium"
attribute = "data-nd-size"
doc = "The size of everyone in the group, stated once. It overrides each `Avatar`'s own `size`, so the faces in one row always share a box (`NOCTUA.md §9.7`)."

[prop.shape]
type = "enum"
values = ["circle", "rounded", "square"]
default = "circle"
attribute = "data-nd-shape"
doc = "The corner shape of everyone in the group, stated once. It overrides each `Avatar`'s own `shape`, for the same reason as the size."

[prop.overlap]
type = "enum"
values = ["tight", "loose", "none"]
default = "loose"
attribute = "data-nd-overlap"
doc = "How much each face covers the one before it. Use `none` when the faces are links, because an overlapped avatar leaves a crescent smaller than the 24-pixel target WCAG 2.5.8 asks for. A group too wide for its column **scrolls** rather than wrapping."

[prop.children]
type = "children"
doc = "The avatars, in the order they should be read. Each becomes one item of the list, and the counter is the last item of that list rather than something beside it."

[a11y]
notes = """
A `role="list"` with a required name. The counter is the last item of the list
rather than something beside it, so the item count a screen reader reads out
includes it. Every avatar keeps its own name.
"""
