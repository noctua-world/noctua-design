# A heading, with its semantic level decoupled from its visual size.
#
# The two are separate props because they answer different questions: the level
# is document structure, which assistive technology navigates by, and the size
# is typography. Tying them together forces a choice between a correct outline
# and a correct-looking page, and the page usually wins.
[meta]
name = "Heading"
element = "h2"
class = "nd-heading"
summary = "Set a heading's outline level and its visual size independently."
ai = "inline"

[prop.level]
type = "enum"
values = ["1", "2", "3", "4", "5", "6"]
elements = ["h1", "h2", "h3", "h4", "h5", "h6"]
default = "2"
# Document structure, not appearance — the contract says so in the doc
# below. Six values, one picture, by design.
variants = false
doc = "The outline level, from `1` to `6`, rendered as `<h1>` to `<h6>`. This is document structure rather than appearance."

[prop.size]
type = "enum"
values = ["display", "h1", "h2", "h3", "h4", "lead"]
default = "h2"
attribute = "data-nd-size"
doc = "The visual size, from the type scale: `display`, `h1`, `h2`, `h3`, `h4` or `lead`. Independent of `level`."

[prop.tone]
type = "enum"
values = ["default", "muted", "accent"]
default = "default"
attribute = "data-nd-tone"
doc = "How much the heading stands out. `muted` suits a heading over supporting material, and `accent` suits a heading that is also a signal."

[prop.balance]
type = "bool"
default = "false"
attribute = "data-nd-balance"
doc = "Whether the line lengths are balanced. For a heading that wraps onto more than one line."

[prop.children]
type = "children"
doc = "The heading text."

[a11y]
notes = "The level must not skip. An `<h2>` followed by an `<h4>` leaves a gap in the outline a screen reader navigates by. Choose the level from the document and the size from the design."
