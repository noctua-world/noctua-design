[meta]
name = "Link"
element = "a"
class = "nd-a"
summary = "Links to another page, and marks the links that leave the site."

[prop.href]
type = "text"
attribute = "href"
doc = "The destination."

[prop.external]
type = "bool"
default = "false"
attribute = "data-nd-external"
doc = "Whether the link leaves the site. It draws a small external-link icon after the link text."

[prop.rel]
type = "text"
attribute = "rel"
doc = "The `rel` attribute of the link. Use `noreferrer` on anything that leaves the site."

[prop.tone]
type = "enum"
values = ["accent", "inherit"]
default = "accent"
attribute = "data-nd-tone"
doc = "The colour of the link text. `accent` is the link colour, and `inherit` takes the colour of the text around it, for a link inside a coloured run."

[prop.children]
type = "children"
doc = "The link text."

[a11y]
needs_name = true
notes = """
The link text is the accessible name, so it has to make sense out of context. A
page of links all called *here* cannot be navigated with a screen reader. The
external icon carries `aria-hidden`.
"""
