[meta]
name = "Link"
element = "a"
class = "nd-a"
summary = "A link, with the affordance an external destination needs."

[prop.href]
type = "text"
attribute = "href"
doc = "The destination."

[prop.external]
type = "bool"
default = "false"
attribute = "data-nd-external"
doc = "Marks the link as leaving the site, which adds a visible affordance."

[prop.tone]
type = "enum"
values = ["accent", "inherit"]
default = "accent"
attribute = "data-nd-tone"
doc = "`inherit` is for a link inside a run of coloured text that must not break the line's colour."

[prop.children]
type = "children"
doc = "The link text."

[a11y]
needs_name = true
notes = """
The text is the accessible name, so it has to make sense read out of context:
a page full of links called "here" is a page a screen-reader user cannot
navigate. An external link's affordance is visual AND textual — the icon is
decorative and the destination is announced."""
