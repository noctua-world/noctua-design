[meta]
name = "Ins"
element = "ins"
class = "nd-ins"
# One of the marks that go inside a sentence, documented with the others.
page = "inline-text"
summary = "Mark text that was added to the document."

[prop.cite]
type = "text"
attribute = "cite"
doc = "A URL explaining the change."

[prop.datetime]
type = "text"
attribute = "datetime"
doc = "When it was added, as a machine-readable timestamp."

[prop.label]
type = "text"
doc = "A word read before the text to say that it was added. Supply it in the reader's language, as `Del` does."

[prop.children]
type = "children"
doc = "The added text."

[a11y]
notes = "Screen readers do not announce the underline, so inserted text is read like the text around it. Use `label` to state that it was added."
