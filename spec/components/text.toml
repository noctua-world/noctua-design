[meta]
name = "Text"
element = "span"
class = "nd-text"
# One of the marks that go inside a sentence, documented with the others.
page = "inline-text"
summary = "Set the size, weight and tone of a run of text, from the type scale."

[prop.size]
type = "enum"
values = ["caption", "small", "body", "lead"]
default = "body"
attribute = "data-nd-size"
doc = "The size, from the type scale: `caption`, `small`, `body` or `lead`. Defaults to `body`."

[prop.weight]
type = "enum"
values = ["regular", "medium", "semibold", "bold"]
default = "regular"
attribute = "data-nd-weight"
doc = "The weight: `regular`, `medium`, `semibold` or `bold`. Defaults to `regular`."

[prop.tone]
type = "enum"
values = ["default", "muted", "accent"]
default = "default"
attribute = "data-nd-tone"
doc = "How much the text stands out: `default`, `muted` for secondary text, or `accent`. Defaults to `default`."

[prop.numeric]
type = "bool"
default = "false"
attribute = "data-nd-numeric"
doc = "Whether the figures are tabular, so digits line up in a column. Off by default."

[prop.children]
type = "children"
doc = "The text."
