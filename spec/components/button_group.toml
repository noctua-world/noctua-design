# When to reach for it, and when not to. Top-level rather than inside
# [meta], because a bare key after a table header belongs to that table.
guidance = "Use a button group for two or more buttons that are one decision, such as a split button or a row of actions. For a value chosen from a list, use `Segmented`, which marks one member as chosen."

[meta]
name = "ButtonGroup"
element = "div"
class = "nd-button-group"
summary = "Group buttons that belong together, joined into one control or spaced apart."

[prop.label]
type = "text"
attribute = "aria-label"
doc = "The group's accessible name, saying what the buttons are for. Required unless `labelledby` names it instead, because a `role=\"group\"` with no name gives a screen reader only the word `group`."

[prop.labelledby]
type = "text"
attribute = "aria-labelledby"
doc = "The id of the element that names this group, when the name is already visible on the page."

[prop.attached]
type = "bool"
default = "true"
attribute = "data-nd-attached"
doc = "Whether the buttons share one outline, with the inner corners squared off. Off spaces them apart instead, for actions that are related but separate."

[prop.orientation]
type = "enum"
values = ["horizontal", "vertical"]
default = "horizontal"
attribute = "aria-orientation"
doc = "Which way the buttons run. Vertical stacks them and moves the shared edges to the top and bottom."

[prop.fill]
type = "bool"
default = "false"
attribute = "data-nd-fill"
doc = "Stretches the group across its container and gives every button an equal share of it."

# THE GROUP OWNS THIS, NOT EACH BUTTON, and that is the same answer
# `AvatarGroup.size` gives. A group is the one arrangement where every member
# is wider than its own content, so `justify` stopped being a per-button
# refinement and became a fact about the row: three buttons repeating
# `justify: start` is three chances to forget the fourth, and a group whose
# members disagree about where their words sit reads as broken (`NOCTUA.md
# §9.7`). The stylesheet writes it one class deeper than `Button`'s own rule,
# so the group wins wherever both are stated.
#
# TWO THINGS IN EACH BUTTON AND ROOM BETWEEN THEM, or `start` and `between`
# are one picture. No `specimen` here, though: this component draws ITSELF in a
# grid, so a drawing in the contract would never be reached. The arm that gives
# each button an icon is in `crates/noctua-design-emit/src/specimens.rs`, beside
# the one `Button.justify` already needed.
[prop.justify]
type = "enum"
values = ["center", "start", "between"]
default = "center"
attribute = "data-nd-justify"
doc = "Where the content of every button sits when a button is wider than its content, which is what a vertical group and `fill` both produce. Stated once here, it overrides each `Button`'s own `justify`, so the members of one group cannot disagree."

[prop.children]
type = "children"
doc = "The buttons."

[a11y]
role = "group"
needs_name = true
notes = """
The root carries `role="group"` rather than `toolbar`. A toolbar is one tab stop
walked with the arrow keys, and these are ordinary buttons users tab through.
Name it with `label` or with `labelledby`, never both."""
