# When to reach for it, and when not to. Top-level rather than inside
# [meta], because a bare key after a table header belongs to that table.
guidance = "Use a checkbox when users may pick any number of options from a list, including none. For a setting that takes effect as soon as it is pressed, use `Switch`. For one option out of a short set, use `Segmented`."

[meta]
name = "Checkbox"
# The component's root is the row: an `<input>`, the box drawn beside it, its
# label and its hint. The input is inside, where a `<label for>` can point at
# it and a stylesheet can reach it from its own siblings.
element = "div"
class = "nd-choice nd-checkbox"
summary = "Let users select one or more options, or agree to a single statement."
ai = "custom"

# WHY THE BOX IS 40 PIXELS AND NOT 16.
#
# The browser's own checkbox is about 13 pixels of drawn box, which is under
# the 24px AA minimum WCAG 2.5.8 asks for and nowhere near its 44px AAA target.
# The box here is 40px with a 4px gutter, so the hit target is 44 at every size,
# composed from this system's own scale rather than written as a literal:
#
# | `large` (default) | `space-8 + space-2` | 40px |
# | `medium`          | `space-8`           | 32px |
# | `small`           | `space-6`           | 24px |
# | the hit target    | `space-8 + space-3` | 44px, at every size |
#
# `large` is the default because the whole point of the size is that it is the
# one people can hit. `small` exists for a dense table of the same question
# asked forty times, where the words carry the meaning and the box only marks it.

[prop.name]
type = "text"
required = true
attribute = "name"
doc = "The form field name. Every checkbox answering the same question uses the same name. The component builds the label and input ids from it."

[prop.value]
type = "text"
required = true
attribute = "value"
doc = "The value submitted when the box is checked. Required, because a checkbox with no value submits the string `on`."

[prop.label]
type = "text"
required = true
doc = "The visible text for this option. It renders as a `<label for>`, so pressing the words checks the box."

[prop.hint]
type = "text"
doc = "Extra guidance shown under the label. It is linked with `aria-describedby`, so a screen reader reads it after the label."

[prop.checked]
type = "bool"
default = "false"
attribute = "checked"
doc = "Whether the box starts checked. The attribute is omitted when false, because HTML reads its presence rather than its value."

[prop.disabled]
type = "bool"
default = "false"
attribute = "disabled"
doc = "Stops users selecting this option. Uses the real `disabled` attribute, which also keeps the value out of the submitted form."

[prop.invalid]
type = "bool"
default = "false"
attribute = "aria-invalid"
doc = "Marks this single option as invalid. To mark the whole question as invalid, use `Fieldset { error }` instead."

[prop.size]
type = "enum"
values = ["small", "medium", "large"]
default = "large"
attribute = "data-nd-size"
doc = "The size of the drawn box: 40, 32 or 24 pixels. The hit target stays 44 pixels at every size."

[prop.hide_label]
type = "bool"
default = "false"
attribute = "data-nd-hide-label"
doc = "Hides the label visually and keeps it as the accessible name. Use it for a select-all box in a table heading. `label` is still required."

[prop.divider]
type = "text"
doc = "A word shown above this option to separate it from the ones before, such as `or`. Supply it in the reader's language."

[prop.exclusive]
type = "bool"
default = "false"
attribute = "data-nd-exclusive"
doc = "Makes this the none-of-the-above option. Checking it clears every other box in the group, and checking any other box clears it."

[prop.reveal]
type = "bool"
default = "false"
attribute = "data-nd-reveal"
doc = "Whether checking this option reveals the block inside it. Set it explicitly so both implementations behave the same way."

[prop.children]
type = "children"
doc = "The follow-up question revealed when this option is checked. It renders with or without a script."

[state.expanded]
attribute = "aria-expanded"
doc = "Whether the revealed block is showing. The script writes it. Without a script the block is always visible and the attribute is absent."

[a11y]
needs_name = true
notes = """
The component renders a real `<input type="checkbox">`, which provides the role,
the state and the keyboard. The input is transparent and sits over the drawn
box, so it stays in the accessibility tree."""

[keyboard]
"Space" = "Checks or unchecks the box. This is the browser's own behaviour."
