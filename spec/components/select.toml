# When to reach for it, and when not to. Top-level rather than inside
# [meta], because a bare key after a table header belongs to that table.
guidance = "Use a select for one value, or several, out of more than a handful: thirty-nine palettes, two hundred countries. For a short set, keep every option on the page with `Radio` for a question and `Segmented` for a view."

[meta]
name = "Select"
# The root is the field: the label, the hint, the error and the control the
# three of them describe.
element = "div"
class = "nd-select"
# The control itself, at each size. See `Checkbox` for why the specimen of a
# compound component is the part the prop changes — `size` is the control, and
# the label above it would be the same three times.
#
# A DRAWN BOX, NOT A LIVE `<select>`. It used to be the real control, and it was
# the only form control on the site whose variant grid was: every other one
# declares an inert `-figure`, and the stylesheet says why in as many words —
# a specimen of a component that needs a name must not render a nameless one.
# The live version was also focusable, openable, and painted in the platform's
# own chrome rather than this system's, because the rules that give a `<select>`
# its arrow are scoped to the `.nd-select-field` wrapper the specimen has no
# way to carry. Three sizes of the browser's widget is not a picture of this
# component at three sizes.
specimen = "<span class=\"nd-select-figure\"><span class=\"nd-select-box\"></span></span>"
summary = "Let users choose one value, or several, out of more than a list can show."

# IT IS A `<select>`, AND EVERYTHING ELSE IS ADDED TO ONE.
#
# The markup this renders is a working, submittable native control with its
# options inside it. That is not a fallback anybody plans to reach: it is what
# ships, and the listbox `docs-site/assets/shell.js` builds on top reads its
# state from it and writes every choice back into it. So the value that reaches
# a server is the browser's own, the mobile keyboard is the platform's own, and
# a page whose script failed to load is a page that still submits.
#
# The alternative — a `<div role="listbox">` with a hidden `<input>` beside it —
# is what almost every library ships, and it is where the whole category's bugs
# come from: a control that looks right and submits nothing.
#
# EVERY WORD IS A PROP. `NOCTUA.md §9.9` forbids a published component from
# carrying text in any language, and a searchable listbox needs four sentences
# the script has to say. `CodeBlock { copy, copied }` is the precedent; these
# ride on `data-nd-*` for the script to read.

[prop.name]
type = "text"
required = true
attribute = "name"
doc = "The field, as the form submits it. It is also the root of every id here, the label's target, the hint and the error, so a caller writes none of them. Required."

[prop.label]
type = "text"
required = true
doc = "What is being chosen, in the reader's language. A real `<label for>`, because a placeholder disappears the moment a value is chosen and is announced by nothing. Required."

[prop.hint]
type = "text"
doc = "What a reader needs before choosing. `aria-describedby` points at it, so it is read with the control rather than after it."

[prop.error]
type = "text"
doc = "What is wrong with the choice, in the reader's language. Its presence is what makes the field invalid, so a red edge and an explanation always arrive together."

[prop.error_label]
type = "text"
doc = "The word announced before the message, such as `Error:`. Visually hidden, because everything a reader can see already says the field is in error."

[prop.placeholder]
type = "text"
attribute = "data-nd-placeholder"
doc = """What the field says while it is unanswered. On a single select it is also a real `<option value="">` at the top, so an unanswered field submits nothing. On a `multiple` select it is the empty state only."""

[prop.required]
type = "bool"
default = "false"
attribute = "required"
doc = "Whether an answer is compulsory. The real attribute, so the browser refuses the submission with no script involved, and `aria-required` follows from it."

[prop.multiple]
type = "bool"
default = "false"
attribute = "multiple"
doc = "Whether several values may be chosen. The real attribute again, so the name is submitted once per chosen value and the enhanced listbox announces itself as multi-selectable."

[prop.disabled]
type = "bool"
default = "false"
attribute = "disabled"
doc = "Stops users answering. The real attribute rather than `aria-disabled`, because only the real one keeps the value out of the submission."

[prop.size]
type = "enum"
values = ["small", "medium", "large"]
default = "medium"
attribute = "data-nd-size"
doc = "The size of the control: `small`, `medium` or `large`, which is 32, 48 and 64 pixels, matching `Button` step for step. `medium` by default."

[prop.searchable]
type = "bool"
default = "false"
attribute = "data-nd-searchable"
doc = "Whether the enhanced list can be filtered by typing. Turn it on for thirty-nine palettes and leave it off for six, where a filter box promises more than is there."

[prop.clearable]
type = "bool"
default = "false"
attribute = "data-nd-clearable"
doc = "Whether a control appears for putting the field back to nothing. Offer it only where nothing is a legal answer, which with `required` it is not. Off by default."

[prop.loading]
type = "bool"
default = "false"
attribute = "data-nd-loading"
doc = "Whether the options are still on their way. The list says so instead of showing an empty one, because an empty list and a list that has not arrived mean opposite things."

[prop.creatable]
type = "bool"
default = "false"
attribute = "data-nd-creatable"
doc = "Whether typing something the list does not have offers to add it. The new option is appended to the real `<select>`, so what is created is submitted like anything else."

[prop.search_label]
type = "text"
attribute = "data-nd-search-label"
doc = "The filter box's accessible name, in the reader's language. Supply it with `searchable`. It is a prop because this package ships no words."

[prop.empty_label]
type = "text"
attribute = "data-nd-empty-label"
doc = "What the list says when the filter matches nothing. Without it the list is silent, which is not an answer."

[prop.loading_label]
type = "text"
attribute = "data-nd-loading-label"
doc = "What the list says while the options are on their way. A separate sentence from `empty_label`, because a slow list and an empty one are opposite facts."

[prop.create_label]
type = "text"
attribute = "data-nd-create-label"
doc = "The offer to add what was typed, with a `{term}` placeholder for it. One sentence with a hole rather than two fragments joined, because word order is not the same in every language."

[prop.clear_label]
type = "text"
attribute = "data-nd-clear-label"
doc = "The name of the control that empties the field. It is an icon, so this is the only name it has."

[prop.selected_label]
type = "text"
attribute = "data-nd-selected-label"
doc = "What the closed control says when several values are chosen, with a `{count}` placeholder. A list of eleven names does not fit in a control, and showing three of them hides the other eight."

[prop.children]
type = "children"
doc = "The options, in `SelectGroup`s or on their own."

[state.expanded]
attribute = "aria-expanded"
doc = "Whether the enhanced list is open. The script writes it on the control it builds, and it is absent without a script, where the native control has its own popup."

[state.invalid]
attribute = "data-nd-invalid"
doc = "Whether the field is in error. It is derived from `error` being present rather than declared beside it, so the two cannot appear without each other."

[a11y]
needs_name = true
notes = "A real `<select>` with a real `<label for>`, so the popup, the type-ahead and the submitted value are the platform's. The script adds the combobox pattern over it, and the native control still submits."

[keyboard]
"Down or Up" = "Opens the list, then moves through it. Moving does not choose, so the answer is left alone."
"Enter" = "Chooses the option the list is on and closes. With `creatable`, it adds what was typed."
"Space" = "Chooses without closing when several may be chosen, which is how to pick a second one without reopening."
"Home or End" = "Jumps to the first or the last option, past however many are between."
"Escape" = "Closes the list, discards the filter and puts focus back on the control. It never changes the answer."
"Tab" = "Closes the list and leaves. What was highlighted is not chosen by leaving."
