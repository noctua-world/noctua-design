[meta]
name = "Blockquote"
element = "blockquote"
class = "nd-blockquote"
summary = "Show a quotation set apart from the text around it."
ai = "custom"

[prop.cite]
type = "text"
attribute = "cite"
doc = "A URL for the source. It is read by machines and is not shown to users."

[prop.tone]
type = "enum"
values = ["default", "accent"]
default = "default"
attribute = "data-nd-tone"
doc = "Whether the rule beside it takes the accent color."

[prop.attribution]
type = "text"
doc = "Who said it, rendered as a `<footer>` with a `<cite>` inside. `cite` above is a URL for machines, and this is the line a reader sees."

[prop.children]
type = "children"
doc = "The quotation."

[prop.glass]
type = "bool"
default = "false"
attribute = "data-nd-glass"
doc = "Frosts the quotation's own surface, leaving the rule beside it solid."
