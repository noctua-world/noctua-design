# When to reach for it, and when not to. Top-level rather than inside
# [meta], because a bare key after a table header belongs to that table.
guidance = """
Use tabs where one region of a page shows one of several panels at a time. For
choosing a **value** rather than revealing a panel, use `Segmented`. With no
script every panel is shown and the tabs are links down to them.
"""

[meta]
name = "Tabs"
element = "div"
class = "nd-tabs"
page = "tabs"
# The still picture needs REAL CHILDREN. Without this the grid falls back to the
# pangram placeholder, so every value of every enum prop draws one identical
# line of text. `Segmented` learned this first.
specimen = "<a class=\"nd-tab\" data-nd-selected=\"true\"><span class=\"nd-tab-text nd-identifier\">Aa</span></a><a class=\"nd-tab\" data-nd-selected=\"false\"><span class=\"nd-tab-text nd-identifier\">Bbbb</span></a><a class=\"nd-tab\" data-nd-selected=\"false\"><span class=\"nd-tab-text nd-identifier\">Cc</span></a>"
summary = "Show one panel at a time out of several, from a strip a reader chooses in."

# WHY THIS IS A COMPONENT AND NOT A `Segmented` PROP.
#
# The two look alike and promise opposite things. `Segmented` chooses a VALUE:
# it is a form control with a `name`, a `value` and `role="radiogroup"`, and
# what changes when a reader presses one is the answer to a question. Tabs
# reveal a PANEL: there is no value, nothing is submitted, and what changes is
# which region of the page is on screen.
#
# A screen reader is told which of those it is looking at, and telling it the
# wrong one is not cosmetic. `segmented.toml`'s own comment already refused
# `role="tablist"` on the grounds that it promises panels that change and there
# were none. This is the other half of that sentence.
#
# WHAT IS RENDERED AND WHAT THE SCRIPT WRITES.
#
# `Tree`'s rule, applied: nothing claims a role it cannot honour. With no script
# there is no `role="tablist"`, no `role="tab"` and no `role="tabpanel"`, every
# panel is visible, and each tab is a link to the panel below it. That is a
# working table of contents rather than a strip of buttons that do nothing.
#
# The wiring IS rendered, because it costs nothing and cannot go stale: both ids
# are derived from `name` and `value`, `aria-controls` points down and
# `aria-labelledby` points back. The script adds the roles, the selection and
# the hiding, and `docs-site/assets/shell.js` walks the strip with the same
# `stops()` and `roving()` a toolbar and a radiogroup already use.

[prop.name]
type = "text"
required = true
attribute = "data-nd-tabs"
doc = """
What this set of panels is of, as a script finds it, and the root of every id in
it. Every `Tab` and `TabPanel` repeats it. **Required**, because an id derived
from an optional name is one every set on the page shares.
"""

[prop.label]
type = "text"
attribute = "aria-label"
doc = """
The strip's accessible name, such as *Sections of this report*. Wanted unless
`labelledby` names it instead, because a tab list with no name gives a screen
reader only its role.
"""

[prop.labelledby]
type = "text"
attribute = "aria-labelledby"
doc = """
The id of the element that names this strip, where the name is already visible
on the page. Prefer it to `label` in that case, because a name written twice can
drift from itself.
"""

[prop.activation]
type = "enum"
values = ["automatic", "manual"]
default = "automatic"
# The difference is what an ARROW KEY does, and a still picture has no keyboard.
variants = false
attribute = "data-nd-activation"
doc = """
Whether an arrow key also chooses. `automatic` shows the panel a reader moves
to, which suits panels that are already loaded. `manual` moves the focus only
and waits for Space or Enter, which suits panels that cost something to show.
"""

[prop.orientation]
type = "enum"
values = ["horizontal", "vertical"]
default = "horizontal"
attribute = "aria-orientation"
doc = """
Which way the strip runs, and therefore which arrow keys move along it. It is
written to `aria-orientation`, so assistive technology reports the axis as well
as the stylesheet drawing it.
"""

[prop.appearance]
type = "enum"
values = ["underline", "enclosed"]
default = "underline"
attribute = "data-nd-appearance"
doc = """
How the chosen tab is marked. `underline` draws a rule under it and a hairline
under the whole strip. `enclosed` gives each tab its own box, which survives a
strip that wraps onto two lines.
"""

[prop.size]
type = "enum"
values = ["small", "medium", "large"]
default = "medium"
attribute = "data-nd-size"
doc = "The size of a tab. All three clear WCAG 2.5.8's 24px minimum target, and `large` also meets the 44px enhanced target."

[prop.fill]
type = "enum"
values = ["hug", "equal", "stretch"]
default = "hug"
attribute = "data-nd-fill"
doc = """
`hug` lets each tab be as wide as its label. `equal` gives every tab the width of
the widest, so the strip does not re-flow when one word is translated. `stretch`
does that and takes the whole container.
"""

[prop.children]
type = "children"
doc = "The `Tab`s. The panels are `TabPanel`s **after** this element rather than inside it, because a tab list holds tabs and nothing else."

[a11y]
notes = """
With no script this is a list of links to panels that are all visible, and it
claims no role at all. The script writes `role="tablist"`, `role="tab"` and
`role="tabpanel"`, and the strip is then one tab stop.
"""

[keyboard]
Tab = "Moves into the strip once, at the chosen tab, rather than stopping on each one. Pressing it again leaves for the panel."
"Arrow keys" = "Moves along the strip, and with `automatic` shows that panel. Left and Right when horizontal, Up and Down when vertical."
"Home / End" = "Moves to the first and last tab, on the same terms as an arrow key."
"Space or Enter" = "Shows the focused tab's panel. It is the only way to choose one under `manual`, and it works under `automatic` too."
