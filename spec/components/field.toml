# When to reach for it, and when not to. Top-level rather than inside
# [meta], because a bare key after a table header belongs to that table.
guidance = "Use a field around a control that needs a label, a hint or an error message. It draws those three and renders no control of its own. For a checkbox or a radio, use `Checkbox` or `Radio`, which draw their own label."

[meta]
name = "Field"
element = "div"
class = "nd-field"
summary = "Label a form control, and show the hint and the error message under it."
# Two drawn bars rather than a word: the variant grid shows what `size` does to
# the question and the box under it, and a specimen carrying the English word
# "Label" would be English on a page in three locales.
# THE LABEL IS IN THE PICTURE, because `size` reaches the label and nothing
# else — a figure of a rule and a box drew three identical fields under
# `small`, `medium` and `large`.
specimen = "<span class=\"nd-field-figure\"><span class=\"nd-label nd-identifier\">Aa</span><span class=\"nd-field-rule\"></span><span class=\"nd-field-box\"></span></span>"

# THE ID IS THE CALLER'S, AND THAT IS THE ONE THING IT MUST BE.
#
# A `<label for>` needs the id of the control it names, and this component
# renders no control — so it cannot derive one. Every other id here derives
# from that one by a rule stated in the prop's own documentation, which is what
# lets the control compute the same `aria-describedby` without a second
# convention to remember.

[prop.control]
type = "text"
required = true
doc = "The id of the control this labels. **Required**: a `<label>` with no target names nothing. The hint and the error take their ids from it, as `{control}-hint` and `{control}-error`, which the control's `aria-describedby` must point at."

[prop.label]
type = "text"
required = true
doc = "The question, in the reader's language. It renders as a real `<label for>`, or as a `<legend>` when `kind` is `group`. Never use a placeholder instead, because a placeholder disappears as soon as a reader types."

[prop.kind]
type = "enum"
values = ["single", "group"]
elements = ["div", "fieldset"]
default = "single"
# WHICH COMPONENTS PASS `group`: `TimeInput`, `DateInput`, `OtpField`,
# `Rating` and `Slider { range }`. This used to name `Fieldset`, which does not
# compose `Field` at all — a caller reading the doc for an example would have
# found none.
doc = "Whether this labels one control or several. `single` renders a `<div>` with a `<label>`. `group` renders a `<fieldset>` with a `<legend>`, which is the only arrangement that names a set of controls."

[prop.hint]
type = "text"
doc = "What a reader needs before answering, such as *For example, 27 3 2007*. It rides the control's `aria-describedby`, so it is read with the control."

[prop.error]
type = "text"
doc = """What is wrong, after a submission. It carries `role="alert"`, so a message that appears after the page has loaded is announced. It is the caller's sentence, and nothing here changes it."""

[prop.required]
type = "bool"
default = "false"
attribute = "data-nd-required"
doc = "Whether to mark the question as one that must be answered. **The mark is all this does.** The real `required` attribute belongs on the real control, because only that stops a form submitting."

# THREE PROPS, NO ATTRIBUTES. Each declared a `data-nd-*` this component does
# not write: `required_label` is handed to `Label`, `error_slot` decides
# whether the paragraph is rendered at all, and `error_label` is the hidden
# word inside it. All three work, and none of them is markup a script finds.
[prop.required_label]
type = "text"
doc = "The word that marks the question, in the reader's language, such as *required*. Wanted in practice by `required`. A word rather than an asterisk, which is invisible to a reader who cannot see it."

[prop.error_slot]
type = "bool"
default = "false"
doc = "Whether the error paragraph is rendered **even when there is no error**, empty, for a script to write into. Off by default, because an empty paragraph is a landmark a screen reader announces. On for a control whose real element a script hides."

[prop.error_label]
type = "text"
doc = "A word announced before the sentence, such as *Error*. Visually hidden, because the danger tone and the position already carry it for a reader who can see them. Wanted in practice by `error`."

[prop.size]
type = "enum"
values = ["small", "medium", "large"]
default = "medium"
attribute = "data-nd-size"
doc = "The type scale of the question and the sentences under it: `small`, `medium` or `large`. Match it to the control it wraps."

[prop.disabled]
type = "bool"
default = "false"
attribute = "data-nd-disabled"
doc = """Dims the question to match a disabled control. With `kind = "single"` **it disables nothing**, because the real attribute belongs on the real control. With `kind = "group"` it is the real attribute on the `<fieldset>`."""

[prop.children]
type = "children"
doc = "The control this field labels. Normally exactly one, because the field draws a single question."

[state.slot]
attribute = "data-nd-field-error"
doc = "Set on the error paragraph, always, as the hook a script writes a message into. A script looking for somewhere to put the browser's own message finds one place in any component."

[state.invalid]
attribute = "data-nd-invalid"
doc = "Set when an `error` was given, or when a script marked the control invalid. Three things change: a rule down the field's leading edge, the control's border, and the sentence. The label keeps its colour. Never colour alone (`NOCTUA.md §8.8.6`)."

[a11y]
notes = "The label is a real `<label for>`, or a `<legend>` when `kind` is `group`. The hint and the error are described rather than labelled: they ride the control's own `aria-describedby`."
