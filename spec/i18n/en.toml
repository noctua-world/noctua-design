# noctua-design — the English message catalogue.
#
# English is the SOURCE locale: a key exists because it was added here first.
# Every other locale is checked against this one in both directions, so a key
# added here and forgotten elsewhere fails the build with the key named, and a
# key deleted here but left elsewhere fails too (NOCTUA.md §9.9).
#
# Keys are dotted and quoted, so TOML treats them as literal strings rather than
# nesting. That keeps the file a flat list a translator can read top to bottom
# without tracking which table they are inside.
#
# THE RULE THAT MATTERS MOST: a sentence is one key. Never assemble a message
# from fragments — word order, gender and agreement differ between languages,
# and a fragment that reads correctly in English can be ungrammatical or
# meaningless once translated. A source gate enforces it.

[meta]
# The name of this locale, written in this locale.
name = "English"
# The BCP 47 tag for `<html lang>`.
bcp47 = "en"
# Writing direction, for `<html dir>`.
dir = "ltr"

[message]

