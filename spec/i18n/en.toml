"page.intro.title" = """Intro"""
"page.intro.summary" = """Build accessible, themeable interfaces in Dioxus or in React."""
"page.intro.body" = """Noctua is a design system in two packages that behave identically: a Dioxus crate and a React package, both built from one specification."""
"page.menu.summary" = """Let users choose an action from the list a button opens."""
"page.menu.body" = """A menu and its items. The button that opens one is a `Button` with `menu` and `controls`. Everything after the press is `dist/menu.js`: the anchoring, the arrow walk, the letter that jumps, Escape, and the focus returning to the button."""
"page.tree.summary" = """Let users walk a hierarchy, opening, closing and choosing nodes in it."""
"page.tree.body" = """The tree and its nodes. With the script blocked it is a nested list of links and claims nothing more. Every role, every state and every tab stop is written by the script."""
"page.tabs.summary" = """Show one panel at a time out of several, from a strip a reader chooses in."""
"page.tabs.body" = """The strip, one tab and one panel. With the script blocked every panel is on the page and each tab is a link down to the one it names. Nothing claims a role it cannot honour."""
"page.typography.title" = """Typography"""
"page.typography.summary" = """Set text from one scale and four families, in fourteen scripts."""
"page.icons.title" = """Icons list"""
"page.icons.summary" = """Browse every icon in the system, and filter by name to find one."""
"page.list.summary" = """Group items into a list, and nest lists inside the items of one."""
"page.list.body" = """The list and one item of it. The kind chooses the element, so an ordered list is an `<ol>` and a description list is a `<dl>`. A nested list indents, marks and can colour itself by how deep it sits."""
"page.segmented.summary" = """Let users pick one value from a row of options, all of them on screen."""
"page.segmented.body" = """The group and one of the values it chooses between. It is a radio group with a name and a value, so it posts like any other form control. The rendered tab stop is on the group, never on the chosen item."""
"page.select.summary" = """Let users choose a value out of more than a list can show, grouped and searchable."""
"page.select.body" = """The field, a named run of options and one option. The native control is what submits, and the script draws a listbox over it. An option carries a second line, an icon or a colour as data, because an `<option>` holds text alone."""
"page.inline-text.summary" = """Mark up abbreviations, keystrokes, corrections and dates inside a sentence."""
"page.inline-text.body" = """Ten marks that go inside a line rather than in a block of their own: an abbreviation, a keystroke, a correction, a date. Each is one component, and each takes the text it marks as its children."""
"page.avatars.summary" = """Show one person, or several of them as a single group."""
"page.avatars.body" = """One person, and several of them as a list. The group takes a name and draws the avatars it is given. The count of the people not shown is written by the caller, because the component does not count its own children."""
"page.search.summary" = """Search a set of pages from one box, and show the results grouped under it."""
"page.search.body" = """A search box, the results under it, and one result. Children are real links that work with the script blocked. An index at a URL is fetched on the first search and cached. The match is a ranked subsequence, with the matched letters marked."""
"page.tables.summary" = """Build a table out of the six parts it is made of."""
"page.tables.body" = """Rows and columns, and the parts one table is made of. On a narrow screen it scrolls sideways where there is room, and stacks into label-and-value pairs where there is not. Every part writes its own ARIA role, which stacking would otherwise drop."""
"page.spacing.title" = """Spacing"""
"page.spacing.summary" = """Space a page from one scale, where every gap is a step."""
