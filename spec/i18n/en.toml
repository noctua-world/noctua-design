"effects.patterns.title" = "Patterns"
"effects.patterns.body" = "Four geometries, each drawn in the text colour at four percent. That ceiling is what makes the readability claim measurable rather than hopeful — and a test measures it, on every pattern, in both modes."
"effects.ambient.title" = "Ambient"
"effects.ambient.body" = "The aurora follows the accent, so it changes with the palette without naming a colour. The grain sits always behind the text, because noise over glyphs costs far more legibility than a flat wash."
"effects.try" = "Try it"
"effects.try.body" = "Each button turns the effect on for the whole page, exactly as the settings panel does. They are the same setting."
