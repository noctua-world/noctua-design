"icons.source" = "Drawn by"
"colours.note" = "Every swatch below is a real palette, not a picture of one. Each cell carries the palette as an attribute and reads its own colours through it — the same mechanism a themed component uses."
"colours.roles" = "The roles"
"colours.roles.body" = "Each cell shows five of the roles a palette defines: the page, a subtle surface, a border, the accent, and the text."
"spacing.named.title" = "The gaps a reader feels"
"spacing.named.body" = "A component asks for a purpose, not a number. Changing what the gap between paragraphs means is one line in the specification rather than a search across every component."
"spacing.scale.title" = "The scale"
"spacing.scale.body" = "Every step is a multiple of one base, so the whole scale moves together and nothing can land between two steps."
