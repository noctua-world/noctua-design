# noctua-design — o catálogo de mensagens em português do Brasil.
#
# Este é o único arquivo do repositório escrito em outro idioma, e é assim por
# construção: um catálogo de tradução em inglês não seria uma tradução. Toda
# prosa, todo comentário e todo nome de identificador em qualquer outro arquivo
# permanecem em inglês (`NOCTUA.md §1`).
#
# As chaves são idênticas às de `en.toml`, nos dois sentidos: uma chave que
# exista lá e falte aqui interrompe a compilação nomeando a chave, e o mesmo
# vale no sentido contrário.
#
# A REGRA MAIS IMPORTANTE: uma frase é uma chave. Nunca monte uma mensagem a
# partir de fragmentos — ordem das palavras, gênero e concordância mudam entre
# os idiomas, e um fragmento correto em inglês pode virar algo agramatical aqui.

[meta]
name = "Português"
bcp47 = "pt-BR"
dir = "ltr"

[message]

