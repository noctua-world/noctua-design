"example.meter.share-value" = "{percent} do total"
"example.meter.share-note" = """Use `tone` para um medidor sem ponta boa ou ruim, onde a cor marca uma categoria e não um veredito."""
"example.meter.hidden-note" = """`hide_label` tira o nome da tela e o mantém para o leitor de tela, o que serve para uma célula de tabela."""
"example.progress.upload" = "Enviando relatorio-trimestral.pdf"
"example.progress.upload-value" = "{value} de {max} MB"
