"example.divider.note-named" = """Uma linha entre dois blocos que têm nome. Entre irmãos do mesmo tipo, mais espaço diz isso e uma linha não."""
"example.divider.note-label" = """Um divisor rotulado é um `<div role="separator">`, porque um `<hr>` não guarda conteúdo. A palavra é escrita de novo como `aria-label`."""
"example.divider.note-vertical" = """Uma linha vertical entre dois grupos numa mesma fileira. Ela tira a altura da fileira, e não de um número."""
"example.divider.note-weight" = """Três espessuras, dos três tokens de borda. A mais grossa é a que um `Field` desenha na borda de uma resposta recusada."""
"example.divider.note-decorative" = """Fora da árvore de acessibilidade. Use assim onde a linha repete um limite que o título acima dela já desenha."""

