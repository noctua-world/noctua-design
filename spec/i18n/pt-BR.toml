"example.label.note-legend" = """O nome de um grupo precisa ser um `<legend>` dentro de um `<fieldset>`. Nada mais prende a pergunta a cada controle."""
"example.label.note-name" = """Um `role="radiogroup"` não é rotulável, então o nome dele é um `<p>` para onde o grupo aponta o `aria-labelledby`."""
