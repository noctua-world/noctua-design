# --- As quatro superfícies flutuantes --------------------------------------
#
# Os contratos de Dialog, Popover, Tooltip e Toast, traduzidos, e tudo o que os
# exemplos deles desenham.

"component.dialog.guidance" = """Use um diálogo para uma coisa que a pessoa precisa resolver antes de seguir. Para uma mensagem deixada onde aconteceu, use `MessageBar`. Para uma nota presa a um controle, use `Popover`. Uma superfície que só mostra algo é uma seção de página."""
"component.dialog.a11y-notes" = """O elemento `<dialog>` carrega o papel, então nenhum é escrito. `showModal` o marca como modal e deixa inerte o documento atrás dele, então também não se escreve armadilha de foco. Um não modal é um diálogo comum ao lado da página."""
"component.dialog.prop.name.doc" = """O que é este diálogo, como um script o encontra, e a raiz de todo id aqui. **Obrigatório**, porque ids derivados de um nome ausente colidem assim que uma página carrega dois."""
"component.dialog.prop.trigger_label.doc" = """As palavras no controle que o abre. **Obrigatório**: uma superfície que só abre por script e não tem controle apontando para ela é uma superfície inalcançável."""
"component.dialog.prop.heading.doc" = """Um título dentro da superfície. Ele nomeia o diálogo por `aria-labelledby`, então prefira-o a `label`. Um nome que a pessoa vê é um nome que ela pode conferir com o que está sendo perguntado."""
"component.dialog.prop.label.doc" = """O nome acessível do diálogo, para uma superfície sem título visível. Ignorado quando `heading` está definido, porque um nome escrito duas vezes pode divergir de si mesmo."""
"component.dialog.prop.description.doc" = """Uma frase abaixo do título, ligada por `aria-describedby`. Um leitor de tela a lê depois do nome, então ela pertence ao que o diálogo pergunta e não ao conteúdo abaixo."""
"component.dialog.prop.modal.doc" = """Se a página atrás fica inerte. `showModal` põe a superfície na camada de topo e esconde o resto do documento da tecnologia assistiva. `show` deixa a página alcançável e a superfície ao lado."""
"component.dialog.prop.size.doc" = """Quanto a superfície pode crescer. `small` serve a uma pergunta com duas respostas, `medium` a um formulário curto, `large` a uma tabela que a pessoa precisa ler. A janela limita os três."""
"component.dialog.prop.dismissible.doc" = """Se um controle que fecha é desenhado. Ligado por padrão, porque Escape e um toque no fundo são as outras duas saídas e nenhuma delas é visível numa tela de toque."""
"component.dialog.prop.close_label.doc" = """O nome do controle que fecha. Necessário na prática pelo `dismissible`, porque esse controle é um glifo e este é o único nome que ele tem."""
"component.dialog.prop.children.doc" = """O que o diálogo pergunta e os controles que respondem. Um `Button` que age sobre a resposta fica aqui, no fim."""
"component.dialog.state.open.doc" = """Definido na raiz enquanto a superfície está aberta. O `<dialog>` carrega o próprio atributo `open`, e este é o que uma folha de estilo fora dele consegue usar."""
"component.dialog.key.enter-or-space.name" = "Enter ou Espaço"
"component.dialog.key.enter-or-space.action" = """Abre o diálogo, no controle que o abre. As duas teclas funcionam, porque esse controle é um `<button>`."""
"component.dialog.key.escape.name" = "Escape"
"component.dialog.key.escape.action" = """Fecha. A plataforma responde a isso numa superfície modal, e o `dist/dialog.js` responde numa não modal."""
"component.dialog.key.tab.name" = "Tab"
"component.dialog.key.tab.action" = """Circula dentro de uma superfície modal, o que o navegador faz sozinho. Sai de uma não modal e a deixa aberta."""

"component.popover.guidance" = """Use um popover para uma superfície pequena presa a um controle, com texto sobre o qual a pessoa pode agir. É um `role="dialog"`. Para uma frase que explica a palavra ao lado, use `Info`, que é um `role="note"`. Para uma lista de ações, use `Menu`."""
"component.popover.a11y-notes" = """O controle é um `<button>` com `aria-expanded` e `aria-controls`, e a superfície é um `role="dialog"` com nome. Nada atrás dela fica inerte e nada é preso, então Tab sai dela e a fecha."""
"component.popover.prop.name.doc" = """O que é esta superfície, como um script a encontra, e a raiz dos dois ids aqui. **Obrigatório**, porque ids derivados de um nome ausente colidem assim que uma página carrega duas."""
"component.popover.prop.trigger_label.doc" = """As palavras no controle que a abre. **Obrigatório**: uma superfície sem controle apontando para ela é inalcançável, e este controle não vem com outro texto."""
"component.popover.prop.heading.doc" = """Um título dentro da superfície. Ele a nomeia por `aria-labelledby`, então prefira-o a `label`. Um nome que a pessoa vê é um nome que ela pode conferir com o que está embaixo."""
"component.popover.prop.label.doc" = """O nome acessível da superfície, para uma que não tem título visível. Um `role="dialog"` sem nome dá ao leitor de tela o papel e mais nada. Ignorado quando `heading` está definido."""
"component.popover.prop.placement.doc" = """Onde ela abre. `auto` mede o espaço, virando para cima e pendurando pela borda que couber. `start` e `end` prendem a borda inicial ou final da superfície seja qual for o espaço, para um controle perto da beira da janela."""
"component.popover.prop.dismissible.doc" = """Se um controle que fecha é desenhado. Ligado por padrão: Escape, sair com Tab e um toque fora são as outras três saídas. Nenhuma das três é visível numa tela de toque."""
"component.popover.prop.close_label.doc" = """O nome do controle que fecha. Necessário na prática pelo `dismissible`, porque esse controle é um glifo e este é o único nome que ele tem."""
"component.popover.prop.children.doc" = """O que a superfície guarda. Controles são bem-vindos aqui, ao contrário de um `Tooltip`, e essa é a diferença entre os dois."""
"component.popover.state.open.doc" = """Se a superfície está aparecendo. Escrito no controle, que é o elemento que a pessoa pressiona e o elemento cujo estado o leitor de tela lê."""
"component.popover.key.enter-or-space.name" = "Enter ou Espaço"
"component.popover.key.enter-or-space.action" = """Abre a superfície, e a fecha de novo."""
"component.popover.key.escape.name" = "Escape"
"component.popover.key.escape.action" = """Fecha e devolve o foco ao controle que a abriu."""
"component.popover.key.tab.name" = "Tab"
"component.popover.key.tab.action" = """Entra na superfície e sai dela. Nada fica preso, e sair fecha."""

"component.tooltip.guidance" = """Use um balão para uma dica curta sobre o controle que ele envolve, nunca como o único nome desse controle. Se toda pessoa precisa da frase, escreva-a na página. Para explicar uma palavra no texto corrido, use `Info`."""
"component.tooltip.a11y-notes" = """A bolha é um `role="tooltip"` e o controle aponta para ela com `aria-describedby`. Ela nunca é o nome acessível do controle, não guarda nada focalizável, e Escape a esconde sem mover o foco."""
"component.tooltip.prop.name.doc" = """A que esta dica pertence, como um script a encontra, e a raiz do id aqui. **Obrigatório**, porque um id derivado de um nome ausente colide assim que uma página carrega duas."""
"component.tooltip.prop.text.doc" = """A dica, em uma linha curta. **Obrigatório**: um balão sem nada dentro é um controle que ganhou um `aria-describedby` apontando para espaço vazio."""
"component.tooltip.prop.placement.doc" = """Onde a bolha abre. `auto` mede o espaço, virando para cima e pendurando pela borda que couber. `start` e `end` prendem a borda inicial ou final dela seja qual for o espaço."""
"component.tooltip.prop.delay.doc" = """Quanto tempo um ponteiro descansa antes de a bolha abrir. O foco ignora isso. As duas esperas caem para o mesmo valor sob `prefers-reduced-motion`, então `long` nunca é a mais rápida."""
"component.tooltip.prop.children.doc" = """O controle sobre o qual a dica fala. Um só controle, ao qual o script liga o `aria-describedby`."""
"component.tooltip.state.shown.doc" = """Definido na raiz enquanto a bolha está aberta. A bolha fica escondida pelo atributo `hidden`, que é o que mantém o texto dela fora da árvore de acessibilidade até lá."""
"component.tooltip.key.tab.name" = "Tab"
"component.tooltip.key.tab.action" = """Mostra a dica ao chegar no controle, sem espera, e a esconde de novo ao sair."""
"component.tooltip.key.escape.name" = "Escape"
"component.tooltip.key.escape.action" = """Esconde a dica e deixa o foco onde está, para o controle seguir utilizável."""

"component.toast.guidance" = """Use um toast para um resultado que chega depois de a pessoa agir, quando a página não tem onde dizer isso no lugar. Nunca como o único registro desse resultado. Para uma mensagem que pertence ao lugar onde aconteceu, use `MessageBar`."""
"component.toast.a11y-notes" = """Um `role="status"`, que espera uma pausa em vez de cortar a fala. O controle que dispensa é um `<button>` de verdade com nome, e o cronômetro para enquanto a pessoa está sobre a mensagem."""
"component.toast.prop.name.doc" = """Sobre o que é esta mensagem, como um script a encontra. **Obrigatório**, porque uma página pode levantar várias e o script precisa distinguir um cronômetro do outro."""
"component.toast.prop.tone.doc" = """De qual tom do sistema de cores a borda é pintada. Os tons ficam em `noctua_design::tones`. **Nunca o único sinal** (`NOCTUA.md §8.8.6`): o título e a frase carregam o significado."""
"component.toast.prop.title.doc" = """Uma linha curta acima da mensagem, como *Pedido enviado*. É um `<strong>` e não um título. Uma mensagem que chega depois do carregamento não pode reescrever a estrutura sob quem navega por ela."""
"component.toast.prop.duration.doc" = """Quanto tempo ela espera antes de sair sozinha, em milissegundos. Ausente a deixa na página até ser dispensada, e `0` faz o mesmo. A espera para sob um ponteiro e sob o foco."""
"component.toast.prop.dismissible.doc" = """Se um controle que tira a mensagem é desenhado. Ligado por padrão: sem `duration` a mensagem fica, e uma que fica sem saída é uma que a pessoa precisa contornar."""
"component.toast.prop.dismiss_label.doc" = """O nome do controle que tira a mensagem, como *Dispensar esta mensagem*. Necessário na prática pelo `dismissible`, porque esse controle é um glifo e este é o único nome que ele tem."""
"component.toast.prop.placement.doc" = """Em qual canto ela flutua. `bottom-end` serve a um resultado que a pessoa não espera. Um canto `top` serve a um que responde a um controle no alto, onde ela já está olhando."""
"component.toast.prop.live.doc" = """Como ela é anunciada quando chega. Ausente deixa o papel decidir, o que está certo quase sempre. Use `assertive` para um resultado que exige ação, e `off` para um que veio com a página."""
"component.toast.prop.children.doc" = """A mensagem, em uma ou duas frases. Ela pode conter um `Link` para o que a pessoa precisa fazer a respeito."""
"component.toast.state.dismissed.doc" = """Definido numa mensagem que foi tirada, pela pessoa ou pelo próprio cronômetro. A folha de estilo a tira do layout, então o elemento fica e a região viva dele segue funcionando."""
"component.toast.state.paused.doc" = """Definido enquanto um ponteiro ou o foco está sobre a mensagem e o cronômetro está segurando. Removido quando os dois saem, e aí a espera inteira começa de novo."""
"component.toast.key.tab.name" = "Tab"
"component.toast.key.tab.action" = """Vai até o controle que a dispensa, o que segura o cronômetro enquanto o foco estiver lá."""
"component.toast.key.enter-or-space.name" = "Enter ou Espaço"
"component.toast.key.enter-or-space.action" = """Tira a mensagem, no controle que a dispensa. As duas teclas funcionam, porque esse controle é um `<button>`."""

"example.dialog.open" = "Excluir este rascunho"
