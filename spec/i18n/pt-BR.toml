"colours.roles" = "Os papéis"
"colours.roles.body" = "Cada célula mostra cinco dos papéis que uma paleta define: a página, uma superfície sutil, uma borda, o destaque e o texto."
"spacing.named.title" = "Os espaços que o leitor sente"
"spacing.named.body" = "Um componente pede um propósito, não um número. Mudar o que significa o espaço entre parágrafos é uma linha na especificação, e não uma busca por todos os componentes."
"spacing.scale.title" = "A escala"
"spacing.scale.body" = "Cada passo é um múltiplo de uma base, então a escala inteira se move junto e nada pode cair entre dois passos."
