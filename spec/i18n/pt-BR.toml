"example.summary.send" = "Continuar"
"example.summary.name-label" = "Nome completo"
"example.summary.email-label" = """Endereço de e-mail"""
"example.summary.rendered-note" = """`ErrorSummary` lista os erros acima do formulário, e `description` acrescenta uma linha abaixo do título."""
"example.summary.collect-note" = """Aperte Continuar com as caixas vazias. Com `collect` as entradas são lidas dos campos do formulário, na ordem da página."""
"example.summary.link-note" = """Cada entrada é um `<a href>` de verdade. Siga uma pelo teclado para ver onde o foco para."""
"example.summary.plain-note" = """`focus: false` deixa o foco onde está, para uma página em que outra coisa tem mais direito a ele."""
"example.summary.item-group-note" = """Uma entrada para uma pergunta feita em várias caixas, com `control` apontando para a primeira caixa."""
"example.summary.item-words-note" = """As palavras de uma entrada são a mensagem de erro, a mesma frase que o próprio campo mostra lá embaixo."""
"example.summary.choice-label" = "Paleta"
"example.summary.choice-error" = "Escolha uma paleta"

"component.table.guidance" = """Use uma tabela para dados de duas dimensões: linhas que são registros, colunas que são campos. É um `role="table"` e deixa as setas em paz. Vira um `role="grid"` quando uma coluna é ordenável, filtrável ou selecionável."""
"component.table.a11y-notes" = """Cada parte escreve o papel dela na marcação, porque o layout empilhado muda o `display` e o motor descarta os papéis implícitos de tabela. Um grid é uma parada de tabulação com `tabindex` móvel."""
"component.table.prop.name.doc" = """O identificador desta tabela, e a raiz de todo id dentro dela. **Obrigatório**, porque um id derivado de um nome ausente é o mesmo id em cada cópia do componente na página."""
"component.table.prop.caption.doc" = """O que a tabela é, na língua de quem lê, como um `<caption>` de verdade. **Obrigatório**: é a primeira coisa que um leitor de tela diz ao entrar, e é do que se faz a lista de tabelas da página. Use `hide_caption` quando um título já disser."""
"component.table.prop.hide_caption.doc" = """Se a legenda é escondida da tela sem sair do documento. Para a tabela cujo título de página ou de seção já diz o que ela é. O nome continua lá para quem não enxerga o título."""
"component.table.prop.note.doc" = """Uma frase abaixo da legenda: de onde vieram os números, quando foram contados, o que significa uma célula em branco. O `aria-describedby` da tabela aponta para ela, então é lida junto com a tabela."""
"component.table.prop.density.doc" = """Quanto espaço uma linha ocupa: `compact`, `default` ou `comfortable`. `compact` cabe mais linhas na tela, para a tabela que o leitor varre. `comfortable` serve à tabela com frases quebradas dentro."""
"component.table.prop.rules.doc" = """Quais linhas são desenhadas: `rows`, `columns`, `grid` ou `none`. `rows` por padrão, para a tabela lida para o lado. `columns` para a lida para baixo, e `grid` para a lida nos dois sentidos. Use `none` com `zebra`."""
"component.table.prop.zebra.doc" = """Se as linhas alternadas são sombreadas. Uma alternativa ao `rules = "rows"` e não um acréscimo. Útil depois de umas dez colunas, onde o traço fica longe do valor que a pessoa segue."""
"component.table.prop.hover.doc" = """Se a linha sob o ponteiro fica realçada. Para uma tabela larga que a pessoa percorre. **Só ponteiro**, e nunca substitui o anel de foco, porque não diz nada a quem usa teclado."""
"component.table.prop.width.doc" = """Se a tabela preenche o contêiner (`full`) ou tem a largura do conteúdo (`auto`). `full` por padrão. `auto` serve a uma tabela pequena ao lado de outra coisa."""
"component.table.prop.height.doc" = """Um teto para a altura da caixa que rola, para que uma tabela longa não empurre o resto da página para baixo. **Obrigatório na prática pelo `sticky_header`**, que não faz nada numa caixa que nunca rola."""
"component.table.prop.layout.doc" = """O layout de tela estreita. `auto` rola para o lado onde há espaço e empilha em pares de rótulo e valor onde não há. `scroll` e `stack` fixam a escolha. É uma container query, então uma tabela numa coluna estreita empilha numa tela larga."""
"component.table.prop.sticky_header.doc" = """Se a linha de títulos fica presa ao topo da caixa que rola. Para uma tabela longa, onde uma linha de números não significa nada sem as palavras acima dela. Quer um `height`, e não faz nada numa tabela empilhada."""
"component.table.prop.selected_label.doc" = """O que é anunciado quando as linhas escolhidas mudam, com um buraco `{count}`. Nada aqui move o foco quando uma linha é escolhida, então sem esta frase escolher é silencioso. Pode ter uma forma por categoria de plural."""
"component.table.prop.sort_ascending_label.doc" = """O que é anunciado depois de ordenar para cima, com um buraco `{column}`, como *Ordenado por {column}, do menor para o maior*. As linhas se movem para quem não as vê se mover. Necessário por um `TableColumn` ordenável."""
"component.table.prop.sort_descending_label.doc" = """O mesmo, para ordenar para baixo."""
"component.table.prop.sort_cleared_label.doc" = """O mesmo para o terceiro toque, que devolve as linhas à ordem que o documento tinha. Esse terceiro estado é a razão de ordenar não ser um alternador: quem ordenou sem querer não tem outro caminho de volta."""
"component.table.prop.filtered_label.doc" = """O que é anunciado depois de filtrar, com buracos `{count}` e `{total}`. Diz também que nada corresponde quando a contagem é zero. Sem isso, uma tabela que perde noventa linhas muda em silêncio."""
"component.table.prop.resize_label.doc" = """O nome da alça que redimensiona uma coluna, com um buraco `{column}`. Necessário na prática por um `TableColumn` redimensionável. Nomear a alça é o que a torna um controle que o teclado alcança com Alt e as setas."""
"component.table.prop.resized_label.doc" = """O que é anunciado enquanto se redimensiona, com buracos `{column}` e `{width}`. O `{width}` é preenchido com uma porcentagem que a plataforma formata na língua de quem lê."""
"component.table.prop.columns_label.doc" = """O nome do controle que lista quais colunas estão à mostra. Necessário na prática por um `TableColumn` que possa ser escondido, porque sem ele não há como trazer de volta uma coluna escondida."""
"component.table.prop.column_shown_label.doc" = """O que é anunciado quando uma coluna volta, com um buraco `{column}`. A tabela muda de largura e nenhum foco se move, então a frase é o único sinal."""
"component.table.prop.column_hidden_label.doc" = """O mesmo, para uma coluna que sai."""
"component.table.prop.copy.doc" = """Se aparece um controle que copia a tabela, e se o Ctrl/Cmd+C faz isso de dentro do grid. Escreve texto **separado por tabulação** e copia as linhas escolhidas, ou as visíveis quando nenhuma foi. **A área de transferência é escrita, nunca lida.**"""
"component.table.prop.copy_label.doc" = """O nome desse controle. Necessário na prática pelo `copy`."""
"component.table.prop.copied_label.doc" = """O que é dito depois de uma cópia, com um buraco `{count}`. Uma cópia que falha não diz **nada**, em vez de nomear uma cópia que não aconteceu."""
"component.table.prop.summary_label.doc" = """Uma frase abaixo da tabela dizendo quanto dela está aparecendo, com buracos `{visible}` e `{total}`, como *{visible} de {total} linhas*. Só é desenhada quando os dois diferem."""
"component.table.prop.children.doc" = """As declarações `TableColumn` primeiro, depois as faixas `TableSection`. As colunas vêm antes das linhas porque é a ordem que o `<table>` exige."""
"component.table.state.scrollable.doc" = """Definido quando a tabela é mais larga que a caixa dela. O `role="region"` e a parada de tabulação vêm renderizados, e o script os tira de uma tabela que cabe. Uma melhoria pode tirar um caminho de entrada, nunca criar um."""
"component.table.state.sorted.doc" = """Por qual coluna as linhas estão ordenadas, ou ausente na ordem do documento. Escrito na tabela e não no título, para que a folha de estilo possa marcar a coluna inteira."""
"component.table.state.filtered.doc" = """Definido quando há linhas escondidas por um filtro. As linhas são escondidas, nunca removidas, então limpar o filtro devolve a tabela. Todo total do rodapé é recontado do que sobrou."""
"component.table.state.interactive.doc" = """Definido quando a tabela é um `grid`, o que acontece quando algo nela é ordenável, filtrável, redimensionável, selecionável ou expansível. **Derivado e nunca declarado.**"""
"component.table.key.arrow-keys.name" = "Setas"
"component.table.key.arrow-keys.action" = """Numa tabela de leitura, nada: elas rolam a caixa. Num grid, andam de célula em célula."""
"component.table.key.tab.name" = "Tab"
"component.table.key.tab.action" = """Entra no grid e sai do outro lado. O grid inteiro é **uma** parada, mantida por um `tabindex` móvel."""
"component.table.key.home-end.name" = "Home / End"
"component.table.key.home-end.action" = """Vai para a primeira ou a última célula da linha. Com Ctrl, a primeira ou a última da tabela."""
"component.table.key.page-up-page-down.name" = "Page Up / Page Down"
"component.table.key.page-up-page-down.action" = """Move uma tela de linhas para cima ou para baixo, ficando na mesma coluna."""
"component.table.key.enter-space.name" = "Enter / Espaço"
"component.table.key.enter-space.action" = """Num título de coluna, ordena por ela: para cima, para baixo, e de volta à ordem do documento. Numa linha, escolhe-a."""
"component.table.key.shift-arrow-keys.name" = "Shift + setas"
"component.table.key.shift-arrow-keys.action" = """Estende as linhas escolhidas, quando `select` é `many`. Shift com um clique faz o mesmo com o ponteiro."""
"component.table.key.ctrl-cmd-a.name" = "Ctrl/Cmd + A"
"component.table.key.ctrl-cmd-a.action" = """Escolhe todas as linhas, quando `select` é `many` e o foco está dentro do grid."""
"component.table.key.ctrl-cmd-c.name" = "Ctrl/Cmd + C"
"component.table.key.ctrl-cmd-c.action" = """Copia as escolhidas, ou as visíveis quando nenhuma foi, como texto separado por tabulação, quando `copy` está ligado."""
"component.table.key.alt-left-alt-right.name" = "Alt + Esquerda / Alt + Direita"
"component.table.key.alt-left-alt-right.action" = """No título de uma coluna redimensionável, deixa-a mais estreita ou mais larga em um passo. Com Shift, em dez."""
"component.table.summary" = """Mostre dados em linhas e colunas, com ordenação, filtro, seleção e totais."""
"component.table-column.guidance" = """Use uma coluna de tabela para declarar uma coluna de um `Table`, antes de qualquer linha. Ela diz como os valores ordenam e se a coluna pode ser filtrada, redimensionada, escondida ou congelada. Qualquer uma dessas torna o `Table` um `grid`."""
"component.table-column.a11y-notes" = """Um `<colgroup>` não tem papel ARIA e nunca é lido, porque um leitor de tela percorre células e não colunas. Tudo o que quem lê ouve sobre esta coluna vem do título dela."""
"component.table-column.prop.name.doc" = """Como esta coluna se chama na marcação, por exemplo `step` ou `token`. **Obrigatório**, porque um título aponta para ela com o próprio `column` e toda mensagem preenche um buraco `{column}` a partir dela. É um identificador."""
"component.table-column.prop.width.doc" = """A largura de repouso da coluna. `auto` divide o espaço, `narrow`, `medium` e `wide` são três passos fixos, e `fit` é o mais estreito possível. **Funciona sem script**, porque a folha de estilo dimensiona um `<colgroup>`."""
"component.table-column.prop.sortable.doc" = """Se a pessoa pode ordenar por esta coluna. Desligado por padrão. Ligar desenha o controle no título e dá a ele um `aria-sort` de verdade. Com qualquer outra coisa interativa, torna a tabela um `grid`."""
"component.table-column.prop.sort_as.doc" = """Como dois valores desta coluna se comparam. **Declarado em vez de adivinhado**: um script que lê a primeira célula ordena `10` antes de `9`. `text` ordena na língua de quem lê, `number` lê dígitos, `date` lê datas. Necessário por `sortable`."""
"component.table-column.prop.filterable.doc" = """Se a busca da tabela olha nesta coluna. Desligado por padrão. **A caixa é uma só, na barra de ferramentas, atrás de uma lupa.** O que é digitado esconde toda linha que não casa em nenhuma coluna buscada, e essas linhas ficam escondidas."""
"component.table-column.prop.resizable.doc" = """Se a pessoa pode mudar a largura desta coluna. Desligado por padrão, e útil onde o conteúdo é imprevisível, como um nome ou um caminho. A alça é arrastável e responde a Alt com as setas, porque tem quatro pixels de largura."""
"component.table-column.prop.hideable.doc" = """Se esta coluna é oferecida na lista de colunas da tabela. Desligado por padrão, para que a pessoa não esvazie a tabela. Ligue nas colunas que são detalhe e não identidade, e nunca na que carrega o nome da linha."""
"component.table-column.prop.hidden.doc" = """Se a coluna começa escondida. É declarado na marcação em vez de restaurado por um script. A primeira pintura já sai certa, e quem lê sem script vê as colunas que a página quis mostrar. Desejado na prática por `hideable`."""
"component.table-column.prop.pinned.doc" = """Se a coluna fica presa na borda inicial enquanto o resto rola de lado. **Várias colunas podem ficar presas**, porque um registro costuma ser identificado por duas delas. Elas mantêm a ordem e um traço marca onde terminam."""
"component.table-column.summary" = """Declara uma coluna da tabela: a largura, a ordenação e o que a pessoa pode fazer nela."""
"component.table-section.guidance" = """Use uma seção de tabela para uma faixa de um `Table`: os títulos, os dados ou os totais. Toda tabela precisa de um `head` e de um `body`. Um `foot` guarda a linha que soma as de cima, e só as células dele podem carregar um `aggregate`."""
"component.table-section.a11y-notes" = """O papel é reafirmado em vez de ficar implícito. Uma tabela que empilha muda o `display`, e todo motor larga os papéis implícitos de tabela nessa hora. Um `foot` fica parado quando as linhas são ordenadas."""
"component.table-section.prop.kind.doc" = """Qual faixa é esta. Muda o elemento para `<thead>`, `<tbody>` ou `<tfoot>` em vez de uma classe. O script também lê: `head` nunca ordena, `foot` nunca ordena nem filtra, e `body` é a única faixa cujas linhas se movem."""
"component.table-section.prop.children.doc" = """As linhas."""
"component.table-section.summary" = """Agrupa as linhas da tabela num cabeçalho, num corpo ou num rodapé."""
"component.table-row.guidance" = """Use uma linha de tabela para um registro. As células dela são os campos dele, na ordem em que os títulos os nomearam. O `select` é declarado aqui e não no `Table`, porque o controle de escolha é uma célula e a célula pertence à linha."""
"component.table-row.a11y-notes" = """O papel é escrito na marcação em vez de ficar implícito, porque uma tabela que empilha numa tela estreita o perde. A escolha é um controle de verdade nomeado pelas palavras da linha, e não `aria-selected`."""
"component.table-row.prop.name.doc" = """O identificador desta linha, na marcação. A linha de detalhe e o controle de escolha derivam os ids deles a partir dele. Uma linha que abre ou que pode ser escolhida precisa de um."""
"component.table-row.prop.tone.doc" = """De qual tom do sistema de cores esta linha é pintada. Qualquer uma das 349 famílias semânticas, então `overdue` vale tanto quanto `danger`, mais o `neutral` e o `muted` deste sistema. Um nome não declarado falha no build. **Nunca a cor sozinha.**"""
"component.table-row.prop.select.doc" = """Se esta linha pode ser escolhida. `one` desenha um rádio de verdade, `many` uma caixa de seleção de verdade. `all` fica na linha de títulos e marca ou desmarca todas as linhas abaixo, com um terceiro estado para *algumas, não todas*."""
"component.table-row.prop.selected.doc" = """Se esta linha começa escolhida. Renderizado pelo servidor, para que um formulário que voltou ainda mostre o que a pessoa marcou. É desenhado a partir do estado do controle de verdade, e não de um `aria-selected`."""
"component.table-row.prop.select_label.doc" = """O nome do controle de escolha desta linha, como *Escolher Ada Lovelace*. Necessário na prática pelo `select`: uma coluna de controles com o mesmo nome é lida como *caixa de seleção, caixa de seleção, caixa de seleção*."""
"component.table-row.prop.select_name.doc" = """O campo de formulário sob o qual a escolha é enviada. Todas as linhas de uma tabela usam o mesmo, que é o que faz delas uma resposta com vários valores. É um `name` de verdade, então um formulário sem script ainda envia a escolha."""
"component.table-row.prop.disabled.doc" = """Se a escolha só desta linha é recusada, para um registro que outra pessoa travou ou um trabalho já terminado. O atributo de verdade no controle de verdade. A linha continua sendo lida, copiada e contada."""
"component.table-row.prop.expandable.doc" = """Se esta linha abre para a linha de detalhe abaixo dela. Ela desenha um controle de verdade na primeira célula com `aria-expanded`. A linha de detalhe é uma linha de verdade na mesma tabela, então imprime e mantém o lugar na ordenação."""
"component.table-row.prop.expand_label.doc" = """O nome desse controle. Necessário na prática pelo `expandable`: é um glifo, então este é o único nome que ele tem. Ele deve dizer o que abre, como *Mostrar os detalhes de Ada Lovelace*."""
"component.table-row.prop.detail_for.doc" = """Marca esta linha como o detalhe da linha com aquele `name`. Ela começa escondida e é revelada pelo controle dela, anda junto com a linha dela quando a tabela é ordenada, e a listra a pula."""
"component.table-row.prop.empty.doc" = """Marca a linha que a tabela mostra quando não tem nada a mostrar. Renderizada na marcação e escondida enquanto houver linhas, então *nenhum resultado* é a frase de quem chama na língua de quem lê. Um filtro a revela quando nada corresponde."""
"component.table-row.prop.children.doc" = """As células, como `TableCell` e `TableHeaderCell`. O nome da própria linha fica num `TableHeaderCell` com `scope = "row"`, o que faz cada outra célula anunciar a que registro pertence."""
"component.table-row.state.expanded.doc" = """Se a linha de detalhe está à mostra. Escrito no controle e não na linha. O controle é o elemento que a pessoa aperta e o elemento cujo estado um leitor de tela lê."""
"component.table-row.summary" = """Mostre um registro, com um tom, um controle de escolha e uma linha de detalhe."""
"component.table-cell.guidance" = """Use uma célula de tabela para um campo de um registro. Para a célula que nomeia o registro, use um `TableHeaderCell` com `scope = "row"`. É isso que diz ao leitor de tela a que registro o resto da linha pertence."""
"component.table-cell.a11y-notes" = """O papel é reafirmado porque uma tabela empilhada muda o `display`, e todo motor larga os papéis implícitos de tabela nessa hora. O `truncate` corta o valor na folha de estilo e nunca na marcação."""
"component.table-cell.prop.align.doc" = """Onde o valor fica na célula. `numeric` encosta os dígitos no fim e liga as figuras tabulares, então uma coluna de números alinha unidade sob unidade. Use `start` para palavras, porque texto centralizado fica com a borda esquerda irregular."""
"component.table-cell.prop.tone.doc" = """De qual tom do sistema de cores a célula é pintada, nomeado em vez de escolhido numa lista fechada: `overdue`, `shipped`, `degraded`. Um nome que nenhuma família declara falha no build. **Nunca o único sinal** (`NOCTUA.md §8.8.6`)."""
"component.table-cell.prop.wrap.doc" = """O que um valor longo faz. `wrap` é o padrão. `nowrap` serve a um valor que não significa nada quebrado em duas linhas, como uma data ou um código. `truncate` corta com reticências e **mantém o valor inteiro na marcação**."""
"component.table-cell.prop.span.doc" = """Quantas colunas esta célula cobre. Renderiza como um `colspan` de verdade, que é o que o leitor de tela conta e do que o layout é feito. Texto em vez de número, como toda prop que atravessa as duas linguagens."""
"component.table-cell.prop.rows.doc" = """Quantas linhas esta célula cobre, como um `rowspan` de verdade. Chamada `rows` em vez de `rowspan` para ler ao lado de `span`. Use com parcimônia, porque uma célula que abrange linhas deixa o layout empilhado ambíguo."""
"component.table-cell.prop.label.doc" = """O nome da coluna, repetido para o layout empilhado. Uma tabela empilhada não tem linha de título, então cada valor carrega o próprio nome. É texto de verdade marcado com `aria-hidden`, porque o leitor de tela pega a coluna do título."""
"component.table-cell.prop.column.doc" = """A qual `TableColumn` esta célula pertence. Só é preciso onde um `span` deixou a posição ambígua. Sem spans o script conta as células, e com eles a contagem pode cair na coluna errada."""
"component.table-cell.prop.sort_value.doc" = """Por que ordenar e filtrar, quando não é o que a célula diz. Uma data mostrada como *3 de março* ordena como `2026-03-03`, e um tamanho mostrado como *1,2 MB* ordena como `1258291`. O `sort_as` da coluna decide a comparação."""
"component.table-cell.prop.aggregate.doc" = """De que esta célula é o total. Só num `foot`, e só para uma coluna de números. O script lê os valores da coluna, escreve a resposta aqui no locale de quem lê e recalcula quando um filtro esconde uma linha."""
"component.table-cell.prop.children.doc" = """O valor."""
"component.table-cell.summary" = """Guarda um valor, com alinhamento, tom e quebra, ou um total no rodapé."""
"component.table-header-cell.guidance" = """Use uma célula de cabeçalho para nomear uma coluna, com `scope = "col"`, ou um registro, com `scope = "row"`. O cabeçalho guarda as palavras. O que uma coluna pode fazer fica no `TableColumn` dela."""
"component.table-header-cell.a11y-notes" = """O papel é `columnheader` ou `rowheader`, seguindo o `scope` e escrito na marcação em vez de ficar implícito. O controle de ordenação é um botão real dentro do cabeçalho, e só um cabeçalho com ele leva `aria-sort`."""
"component.table-header-cell.prop.column.doc" = """Qual `TableColumn` este cabeçalho nomeia. Diz ao script qual coluna o controle de ordenação daqui ordena, em vez de deixá-lo contar células. Um cabeçalho com `scope = "row"` nomeia um registro e não precisa disso."""
"component.table-header-cell.prop.scope.doc" = """O que este cabeçalho nomeia. `col` para uma coluna e `row` para o registro que a linha guarda. `colgroup` e `rowgroup` servem a um cabeçalho que abrange vários, e cada um precisa de `span` ou `rows` dizendo quantos."""
"component.table-header-cell.prop.align.doc" = """Onde as palavras ficam na célula. **Acompanhe a coluna abaixo dela**, e use `numeric` sobre uma coluna de números para o cabeçalho alinhar com os valores."""
"component.table-header-cell.prop.tone.doc" = """De qual tom do sistema de cores o cabeçalho é pintado. A paleta declara 349 famílias semânticas, e um nome que nenhuma delas declara quebra o build. Sem ele nenhum atributo é escrito."""
"component.table-header-cell.prop.wrap.doc" = """O que um cabeçalho longo faz. `nowrap` por padrão, o oposto do padrão de uma célula, então o cabeçalho fica com uma linha de altura. Use `wrap` para um cabeçalho longo sobre uma coluna estreita."""
"component.table-header-cell.prop.span.doc" = """Quantas colunas este cabeçalho cobre. Escreve o `colspan` real, e precisa de `scope = "colgroup"` ao lado para que a extensão fique declarada na marcação."""
"component.table-header-cell.prop.rows.doc" = """Quantas linhas este cabeçalho cobre, com `scope = "rowgroup"`. Para uma tabela com duas linhas de cabeçalhos, onde um deles fica sobre as duas."""
"component.table-header-cell.prop.sort.doc" = """Em que sentido as linhas já estão ordenadas por esta coluna. `none` não escreve atributo nenhum, porque um cabeçalho sem controle de ordenação não deve alegar um. **Só um cabeçalho da tabela pode ser diferente**."""
"component.table-header-cell.prop.children.doc" = """As palavras do cabeçalho. Todo anúncio sobre esta coluna preenche o buraco `{column}` a partir daqui, então a coluna é nomeada uma vez, na língua de quem lê."""
"component.table-header-cell.key.enter-or-space.name" = "Enter ou Espaço"
"component.table-header-cell.key.enter-or-space.action" = """Ordena por esta coluna quando o `TableColumn` permite: crescente, decrescente e a ordem do documento."""
"component.table-header-cell.key.alt-left-alt-right.name" = "Alt + Esquerda / Alt + Direita"
"component.table-header-cell.key.alt-left-alt-right.action" = """Estreita ou alarga a coluna em um passo quando o `TableColumn` dela é redimensionável. Com Shift, dez passos."""
"component.table-header-cell.summary" = """Nomeie uma coluna ou um registro, e ordene por ele quando a coluna permitir."""
# Os exemplos da família de tabelas. Os dados são a própria escala de espaçamento
# deste sistema.

"component.meter.guidance" = """Use um medidor para quanto de um total conhecido está em uso: 41 GB de um disco de 50 GB, 68% de um orçamento. Para uma tarefa que começa do nada e termina, use `Progress`. `low`, `high` e `optimum` colorem a barra, e `value_label` é a frase ao lado."""
"component.meter.a11y-notes" = """É um `<meter>` de verdade, então o papel, a faixa e o anúncio são da plataforma. O nome é um `<label for>` de verdade, e `value_label` vira `aria-valuetext`."""
"component.meter.prop.name.doc" = """O que está sendo medido, na marcação, e a raiz dos ids aqui. **Obrigatório**, porque um id derivado de um nome opcional é um id que toda cópia do componente na página compartilha."""
"component.meter.prop.label.doc" = """De que é a leitura, na língua de quem lê, como *Armazenamento* ou *Tokens deste mês*. **Obrigatório**, porque uma barra sem nome é uma forma. É um `<label for>` de verdade, preso ao elemento que nomeia."""
"component.meter.prop.value.doc" = """A leitura. **Obrigatória**, porque um medidor sem valor é o estado indeterminado, que pertence a `Progress`. Texto e não número, porque toda prop que cruza as duas linguagens é texto."""
"component.meter.prop.min.doc" = """O fundo da faixa. Ausente é zero. Declare para uma escala que começa abaixo de zero, como uma temperatura."""
"component.meter.prop.max.doc" = """O topo da faixa. Ausente é um, então um `value` de `0.68` sozinho é 68% sem mais nada declarado. Quem mede gigabytes escreve os dois e nunca divide."""
"component.meter.prop.low.doc" = """Abaixo disto a leitura conta como baixa. Com `optimum` é o que faz a barra mudar de cor sozinha. Uma cota em 96% fica pintada do mesmo jeito em todo navegador."""
"component.meter.prop.high.doc" = """Acima disto a leitura conta como alta. Em um disco essa é a ponta ruim e em uma bateria é a boa, o que `optimum` resolve."""
"component.meter.prop.optimum.doc" = """Onde na faixa fica o bom. Abaixo de `low` para um disco, onde vazio é bom, e acima de `high` para uma bateria, onde cheio é. Diz à plataforma que lado da faixa pintar como problema."""
"component.meter.prop.unit.doc" = """Em que os números são contados, como `GB`, `tokens` ou `%`. Não é desenhado sozinho. `value_label` preenche com ele o buraco `{unit}`, então a unidade é escrita uma vez."""
"component.meter.prop.value_label.doc" = """A frase ao lado da barra, com buracos `{value}`, `{max}`, `{unit}` e `{percent}`, como *{value} de {max} {unit} usados*. **Sem ela quem lê precisa estimar pela barra.** Também vira o `aria-valuetext` do elemento."""
"component.meter.prop.tone.doc" = """Um tom do sistema de cor, para um medidor **sem ponta boa natural**, como a parte de um total. Onde há uma ponta boa, use `low`, `high` e `optimum`."""
"component.meter.prop.size.doc" = """Que grossura tem a barra: `small`, `medium` ou `large`. Padrão `medium`. `small` serve a uma barra em célula de tabela, onde a altura da linha é o orçamento. `large` serve a uma que é o conteúdo principal."""
"component.meter.prop.hide_label.doc" = """Se o nome fica escondido da tela e mantido para um leitor de tela. Desligado por padrão. Use para uma barra em célula de tabela cujo cabeçalho de coluna já diz o que ela é."""
"component.meter.prop.show_value.doc" = """Se a frase é desenhada ao lado da barra. **Ligado por padrão**, porque uma barra sem o número dela só pode ser estimada. Desligue só onde o mesmo número já está na célula ao lado."""
"component.meter.state.level.doc" = """Onde na faixa a leitura fica: `low` abaixo de `low`, `high` acima de `high`, e `middle` entre eles ou onde nenhum limiar foi declarado. **Diz onde, não se é bom.** Que faixa é problema depende de `optimum`."""
"component.meter.summary" = """Mostre quanto de um total conhecido está em uso, como um `<meter>` real."""
"component.progress.guidance" = """Use uma barra de progresso para uma tarefa que avança, como um upload, uma importação ou um lote de registros sendo conferido. Para um nível dentro de uma faixa conhecida de antemão, use `Meter`. Um `value` ausente desenha a barra indeterminada."""
"component.progress.a11y-notes" = """Um `<progress>` de verdade com um `<label for>` de verdade fornece o papel, o valor e o estado ocupado. O `aria-valuetext` carrega o `value_label`, e a varredura para sob `prefers-reduced-motion`."""
"component.progress.prop.name.doc" = """O nome da tarefa na marcação, e a raiz dos ids daqui. **Obrigatório**, porque um id derivado de um nome opcional é compartilhado por toda cópia do componente na página."""
"component.progress.prop.label.doc" = """O que está acontecendo, na língua de quem lê, como *Enviando report.pdf*. Nomeie a **coisa** e não o ato, para que três barras não se chamem todas *Enviando*. É renderizado como um `<label for>` de verdade."""
"component.progress.prop.value.doc" = """O quanto a tarefa já andou. Um valor ausente desenha a barra indeterminada, que é o estado certo quando o servidor não mandou um total. Texto e não número, porque toda prop que cruza as duas linguagens é texto."""
"component.progress.prop.max.doc" = """O valor que conta como terminado. Ausente significa um, então um `value` de `0.58` sozinho é 58%. Quem conta arquivos escreve `max = "12"` e não divide."""
"component.progress.prop.value_label.doc" = """A frase ao lado da barra, com buracos `{value}`, `{max}` e `{percent}`: *{value} de {max} arquivos*. Vira o `aria-valuetext` do elemento, então o leitor de tela lê o que está na tela. Deixe de fora numa barra indeterminada."""
"component.progress.prop.busy_label.doc" = """O que é lido enquanto não há valor nenhum, como *Calculando o tamanho*. Defina numa barra indeterminada, porque sem isso o leitor de tela dá o estado ocupado e nada sobre a tarefa."""
"component.progress.prop.tone.doc" = """Um tom do sistema de cores. O de destaque é o padrão e serve para quase toda tarefa. Use `danger` para um upload que falhou e ficou na tela com o motivo, e `success` para um que terminou."""
"component.progress.prop.size.doc" = """A espessura da barra. `small` é para uma barra dentro de uma célula de tabela, onde a altura da linha é o orçamento. `large` é para uma barra que a pessoa acompanha sozinha."""
"component.progress.prop.hide_label.doc" = """Esconde o nome da tela e o mantém para o leitor de tela. Use numa barra dentro de uma célula cujo cabeçalho de coluna já diz o que ela é."""
"component.progress.state.busy.doc" = """Definido quando não há `value`: a tarefa está rodando e não se sabe o quanto já andou. É renderizado da ausência de `value`, então o atributo e a barra não podem discordar. A folha de estilo pendura nele a varredura indeterminada."""
"component.progress.summary" = """Mostre o quanto uma tarefa já andou, ou que ela está rodando sem total conhecido."""
# Meter e Progress. Leituras de verdade, porque uma barra de lero-lero é uma
# barra que ninguém percebe estar errada.
