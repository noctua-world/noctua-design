# --- O espécime completo no topo da página de tipografia --------------------

"specimen.title" = "Tudo, em uma página só"
"specimen.lead" = """Um título, a frase abaixo dele, o texto abaixo disso, e as marcas que um parágrafo carrega. Cada elemento aqui é o próprio componente, e não uma imagem dele."""
"specimen.section.title" = "Uma seção, e o texto abaixo dela"
"specimen.body" = """Este é o texto corrido no tamanho padrão. A linha termina na **medida**, e não na borda da janela. Uma palavra pode ser *enfatizada*, e um token como `--noctua-space-paragraph` cabe dentro da frase."""
"specimen.body.two" = """O espaço entre estes dois parágrafos é um degrau nomeado, e o espaço acima do título também. Nada aqui define um número: mude o que o degrau significa e todas as páginas se movem juntas."""
"specimen.lists.title" = "Listas"
"specimen.lists.body" = "Não ordenada e ordenada, as duas espaçadas pela mesma escala."
"specimen.marks.title" = "As marcas"
"specimen.marks.body" = "Cada linha abaixo é um componente, fazendo a única coisa para a qual ele serve."
"specimen.mark.link" = "Um link para outro lugar"
"specimen.mark.strong" = "Algo que importa"
"specimen.mark.em" = "Algo dito com peso"
"specimen.mark.mark" = "Algo que você acabou de buscar"
"specimen.mark.abbr.title" = "O que você vê é o que você obtém"
"specimen.code.title" = "E um bloco de código"
"specimen.code.body" = """Largo o bastante para rolar, focalizável para que o teclado consiga rolar, e com um controle que o copia."""
"specimen.components.title" = "Todos os componentes"
"component.code-block.guidance" = """Use um bloco de código para um bloco de código. Para um fragmento dentro de uma frase, use `Code`. O código chega como prop e não como filhos, o que permite numerar uma linha e colorir um token. O script adiciona o copiar e o recolhimento."""
"component.code-block.a11y-notes" = """A cor nunca é o único sinal: um comentário vai em itálico, uma palavra-chave em negrito, e uma linha marcada tem um traço na borda. A região rolável é alcançável por teclado e nomeada por `filename` ou pela linguagem."""
"component.code-block.prop.code.doc" = """O código. Texto e não filhos, porque um componente que não lê o próprio conteúdo não numera uma linha, não marca uma e não colore um token."""
"component.code-block.prop.language.doc" = """Em qual linguagem lê-lo: `rust`, `ts`, `sh`, `diff`. Um apelido resolve para a linguagem dele, e um nome que nada reconhece é renderizado como texto simples. Texto livre e não enum, porque a lista vive em `spec/grammars/`."""
"component.code-block.prop.theme.doc" = """Qual tema de sintaxe o pinta. `auto` segue a configuração de página de quem lê, e resolve para `mono` sob mais contraste, tela monocromática, cores forçadas e impressão. Outro valor sobrepõe os dois. O atributo é sempre escrito."""
"component.code-block.prop.filename.doc" = """O arquivo de onde isto veio, mostrado na barra acima do bloco. É também o nome acessível da região rolável, que sem ele recorre à linguagem."""
"component.code-block.prop.caption.doc" = """Uma frase sob o bloco, na língua de quem lê."""
"component.code-block.prop.numbered.doc" = """Se cada linha é numerada. Desligado por padrão. Os números são desenhados por um contador CSS e não são selecionáveis, então copiar o bloco copia o código e não uma coluna de dígitos."""
"component.code-block.prop.start_line.doc" = """O número da primeira linha, para um trecho que começa no meio de um arquivo. Texto, porque uma prop de spec é texto, enum ou flag. É interpretado, e o que não dá para interpretar vira 1."""
"component.code-block.prop.mark_lines.doc" = """Linhas a destacar, como `3,7-9`. Cada linha marcada ganha um tom de fundo e um traço na borda inicial. Uma linha destacada só pela cor não pode ser achada por quem é daltônico."""
"component.code-block.prop.focus.doc" = """Se cada linha que `mark_lines` não nomeou fica esmaecida. Desligado por padrão, e não faz nada sem marcas. É uma flag separada e não um modo, para a marcação e o esmaecimento serem definidos à parte."""
"component.code-block.prop.wrap.doc" = """Se linhas longas quebram em vez de rolar. Desligado por padrão. Prefira quebrar onde a linha é quase prosa e rolar onde ela é estrutura."""
"component.code-block.prop.max_lines.doc" = """Recolhe o bloco a esta quantidade de linhas atrás de um controle. **Com o script bloqueado o bloco inteiro fica visível** e nenhum controle diz o contrário, porque o recolhimento é uma melhoria."""
"component.code-block.prop.expand_label.doc" = """O nome do controle que abre um bloco recolhido. É ele que liga o recurso: sem nome não há recolhimento, porque este pacote não sabe nomear um chevron na língua de quem lê."""
"component.code-block.prop.collapse_label.doc" = """O nome que esse controle assume com o bloco aberto."""
"component.code-block.prop.wrap_label.doc" = """O nome do controle que alterna a quebra de linha. É ele que liga o recurso, pelo mesmo motivo."""
"component.code-block.prop.copy.doc" = """O nome acessível do controle de copiar, e o que o liga: sem nome não há controle. Ele copia o texto original, nunca a marcação e nunca os números de linha."""
"component.code-block.prop.copied.doc" = """O que a região dinâmica diz quando a cópia dá certo. Sem ele o controle ainda funciona e ainda troca o glifo, mas quem usa leitor de tela não recebe confirmação."""
"component.code-block.prop.glass.doc" = """Fosca o bloco. Desligado por padrão, e raramente certo, porque código é lido por muito tempo e um fundo em movimento dificulta isso."""
"component.code-block.key.tab.name" = "Tab"
"component.code-block.key.tab.action" = """Alcança o código, depois os controles na barra. O código é um elemento focável próprio, e não o `<pre>`."""
"component.code-block.key.arrow-keys.name" = "Setas"
"component.code-block.key.arrow-keys.action" = """Rolam o código depois que ele tem foco. Um bloco que rola e não pode receber foco falha na WCAG 2.1.1."""
"component.search.guidance" = """Use uma busca quando a pessoa precisa achar uma coisa entre muitas: páginas, comandos, registros. Para uma lista de seis, use `Select` com `searchable`. Os children são links reais que funcionam sem script, e `src` é um índice JSON que precisa dele."""
"component.search.a11y-notes" = """O script escreve `role="combobox"`, `aria-expanded`, `aria-controls` e `aria-activedescendant`, e esta marcação não escreve nenhum deles. O `role="option"` vai na linha, nunca no link dentro dela."""
"component.search.prop.name.doc" = """O que está sendo buscado, como um script o encontra. É a raiz de todo id daqui: o do input, o do rótulo, o do painel, o do listbox e o do diálogo. **Obrigatório**, porque um id derivado de um nome opcional se repete em toda cópia."""
"component.search.prop.label.doc" = """O que isto busca, na língua de quem lê. Um `<label for>` de verdade, escondido visualmente por padrão, e também o nome do marco e o da lista de resultados. Uma string, três consumidores. Obrigatório."""
"component.search.prop.placeholder.doc" = """A dica dentro da caixa, e as palavras que o controle do diálogo mostra antes de ser aberto. Nunca o único nome que o campo tem."""
"component.search.prop.value.doc" = """O texto com que a caixa começa. Use para uma consulta trazida de volta de uma página de resultados, para que quem chegou de uma veja o que pediu."""
"component.search.prop.presentation.doc" = """Onde os resultados aparecem: `inline` abaixo da caixa, `popover` num painel ancorado a ela, ou `dialog` num modal. `dialog` é o mais barato, porque o `showModal()` do navegador dá a armadilha de foco, o fundo inerte e o Escape."""
"component.search.prop.size.doc" = """O tamanho da caixa: `small`, `medium` ou `large`, acompanhando o `Button` passo a passo, para uma busca ao lado de um botão ficar alinhada. `medium` por padrão."""
"component.search.prop.src.doc" = """O endereço de um índice JSON, `{"entries": [{"label", "href", "detail", "group", "badge", "keywords"}]}`, buscado na primeira vez que a busca é aberta. Use para um índice grande demais para caber em cada documento."""
"component.search.prop.action.doc" = """Para onde a caixa envia quando nada está destacado. Põe um `<form method="get">` de verdade em volta do campo, então o Enter chega a algum lugar com o script bloqueado. O teclado do telefone oferece *Buscar*."""
"component.search.prop.query.doc" = """O nome sob o qual a consulta é enviada, dentro desse formulário. `q` por padrão, que é o que quase toda busca da web lê."""
"component.search.prop.cap.doc" = """Quantos resultados são desenhados de uma vez, como texto. Texto porque toda prop que cruza as duas linguagens é texto. Sem ele todos aparecem, o que serve a um filtro de trinta linhas e não a um índice de três mil."""
"component.search.prop.filter.doc" = """Se a busca também esconde o que não casou na página em volta, ou seja, todo elemento com `data-nd-index` dentro do mesmo marco. Desligado por padrão, porque um controle que alcança para fora de si precisa ser pedido."""
"component.search.prop.hotkey.doc" = """Se esta busca responde ao atalho: Command-K em hardware da Apple, Control-K no resto, e `/` quando nada mais está sendo digitado. As duas grafias são desenhadas e a folha de estilo mostra uma. **Uma página, um atalho**."""
"component.search.prop.clearable.doc" = """Se aparece um controle para esvaziar a caixa. Ligado por padrão, ao contrário do `Select`, porque uma busca vazia é sempre uma resposta legítima."""
"component.search.prop.loading.doc" = """Se o que é buscado ainda está a caminho. O painel diz isso em vez de não mostrar nada, porque um resultado vazio e um resultado que não chegou significam o oposto."""
"component.search.prop.disabled.doc" = """Impede a digitação na caixa. O atributo de verdade em vez de `aria-disabled`, porque só o de verdade mantém um campo recusado fora do envio."""
"component.search.prop.glass.doc" = """Fosca a caixa e o painel juntos. Um material, não dois."""
"component.search.prop.recent.doc" = """A chave sob a qual as consultas recentes ficam guardadas. Sem ela nada é guardado, então guardar as consultas da pessoa é uma coisa que quem chama pede, e não um padrão."""
"component.search.prop.status.doc" = """Quantos resultados existem, com um marcador `{count}`. Uma frase inteira com um buraco só, nunca um número colado a uma palavra. Pode carregar uma forma por categoria de plural, como `one:{count} resultado|other:{count} resultados`."""
"component.search.prop.empty_label.doc" = """O que o painel diz quando nada casou. Sem isso o painel fica em silêncio, o que não é uma resposta."""
"component.search.prop.loading_label.doc" = """O que o painel diz enquanto o que é buscado ainda vem. Uma frase separada de `empty_label`, porque uma busca lenta e uma busca vazia são fatos opostos."""
"component.search.prop.error_label.doc" = """O que o painel diz quando o índice em `src` nunca chegou. Um terceiro fato, separado de nada ter casado e de nada ter chegado ainda."""
"component.search.prop.cap_label.doc" = """A frase que diz que a lista foi cortada, com os marcadores `{shown}` e `{total}`. Sem ela uma busca limitada mostra dez respostas onde havia trezentas e não diz nada do resto."""
"component.search.prop.clear_label.doc" = """O nome do controle que esvazia a caixa. Ele é um glifo, então este é o único nome que tem."""
"component.search.prop.recent_label.doc" = """O título sobre as consultas que a pessoa fez antes. Informe junto com `recent`, porque uma lista de palavras sem título não se distingue de uma lista de resultados."""
"component.search.prop.forget_label.doc" = """O nome do controle que esvazia esse histórico. Tudo que um componente guarda sobre a pessoa precisa de um jeito de ela limpar, no mesmo lugar em que vê."""
"component.search.prop.close_label.doc" = """O nome do controle que fecha o diálogo. O Escape fecha e um toque fora também, e nenhum dos dois é visível numa tela sensível ao toque."""
"component.search.prop.children.doc" = """Os resultados: `SearchGroup`s, `SearchResult`s, ou os dois. Links de verdade, então uma página sem script continua com uma lista de links."""
"component.search.key.down-arrow.name" = "Seta para baixo"
"component.search.key.down-arrow.action" = """Vai ao próximo resultado, e abre o painel se ele estiver fechado. O foco fica na caixa o tempo todo."""
"component.search.key.up-arrow.name" = "Seta para cima"
"component.search.key.up-arrow.action" = """Vai ao resultado anterior, e abre o painel se ele estiver fechado."""
"component.search.key.home-end.name" = "Home / End"
"component.search.key.home-end.action" = """Move o cursor para o começo ou o fim do que foi digitado, não para as pontas da lista."""
"component.search.key.control-or-command-with-home-end.name" = "Control ou Command com Home / End"
"component.search.key.control-or-command-with-home-end.action" = """Vai ao primeiro e ao último resultado."""
"component.search.key.page-up-page-down.name" = "Page Up / Page Down"
"component.search.key.page-up-page-down.action" = """Move uma página medida de linhas, limitada nas pontas em vez de dar a volta."""
"component.search.key.enter.name" = "Enter"
"component.search.key.enter.action" = """Segue o resultado destacado. Command ou Control o abre em nova aba. Sem nada destacado, envia o formulário."""
"component.search.key.escape.name" = "Escape"
"component.search.key.escape.action" = """Limpa o que foi digitado. Apertar de novo fecha o painel."""
"component.search.key.tab.name" = "Tab"
"component.search.key.tab.action" = """Sai da busca. Dentro do diálogo o navegador circula por ele."""
"component.search.key.command-or-control-with-k.name" = "Command ou Control com K"
"component.search.key.command-or-control-with-k.action" = """Põe o foco na caixa de qualquer lugar, inclusive de dentro de outro campo de texto. Precisa do `hotkey`."""
"component.search.key.slash.name" = "Barra"
"component.search.key.slash.action" = """Põe o foco na caixa, mas nunca enquanto se digita em outro lugar. Precisa do `hotkey`."""
"component.search-group.guidance" = """Use um grupo de busca para uma sequência nomeada de resultados dentro de um `Search`. Serve a um índice que mistura tipos como páginas, tokens e comandos. Ele diz de que tipo é cada resultado para quem percorre a lista."""
"component.search-group.prop.label.doc" = """O que é esta sequência, na língua de quem lê. **Obrigatório**, porque uma sequência sem nome é um traço na lista sem nada que diga por que está ali."""
"component.search-group.prop.children.doc" = """Os `SearchResult`s dentro dela."""
"component.search-result.guidance" = """Use um resultado de busca para uma linha de uma lista de resultados. Ele renderiza um link de verdade, então dá para clicar com o botão do meio, favoritar e ler com o script bloqueado."""
"component.search-result.prop.href.doc" = """Para onde o resultado leva. **Obrigatório**, porque um resultado sem destino não pode ser um link."""
"component.search-result.prop.label.doc" = """O nome do resultado, e o que a busca compara com mais peso. Texto em vez de children, para que o script possa marcar as letras que casaram sem destruir nada que quem chama tenha colocado ali."""
"component.search-result.prop.detail.doc" = """A segunda linha, dizendo o que o resultado é ou onde ele mora. Renderiza dentro do link em vez de ao lado, então entra no nome acessível do resultado."""
"component.search-result.prop.badge.doc" = """Uma palavra curta ao lado do nome, como *Novo* ou *Obsoleto*. Também dentro do link, para que o leitor de tela a leia junto com o nome."""
"component.search-result.prop.keywords.doc" = """Outras palavras a que este resultado responde, separadas por espaços. São comparadas mas nunca desenhadas. Uma linha que casou só por uma delas não é destacada, porque as letras que casaram não estão na tela."""
"component.search-result.prop.current.doc" = """Se este resultado é a página em que quem lê já está. Desenha uma marca e escreve `aria-current`, então a posição é anunciada e não só mostrada."""
# O seletor de cores. Toda palavra que um leitor vê num exemplo dele, porque
# toda palavra que ele mostra é uma prop — veja o último parágrafo do contrato.
"example.color-picker.label" = "Cor do rótulo"
"example.color-picker.tags-label" = "Cores das tags"
"example.color-picker.brand-label" = "Cor da marca"
"example.color-picker.trigger" = "Escolha uma cor. Agora é {value}."
"example.color-picker.area" = "Saturação e brilho"
"example.color-picker.hue" = "Matiz"
"example.color-picker.alpha" = "Transparência"
"example.color-picker.entry" = "Ou digite uma"
"example.color-picker.entry-invalid" = "{value} não é uma cor que isto saiba ler."
"example.color-picker.eyedropper" = "Pegar uma cor da tela"
"example.color-picker.recent" = "Escolhidas há pouco"
"example.color-picker.forget" = "Esquecer estas"
"example.color-picker.codes" = "Códigos"
"example.color-picker.copy" = "Copiar a notação {format}"
"example.color-picker.copied" = "Copiado."
"example.color-picker.close" = "Fechar o seletor"
"example.color-picker.spectrum" = "Livre"
"example.color-picker.palette" = "Noctua"
"example.color-picker.add" = "Adicionar esta cor"
"example.color-picker.remove" = "Remover {value}"
"example.color-picker.added" = "{value} adicionada."
"example.color-picker.removed" = "{value} removida."
"example.color-picker.status" = "one:{count} cor|other:{count} cores"
"example.color-picker.max" = "Quatro é o máximo que esta lista aceita."
"example.color-picker.hint" = "Ela aparece ao lado do rótulo em todo lugar em que o rótulo é usado."
"example.color-picker.error" = "Essa cor não tem contraste suficiente contra a página."
"example.color-picker.send" = "Salvar"
"example.color-picker.plain-note" = """Abra **Códigos** para ver as notações, e aperte uma para copiá-la."""
"example.color-picker.extras-note" = """O conta-gotas fica de fora onde o navegador não tem `EyeDropper`. `recent` precisa de uma chave de armazenamento vinda de quem chama."""
"example.color-picker.multiple-note" = """`multiple` deixa a pessoa acrescentar e remover cores até `max`. Remover uma leva o foco para o controle ao lado."""
"example.color-picker.palette-note" = """`palette` acrescenta as rampas do sistema de cores, e cada passo carrega o token para colar numa folha de estilo."""
"example.color-picker.form-note" = """Com o script bloqueado, cada seletor é um `<input type="color">` de verdade que envia o valor com o formulário."""
"component.field.guidance" = """Use um campo em volta de um controle que precisa de rótulo, dica ou mensagem de erro. Ele desenha os três e não renderiza controle nenhum. Para uma caixa de seleção ou um rádio, use `Checkbox` ou `Radio`, que desenham o próprio rótulo."""
"component.field.a11y-notes" = """O rótulo é um `<label for>` de verdade, ou um `<legend>` quando `kind` é `group`. A dica e o erro são descrição e não rótulo: eles vão no `aria-describedby` do próprio controle."""
"component.field.prop.control.doc" = """O id do controle que isto rotula. **Obrigatório**: um `<label>` sem alvo não nomeia nada. A dica e o erro tiram os ids dele, como `{control}-hint` e `{control}-error`, para onde o `aria-describedby` do controle precisa apontar."""
"component.field.prop.label.doc" = """A pergunta, na língua de quem lê. É renderizada como um `<label for>` de verdade, ou como um `<legend>` quando `kind` é `group`. Nunca use um placeholder no lugar, porque ele some assim que a pessoa digita."""
"component.field.prop.kind.doc" = """Se isto rotula um controle ou vários. `single` renderiza um `<div>` com um `<label>`. `group` renderiza um `<fieldset>` com um `<legend>`, o único arranjo que nomeia um conjunto de controles."""
"component.field.prop.hint.doc" = """O que a pessoa precisa saber antes de responder, como *Por exemplo, 27 3 2007*. Vai no `aria-describedby` do controle, então é lida junto com ele."""
"component.field.prop.error.doc" = """O que está errado, depois de um envio. Leva `role="alert"`, então uma mensagem que aparece depois do carregamento é anunciada. É a frase de quem chama, e nada aqui a altera."""
"component.field.prop.required.doc" = """Se a pergunta é marcada como uma que precisa ser respondida. **A marca é tudo o que isto faz.** O atributo `required` de verdade fica no controle de verdade, porque só ele impede o envio."""
"component.field.prop.required_label.doc" = """A palavra que marca a pergunta, na língua de quem lê, como *obrigatório*. Necessária na prática pelo `required`. Uma palavra em vez de um asterisco, que é invisível para quem não enxerga."""
"component.field.prop.size.doc" = """A escala tipográfica da pergunta e das frases embaixo dela: `small`, `medium` ou `large`. Combine com o controle que ele envolve."""
"component.field.prop.disabled.doc" = """Esmaece a pergunta para combinar com um controle desabilitado. Com `kind = "single"` **ele não desabilita nada**, porque o atributo de verdade fica no controle. Com `kind = "group"` ele é o atributo de verdade no `<fieldset>`."""
"component.field.prop.children.doc" = """O controle que este campo rotula. Normalmente exatamente um, porque o campo desenha uma pergunta só."""
"component.field.state.invalid.doc" = """Definido quando um `error` foi dado, ou quando um script marcou o controle como inválido. Três coisas mudam: um traço na borda inicial do campo, a borda do controle e a frase. O rótulo mantém a cor. Nunca a cor sozinha (`NOCTUA.md §8.8.6`)."""
# --- Os controles de entrada -------------------------------------------------

"component.input.guidance" = """Use um campo de texto para uma linha que a pessoa escreve: um nome, um endereço, um código, uma senha. Para várias linhas use `Textarea`, para uma quantidade use `NumberInput`, para vários valores use `TagPicker`. `kind` escolhe o teclado do celular."""
"component.input.a11y-notes" = """A pergunta é um `<label for>` de verdade desenhado por `Field`, nunca um `aria-label` e nunca um placeholder. A dica e o erro viajam no `aria-describedby`, nessa ordem, então são lidos no controle."""
"component.input.prop.name.doc" = """O campo sob o qual isto é enviado, e a raiz de cada id aqui. **Obrigatório**, porque um id derivado de um nome opcional é um id que toda cópia do componente na página compartilha."""
"component.input.prop.label.doc" = """A pergunta, na língua de quem lê. **Obrigatória**. É um `<label for>` de verdade desenhado por `Field`, nunca um placeholder, porque um placeholder some assim que se digita."""
"component.input.prop.kind.doc" = """O que está sendo pedido: `text`, `email`, `tel`, `url` ou `password`. Padrão `text`. Escolhe o **teclado que o celular abre** e a validação que a plataforma já tem. `search` está ausente, porque esse controle é `Search`."""
"component.input.prop.value.doc" = """O que a caixa traz de início. Renderizado no servidor, então um formulário que volta com erro volta com o que foi digitado."""
"component.input.prop.placeholder.doc" = """Um exemplo do formato de uma resposta, como *ada@example.org*, dentro da caixa. **Nunca o único nome do campo.** Ele some na primeira tecla, tem baixo contraste em todo motor e não é anunciado como rótulo."""
"component.input.prop.hint.doc" = """O que a pessoa precisa saber antes de responder. Desenhada por `Field` e apontada pelo `aria-describedby` desta caixa, então é lida com o controle e não encontrada depois."""
"component.input.prop.error.doc" = """O que está errado, depois de um envio, nas palavras de quem chama. É um `role="alert"`. A bolha da plataforma diz *Preencha este campo*, o que não diz o que o campo queria."""
"component.input.prop.required.doc" = """Se uma resposta é necessária. Desligado por padrão. É o atributo **real** na caixa **real**, então o navegador recusa o envio sem script nenhum. `Field` desenha a palavra ao lado da pergunta."""
"component.input.prop.required_label.doc" = """A palavra com que `Field` marca a pergunta, como *obrigatório*. Necessária sempre que `required` estiver definido, porque uma marca sozinha não diz nada a quem encontra o formulário pela primeira vez."""
"component.input.prop.disabled.doc" = """Se o controle é recusado. Desligado por padrão. É o atributo real, porque só o real impede um formulário de enviar. Um campo desabilitado não envia **nada**, o que é uma resposta diferente de uma vazia."""
"component.input.prop.readonly.doc" = """Se o valor pode ser lido e copiado mas não mudado. Desligado por padrão. Ao contrário de `disabled`, ele ainda é enviado, ainda recebe foco e ainda é anunciado. Use para um número de referência que precisa ser copiado."""
"component.input.prop.size.doc" = """O tamanho da caixa: `small`, `medium` ou `large`. Padrão `medium`, e acompanha `Button` passo a passo, para o campo e o controle ao lado ficarem na mesma linha. O texto dentro nunca fica menor que o do corpo, e o celular não dá zoom."""
"component.input.prop.icon.doc" = """Um ícone dentro da caixa, antes do texto. Diz de relance que tipo de resposta é esta, e é `aria-hidden`, porque a pergunta acima dele é o nome."""
"component.input.prop.prefix.doc" = """Uma palavra ou símbolo fixo antes do valor, dentro da caixa, como `https://`, `R$` ou `+55`. **Não** faz parte do valor enviado, e é `aria-hidden`."""
"component.input.prop.suffix.doc" = """Uma palavra ou símbolo fixo depois do valor, como `.com`, `kg` ou `%`. Mesma regra: desenhado, nunca enviado."""
"component.input.prop.clearable.doc" = """Se aparece um controle para esvaziar a caixa. Desligado por padrão. Esvaziar um campo custa um gesto que quem lê já conhece. Ele guarda o espaço dele com a caixa vazia, então nada se mexe enquanto se digita."""
"component.input.prop.clear_label.doc" = """O nome desse controle. Ele é um glifo, então este é o único nome que ele tem."""
"component.input.prop.maxlength.doc" = """O máximo de caracteres que a caixa aceita. É o atributo real, então o navegador para a tecla em vez de um script notar depois. Texto e não número, porque todo prop que cruza as duas linguagens é texto."""
"component.input.prop.counter.doc" = """Se mostra quanto espaço resta. Desligado por padrão, e desejado sempre que `maxlength` estiver definido. Uma caixa que para de aceitar caracteres em silêncio não dá nenhum motivo a quem digita."""
"component.input.prop.counter_label.doc" = """O que a contagem diz, com buracos `{count}` e `{max}`, como *{count} de {max}*. Uma frase inteira com dois buracos. Pode levar uma forma por categoria de plural, como `Search.status` leva."""
"component.input.prop.reveal_label.doc" = """O nome do controle que mostra uma senha. Desejado sempre que `kind` for `password`, porque quem não vê o que digitou não consegue corrigir."""
"component.input.prop.conceal_label.doc" = """O nome que ele assume com a senha à mostra. Um alternador que mantém um só nome anuncia o estado errado desde o primeiro toque. Nenhum script pode inventar o outro nome na língua de quem lê."""
"component.input.prop.autocomplete.doc" = """O que o navegador deve oferecer para preencher, como `email`, `given-name` ou `new-password`. **Vale escrever sempre**: é o que um gerenciador de senhas lê, e troca um formulário digitado por dois toques. `off` é uma decisão, e não um padrão."""
"component.input.prop.pattern.doc" = """Uma expressão regular com que o valor precisa casar, usando o atributo próprio da plataforma. Sempre acompanhe de um `hint` dizendo qual é o formato. Um campo que recusa uma resposta sem dizer o que queria deixa a pessoa adivinhando."""
"component.input.prop.spellcheck.doc" = """Se o navegador sublinha o que julga ser erro. **Desligado por padrão**, o contrário da plataforma. Um nome, um código, um endereço e uma senha são coisas sobre as quais um dicionário está errado."""
"component.input.prop.glass.doc" = """Fosca a caixa. Desligado por padrão. O texto dentro fica sobre um fundo opaco o bastante para ser lido."""
"component.input.state.invalid.doc" = """Se um `error` foi dado ou a plataforma recusou o valor. A borda assume o tom de perigo e a frase aparece sob a pergunta, nunca a cor sozinha (`NOCTUA.md §8.8.6`)."""
"component.input.state.revealed.doc" = """Se uma senha está à mostra. Fica no invólucro, para o controle trocar o glifo e o nome junto, e nunca é guardado entre carregamentos de página."""
"component.input.key.escape.name" = "Escape"
"component.input.key.escape.action" = """Esvazia a caixa, quando ela é `clearable` e tem algo dentro. Não faz nada quando não há o que limpar."""
"component.textarea.guidance" = """Use um textarea para uma resposta de várias linhas: uma descrição, uma nota, uma mensagem, um endereço. Para uma linha só, use `TextInput`. Com `autosize` a caixa cresce em vez de rolar."""
"component.textarea.a11y-notes" = """A pergunta é um `<label for>` de verdade, desenhado pelo `Field`. O contador é `role="status"` e educado, e fala quando a digitação pausa em vez de uma vez por caractere. Crescer não é anunciado."""
"component.textarea.prop.name.doc" = """O nome do campo sob o qual isto é enviado, e a raiz de todo id daqui. **Obrigatório**, porque um id derivado de um nome ausente é o mesmo id em cada cópia do componente."""
"component.textarea.prop.label.doc" = """A pergunta, na língua de quem lê. O `Field` a desenha como um `<label for>` de verdade."""
"component.textarea.prop.value.doc" = """O que a caixa traz de início. Um `<textarea>` carrega o valor como **conteúdo** e não como atributo, então isto também não é um atributo. Um valor com quebra de linha sobrevive à marcação."""
"component.textarea.prop.placeholder.doc" = """Um exemplo do formato de uma resposta, dentro da caixa. Nunca o único nome que a caixa tem, pelos motivos do `TextInput.placeholder`."""
"component.textarea.prop.hint.doc" = """O que a pessoa precisa saber antes de responder. O `Field` a desenha, e o `aria-describedby` do controle aponta para ela."""
"component.textarea.prop.error.doc" = """O que está errado, depois de um envio. Leva `role="alert"`, e é a frase de quem chama."""
"component.textarea.prop.required.doc" = """Se uma resposta é necessária. O atributo `required` de verdade na caixa de verdade, então o navegador recusa o envio sem script nenhum."""
"component.textarea.prop.required_label.doc" = """A palavra com que o `Field` marca a pergunta. Necessária na prática pelo `required`."""
"component.textarea.prop.disabled.doc" = """Se o controle está desabilitado. Uma caixa desabilitada não envia nada, que é uma resposta diferente de uma vazia."""
"component.textarea.prop.readonly.doc" = """Se a caixa é legível e copiável mas não editável. Ao contrário de `disabled`, uma caixa somente de leitura continua sendo enviada."""
"component.textarea.prop.rows.doc" = """Quantas linhas a caixa tem, ou o mínimo que ela pode ter quando `autosize` está ligado. Texto e não número, porque toda prop que atravessa as duas linguagens é texto. O padrão de duas linhas vale ser trocado."""
"component.textarea.prop.autosize.doc" = """Se a caixa cresce para caber o que está nela. Desligado por padrão, porque uma caixa que cresce move tudo o que está embaixo dela. Ligado, `rows` vira um piso e a caixa nunca rola o próprio conteúdo."""
"component.textarea.prop.max_rows.doc" = """Até que altura o `autosize` pode crescer a caixa antes de ela começar a rolar. Sem isso, uma resposta longa colada empurra o controle de enviar para fora da tela."""
"component.textarea.prop.resize.doc" = """Se a pessoa pode arrastar a caixa para aumentá-la, e em quais direções: `none`, `vertical` ou `both`. **Vertical por padrão e nunca horizontal sozinho**, porque uma caixa mais larga que a coluna cobre o vizinho. `none` quer `autosize`."""
"component.textarea.prop.maxlength.doc" = """O máximo de caracteres que a caixa aceita, imposto pelo navegador em vez de conferido por um script depois."""
"component.textarea.prop.counter.doc" = """Se deve mostrar quanto espaço sobrou. Necessário na prática pelo `maxlength`, porque uma caixa que para de aceitar caracteres em silêncio não dá nenhum motivo a quem digita."""
"component.textarea.prop.counter_label.doc" = """O que a contagem diz, com buracos `{count}` e `{max}`. Uma frase com dois buracos, e ela pode trazer uma forma por categoria de plural."""
"component.textarea.prop.spellcheck.doc" = """Se o navegador sublinha o que ele toma por erros. **Ligado por padrão**, ao contrário do `TextInput`, porque esta caixa contém prosa."""
"component.textarea.prop.size.doc" = """O preenchimento da caixa e o tipo dentro dela: `small`, `medium` ou `large`, acompanhando o resto do formulário."""
"component.textarea.prop.glass.doc" = """Se a caixa é fosca. Use sobre um fundo opaco o bastante para ler várias linhas em cima dele."""
"component.textarea.state.invalid.doc" = """Definido quando um `error` foi dado, ou quando a plataforma recusou o valor. A borda assume o tom de perigo e a frase aparece embaixo da pergunta."""
"component.number-input.guidance" = """Use um campo numérico para uma quantidade: quantos, quanto, por quanto tempo. Para um código feito de dígitos, use `Input` com um `inputmode`. O campo é `type="text"` com um `pattern`, então um valor que ele não lê é preservado."""
"component.number-input.a11y-notes" = """`role="spinbutton"`, seus atributos de valor e os botões de passo são todos escritos pelo script, porque sem script não há o que girar. Os botões de passo não são paradas de tabulação, porque as setas já movem o valor."""
"component.number-input.prop.name.doc" = """O campo sob o qual isto é enviado, e a raiz de todo id daqui. **Obrigatório**, porque um id derivado de um nome opcional é um id que toda cópia na página compartilha."""
"component.number-input.prop.label.doc" = """A pergunta, na língua de quem lê. O `Field` a desenha como um `<label for>` de verdade. Obrigatório."""
"component.number-input.prop.value.doc" = """A quantidade inicial, como texto. Texto porque é isso que um formulário envia. Um valor que o componente não consegue interpretar é mostrado de volta em vez de ser trocado por nada."""
"component.number-input.prop.min.doc" = """O menor valor permitido. Os botões de passo param aqui, e um valor digitado abaixo dele é recusado com `min_label` em vez de reescrito."""
"component.number-input.prop.max.doc" = """O maior valor permitido, nos mesmos termos de `min`."""
"component.number-input.prop.step.doc" = """Quanto um toque num botão de passo ou uma tecla de seta move o valor. Um por padrão, e um preço quer `0.01` onde uma dúzia quer `12`. Também define com quantas casas o valor é mostrado, e qual teclado o celular abre."""
"component.number-input.prop.big_step.doc" = """Quanto o Page Up e o Page Down movem o valor. Dez passos por padrão, para uma faixa grande poder ser atravessada pelo teclado. O `ColorPicker` tem um passo grosso pelo mesmo motivo."""
"component.number-input.prop.steppers.doc" = """Se os dois controles de passo aparecem. **Ligados por padrão**, porque transformam um ajuste pequeno em um toque, em vez de selecionar tudo e redigitar. Desligue onde os números são grandes demais para se chegar de passo em passo."""
"component.number-input.prop.increment_label.doc" = """O nome do controle que soma um passo. Informe junto com `steppers`, porque os controles são glifos e este é o único nome que cada um tem."""
"component.number-input.prop.decrement_label.doc" = """O nome do controle que subtrai um passo, nos mesmos termos."""
"component.number-input.prop.min_label.doc" = """O que o componente diz quando um valor digitado está abaixo de `min`, com um buraco `{min}`. O valor fica exatamente como foi digitado, para a pessoa poder corrigir."""
"component.number-input.prop.max_label.doc" = """O que o componente diz quando um valor digitado está acima de `max`, com um buraco `{max}`."""
"component.number-input.prop.invalid_label.doc" = """O que o componente diz quando o que foi digitado não é um número, com um buraco `{value}`. Informe, porque este campo aceita texto de propósito, onde um campo `type="number"` ficaria vazio em silêncio."""
"component.number-input.prop.group.doc" = """Se os separadores de milhar são desenhados enquanto a pessoa não digita: `1.234.567` em português, `1,234,567` em inglês, a partir do locale da página. Nunca são enviados e nunca estão lá enquanto a caixa tem foco."""
"component.number-input.prop.prefix.doc" = """Um símbolo fixo antes do valor, dentro da caixa, como `R$` ou `£`. Desenhado, `aria-hidden`, e nunca parte do que é enviado."""
"component.number-input.prop.suffix.doc" = """Um símbolo fixo depois do valor, como `kg`, `%` ou `min`, nos mesmos termos."""
"component.number-input.prop.placeholder.doc" = """Uma quantidade de exemplo, dentro da caixa enquanto ela está vazia. Nunca o único nome que o campo tem."""
"component.number-input.prop.hint.doc" = """O que a pessoa precisa saber antes de responder. Desenhada pelo `Field`."""
"component.number-input.prop.error.doc" = """O que está errado, depois de um envio. A frase de quem chama, com `role="alert"`."""
"component.number-input.prop.required.doc" = """Se uma resposta é necessária. O atributo de verdade na caixa de verdade."""
"component.number-input.prop.required_label.doc" = """A palavra com que o `Field` marca a pergunta. Informe junto com `required`."""
"component.number-input.prop.disabled.doc" = """Impede a edição do valor. Recusa a caixa e os botões de passo, e não envia nada."""
"component.number-input.prop.readonly.doc" = """Se o valor é legível e copiável mas não editável. Continua sendo enviado, e os botões de passo travam junto, porque um valor que ainda pudesse ser incrementado seria editável."""
"component.number-input.prop.size.doc" = """O tamanho da caixa e dos botões de passo: `small`, `medium` ou `large`. `medium` por padrão, acompanhando o resto do formulário."""
"component.number-input.prop.glass.doc" = """Fosca a caixa, sobre um fundo opaco o bastante para se ler dígitos."""
"component.number-input.state.invalid.doc" = """Marcado quando um `error` foi informado, ou o valor está fora da faixa ou não é um número. A borda assume o tom de perigo e uma das frases de quem chama aparece sob a pergunta."""
"component.number-input.key.up-arrow-down-arrow.name" = "Seta para cima / Seta para baixo"
"component.number-input.key.up-arrow-down-arrow.action" = """Move o valor em um `step`. É o contrato do spinbutton, e o motivo de os botões de passo não precisarem de tabulação."""
"component.number-input.key.page-up-page-down.name" = "Page Up / Page Down"
"component.number-input.key.page-up-page-down.action" = """Move o valor em um `big_step`, que são dez passos por padrão, para uma faixa grande poder ser atravessada."""
"component.number-input.key.home-end.name" = "Home / End"
"component.number-input.key.home-end.action" = """Vai ao `min` e ao `max`, onde eles são declarados."""
"component.slider.guidance" = """Use um slider para definir um valor em uma trilha, como um volume, um zoom ou um teto de preço. Para um número que a pessoa prefira digitar, combine com um `NumberInput`. Renderiza um `<input type="range">` real, e um `range` renderiza dois."""
"component.slider.a11y-notes" = """O componente renderiza um `<input type="range">` real, que fornece o papel, `aria-valuenow`, as setas e o arraste. `aria-valuetext` segue o `output_label`, então o valor lido carrega a unidade."""
"component.slider.prop.name.doc" = """O nome do campo no formulário, e a raiz de todos os ids aqui. Com `range` as duas alças enviam `{name}-start` e `{name}-end`, então o servidor lê dois valores separados."""
"component.slider.prop.label.doc" = """A pergunta que este slider responde. É renderizada como `<label for>` desenhado pelo `Field`, ou como `<legend>` quando `range` faz dele dois controles."""
"component.slider.prop.value.doc" = """O valor em que a alça começa. Com `range`, o valor em que a **primeira** alça começa."""
"component.slider.prop.end.doc" = """O valor em que a segunda alça começa, com `range`. Ignorado sem ele."""
"component.slider.prop.range.doc" = """Se o slider tem duas alças e a resposta é um intervalo. Renderiza dois inputs reais, então cada alça tem seu papel, seu teclado e seu valor. Nenhuma das duas pode cruzar a outra."""
"component.slider.prop.min.doc" = """O valor no início da trilha. Zero por padrão."""
"component.slider.prop.max.doc" = """O valor no fim da trilha. Cem por padrão."""
"component.slider.prop.step.doc" = """O menor movimento que a alça pode fazer. Um por padrão. `any` torna o valor contínuo."""
"component.slider.prop.marks.doc" = """Os valores em que desenhar um traço, separados por espaços, como `0 25 50 75 100`. Os traços são decoração e **não** limitam a alça. Para limitá-la, use `step`."""
"component.slider.prop.mark_labels.doc" = """Palavras exibidas sob os traços, separadas por `|` e casadas posição a posição com `marks`, como `Baixo|Alto`. Informe na língua de quem lê."""
"component.slider.prop.output.doc" = """Se o valor atual é exibido ao lado da trilha. **Ligado por padrão**, para que a pessoa leia o valor que definiu."""
"component.slider.prop.output_label.doc" = """O formato em que esse número é exibido, com um buraco `{value}`, como *{value} px*. Sem ele o número aparece sozinho, então informe sempre que o valor tiver unidade."""
"component.slider.prop.hint.doc" = """Orientação extra exibida sob o rótulo. O `Field` a desenha."""
"component.slider.prop.error.doc" = """A mensagem exibida quando a resposta está errada, depois de um envio. Leva `role="alert"`, e nada aqui escreve por cima dela."""
"component.slider.prop.required.doc" = """Se uma resposta é necessária. Um controle de faixa sempre tem um valor, então isso sobretudo marca o campo como obrigatório para a tecnologia assistiva, como faz `ColorPicker.required`."""
"component.slider.prop.required_label.doc" = """A palavra com que o `Field` marca a pergunta. Informe sempre que `required` estiver ligado."""
"component.slider.prop.disabled.doc" = """Impede que a pessoa mova a alça. Usa o atributo `disabled` real, que também mantém o valor fora do envio do formulário."""
"component.slider.prop.size.doc" = """O tamanho da trilha e da alça: `small`, `medium` ou `large`. **A alça fica em pelo menos 24 pixels em todos os tamanhos**, o alvo mínimo da WCAG 2.5.8."""
"component.slider.prop.tone.doc" = """A família de cor da parte preenchida da trilha. Nunca o único sinal, porque o número ao lado da trilha declara o valor."""
"component.slider.prop.glass.doc" = """Fosca a parte não preenchida da trilha. O preenchimento e a alça continuam sólidos, então o alvo segue visível."""
"component.slider.state.invalid.doc" = """Definido quando há um `error`. A trilha assume o tom de perigo e a mensagem aparece sob a pergunta. O número ao lado da alça continua ali."""
"component.slider.key.arrow-keys.name" = "Setas"
"component.slider.key.arrow-keys.action" = """Move a alça em um `step`. É o comportamento próprio do navegador."""
"component.slider.key.page-up-page-down.name" = "Page Up / Page Down"
"component.slider.key.page-up-page-down.action" = """Move a alça em um salto maior, que o navegador escolhe a partir da faixa. É o comportamento próprio dele."""
"component.slider.key.home-end.name" = "Home / End"
"component.slider.key.home-end.action" = """Move a alça para `min` ou `max`. É o comportamento próprio do navegador."""
"component.file-input.guidance" = """Use um campo de arquivo quando a pessoa escolhe arquivos: uma foto, um documento, uma importação. O que foi escolhido é sempre listado, por nome e tamanho, com um controle para tirar cada um. `accept` e `max_size` não são checagens de segurança."""
"component.file-input.a11y-notes" = """A área em que se solta o arquivo é o `<label>` de um input de arquivo de verdade, então é focável, acionável e anunciada. O input é recortado em vez de `display: none`, que o tiraria da árvore de acessibilidade."""
"component.file-input.prop.name.doc" = """O campo sob o qual os arquivos são enviados, e a raiz de todo id daqui. **Obrigatório**, porque um id derivado de um nome opcional é um id que toda cópia na página compartilha."""
"component.file-input.prop.label.doc" = """A pergunta, na língua de quem lê. O `Field` a desenha como um `<label for>` de verdade. Obrigatório."""
"component.file-input.prop.browse_label.doc" = """O texto do controle que abre o seletor, como *Escolher um arquivo*. **Obrigatório**, porque é o único texto desse controle."""
"component.file-input.prop.drop.doc" = """Se arquivos podem ser arrastados para a área. **Ligado por padrão, e nunca o único caminho.** A área é o `<label>` do input de verdade, então um toque, um Tab e um Enter fazem o mesmo que soltar."""
"component.file-input.prop.drop_label.doc" = """A frase ao lado do controle, como *ou solte aqui*. Informe junto com `drop`, porque um recurso que a pessoa não conhece fica sem uso."""
"component.file-input.prop.accept.doc" = """Que tipos de arquivo o seletor oferece, como `image/*` ou `.pdf,.docx`. O atributo de verdade, então o próprio diálogo de arquivos filtra antes da escolha. **Não é controle de segurança**: roda numa página que a pessoa controla."""
"component.file-input.prop.accept_label.doc" = """O que o componente diz quando um arquivo solto não é um desses, com um buraco `{name}`. Informe junto com `accept`, porque soltar um arquivo sem efeito não diz o motivo."""
"component.file-input.prop.multiple.doc" = """Se mais de um arquivo pode ser escolhido. O atributo de verdade, então o próprio diálogo de arquivos permite. Desligado, uma segunda escolha **substitui** a primeira em vez de se somar a ela."""
"component.file-input.prop.max.doc" = """Quantos arquivos são permitidos, junto com `multiple`. No limite os demais são recusados e o componente diz por quê, em vez de descartá-los em silêncio."""
"component.file-input.prop.max_label.doc" = """O que o componente diz nesse limite, com um buraco `{max}`."""
"component.file-input.prop.max_size.doc" = """O maior tamanho que um arquivo pode ter, em bytes. Checado aqui para poupar um envio que ia falhar, **e nunca no lugar do servidor**, que é onde a checagem vale."""
"component.file-input.prop.max_size_label.doc" = """O que o componente diz quando um arquivo é grande demais, com buracos `{name}` e `{size}`. Informe junto com `max_size`, porque um arquivo que some ao ser escolhido não dá motivo."""
"component.file-input.prop.remove_label.doc" = """O nome do controle de remover de cada arquivo listado, com um buraco `{name}`. A pessoa ouve *Remover relatorio.pdf* em vez de *Remover* seis vezes."""
"component.file-input.prop.empty_label.doc" = """O que a lista diz quando nada foi escolhido, como *Nenhum arquivo escolhido*. Sem isso o espaço onde a lista vai aparecer fica em silêncio."""
"component.file-input.prop.status.doc" = """Quantos arquivos existem, com um buraco `{count}`. Uma frase inteira com um buraco só. Ela pode carregar uma forma por categoria de plural, que é o que mantém *1 arquivos* fora da tela."""
"component.file-input.prop.added_label.doc" = """O que é anunciado quando arquivos chegam, com um buraco `{count}`. Soltar um arquivo não move o foco e não muda nada que o tenha, então sem esta frase soltar seis arquivos é mudo."""
"component.file-input.prop.removed_label.doc" = """O que é anunciado quando um arquivo é tirado. O controle que fez isso acabou de sair da página e o foco teve de se mover, então esta é a frase que reporta."""
"component.file-input.prop.hint.doc" = """O que a pessoa precisa saber antes de escolher, como quais formatos e qual tamanho. Desenhada pelo `Field`."""
"component.file-input.prop.error.doc" = """O que está errado, depois de um envio. A frase de quem chama, com `role="alert"`."""
"component.file-input.prop.required.doc" = """Se um arquivo é necessário. O atributo de verdade no input de verdade, então o navegador recusa o envio sem script nenhum."""
"component.file-input.prop.required_label.doc" = """A palavra com que o `Field` marca a pergunta. Informe junto com `required`."""
"component.file-input.prop.disabled.doc" = """Impede a escolha de arquivos. Recusa o controle, a área e cada controle de remover, e não envia nada."""
"component.file-input.prop.size.doc" = """O tamanho da área e da lista: `small`, `medium` ou `large`. `medium` por padrão, acompanhando o resto do formulário."""
"component.file-input.prop.glass.doc" = """Fosca a área. A lista de arquivos continua opaca, porque os nomes dos arquivos são o que a pessoa veio ler."""
"component.file-input.state.invalid.doc" = """Marcado quando um `error` foi informado, ou um arquivo foi recusado pelo tipo, pelo tamanho ou pela contagem. A área assume o tom de perigo e a frase da recusa aparece, nunca só a cor."""
"component.file-input.state.dragging.doc" = """Se um arquivo está sobre a área. A borda e o fundo mudam para a pessoa ver onde o arquivo vai cair. É limpo ao sair, e não só ao soltar."""
"component.file-input.key.enter-or-space.name" = "Enter ou Espaço"
"component.file-input.key.enter-or-space.action" = """Abre o seletor de arquivos a partir da área. Comportamento do próprio navegador, porque a área é um `<label>`."""
"component.file-input.key.delete-or-backspace.name" = "Delete ou Backspace"
"component.file-input.key.delete-or-backspace.action" = """Remove o arquivo cujo controle de remover está com o foco."""
"component.time-input.guidance" = """Use um campo de hora para pedir uma hora do dia, em caixas rotuladas separadas para a hora, o minuto e às vezes o segundo. `clock` segue o locale de quem lê. O formulário envia um valor de vinte e quatro horas."""
"component.time-input.a11y-notes" = """É um `<fieldset>` com um `<legend>`, e cada caixa tem o próprio nome, porque um `<label>` aponta para um elemento. As mensagens são as frases de quem chama numa região dinâmica só, e não as três bolhas da plataforma."""
"component.time-input.prop.name.doc" = """O nome do campo e a raiz de todo id dentro dele. As caixas enviam `{name}-hour`, `{name}-minute` e, com `seconds`, `{name}-second`. **Obrigatório**."""
"component.time-input.prop.legend.doc" = """A pergunta, na língua de quem lê, desenhada pelo `Field` como um `<legend>` de verdade. **Obrigatório**, porque um fieldset sem legenda dá ao leitor de tela um grupo sem nome."""
"component.time-input.prop.hour_label.doc" = """O nome da primeira caixa, na língua de quem lê. **Obrigatório**, porque o `<legend>` nomeia o grupo e não cada caixa, e três caixas numeradas precisam de três nomes."""
"component.time-input.prop.minute_label.doc" = """O nome da segunda caixa, na língua de quem lê. **Obrigatório**, pelo mesmo motivo."""
"component.time-input.prop.second_label.doc" = """O nome da terceira caixa, na língua de quem lê. Desejado na prática por `seconds`."""
"component.time-input.prop.meridiem_label.doc" = """O nome do controle de manhã e tarde, onde o locale de quem lê tem um. Desejado na prática por `clock = "auto"` ou `"12"`, porque o controle aparece só para algumas pessoas."""
"component.time-input.prop.am_label.doc" = """A palavra para antes do meio-dia na língua de quem lê, como *AM* ou *Manhã*. Não derivada, porque o formatador da plataforma a escreve de um jeito em cada locale."""
"component.time-input.prop.pm_label.doc" = """A palavra para depois do meio-dia, nos mesmos termos."""
"component.time-input.prop.value.doc" = """A hora inicial, como `HH:MM` ou `HH:MM:SS` num relógio de vinte e quatro horas. É o formato que o servidor manda e o formato que ele recebe de volta, seja qual for o relógio mostrado."""
"component.time-input.prop.seconds.doc" = """Se uma terceira caixa pede segundos. Desligado por padrão, porque poucas das coisas que as pessoas agendam acontecem num segundo nomeado."""
"component.time-input.prop.clock.doc" = """Em qual relógio as caixas são lidas. `auto` pergunta ao idioma de quem lê. `12` e `24` servem a uma página cujo assunto tem relógio próprio, como uma escala de voos. **O que é enviado é de vinte e quatro horas.**"""
"component.time-input.prop.min.doc" = """A hora mais cedo permitida, como `HH:MM`. Uma hora antes dela é recusada com `min_label` em vez de reescrita, então os números de quem lê permanecem."""
"component.time-input.prop.max.doc" = """A hora mais tarde permitida, nos mesmos termos. Pode ser **antes** de `min`, que é como se declara uma janela que cruza a meia-noite."""
"component.time-input.prop.step.doc" = """Quantos minutos uma tecla de seta move a caixa de minutos. Um por padrão. Um formulário de reserva costuma querer quinze, então quem lê chega a `:45` em três toques."""
"component.time-input.prop.now_label.doc" = """O nome de um controle que preenche as caixas com a hora atual. Ausente, esse controle não existe."""
"component.time-input.prop.required_label.doc" = """O que ele diz quando as caixas estão vazias e uma resposta era necessária. A plataforma não consegue dizer, porque `required` em três caixas recusa cada uma separadamente."""
"component.time-input.prop.missing_label.doc" = """O que ele diz quando algumas caixas estão preenchidas e outras não, com um buraco `{part}` nomeando a vazia. Meia hora é o jeito mais comum de este campo dar errado."""
"component.time-input.prop.invalid_label.doc" = """O que ele diz quando os números não são uma hora, como vinte e cinco horas. Tem um buraco `{value}`, e os números ficam exatamente como foram digitados."""
"component.time-input.prop.min_label.doc" = """O que ele diz antes de `min`, com um buraco `{min}`."""
"component.time-input.prop.max_label.doc" = """O que ele diz depois de `max`, com um buraco `{max}`."""
"component.time-input.prop.hint.doc" = """O que a pessoa precisa saber antes de responder, como *Por exemplo, 09 30*. Desenhado por `Field` e carregado no `aria-describedby` do fieldset, então é lido junto com o grupo."""
"component.time-input.prop.error.doc" = """O que está errado, depois de um envio. A frase de quem chama, com `role="alert"`."""
"component.time-input.prop.required.doc" = """Se uma resposta é necessária. Vai em todas as caixas, e a frase que quem lê recebe ao deixar uma vazia é `missing_label` e não a da plataforma."""
"component.time-input.prop.disabled.doc" = """Impede que a pessoa mude qualquer caixa. Usa o atributo `disabled` real, que também mantém o valor fora do envio do formulário."""
"component.time-input.prop.pad.doc" = """Se um dígito só é mostrado como `09` quando a caixa perde o foco. **Ligado por padrão**, para que uma coluna de horas tenha dois dígitos em toda parte. Nunca completa com foco, onde o zero seria um caractere a apagar."""
"component.time-input.prop.size.doc" = """O tamanho das caixas, combinando com o resto do formulário."""
"component.time-input.prop.glass.doc" = """Se as caixas ficam foscas, sobre um fundo opaco o bastante para ler dois dígitos."""
"component.time-input.state.invalid.doc" = """Marcado quando uma das mensagens acima se aplica. Todas as caixas tomam o tom de perigo em vez de só a caixa culpada, porque a resposta errada é a hora."""
"component.time-input.state.resolved.doc" = """Marcado quando o script refez as caixas para o relógio de quem lê. Fica no fieldset, para que um teste distinga uma linha de vinte e quatro horas servida de uma escolhida."""
"component.time-input.key.up-arrow-down-arrow.name" = "Seta para cima / Seta para baixo"
"component.time-input.key.up-arrow-down-arrow.action" = """Move a caixa em foco em uma hora, um `step` de minutos ou um segundo, e dá a volta nas pontas."""
