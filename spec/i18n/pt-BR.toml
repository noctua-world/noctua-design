"components.contract.body" = "Um componente é quatro coisas que mudam juntas: sua especificação, sua implementação em Dioxus, sua implementação em React, e os casos de comportamento contra os quais as duas são executadas. Três das quatro são geradas a partir da primeira, então as duas implementações não podem declarar props diferentes."
