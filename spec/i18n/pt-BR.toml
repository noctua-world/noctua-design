# --- Divider, Label, Image e MessageBar --------------------------------------
#
# Os quatro componentes acrescentados por último: o resumo de cada um, o
# contrato inteiro traduzido, e tudo o que os exemplos deles desenham.

"component.divider.summary" = """Separe dois blocos com nome usando uma linha, e dê nome ao limite quando ele precisar de um."""
"component.label.summary" = """Nomeie um controle, um grupo de controles ou uma região, na língua de quem lê."""
"component.image.summary" = """Mostre uma figura numa caixa reservada antes de ela chegar, com legenda onde for preciso."""
"component.message-bar.summary" = """Conte à pessoa o que aconteceu, numa barra que fica onde a coisa aconteceu."""

"component.divider.guidance" = """Use um divisor entre dois blocos que têm nome, onde a linha desenha o limite que o nome afirma. Entre irmãos do mesmo tipo, dê mais espaço a eles: uma linha sem explicação entre blocos iguais não marca nada."""
"component.divider.a11y-notes" = """O conteúdo de um separador é apresentacional, então a palavra dentro de um divisor rotulado não chega sozinha ao leitor de tela. Essa palavra é escrita de novo como `aria-label`, e o `aria-orientation` carrega a direção."""
"component.divider.prop.orientation.doc" = """Para que lado a linha corre. `horizontal` separa um bloco do próximo, descendo a página. `vertical` separa duas coisas que dividem uma linha, como dois grupos dentro de um `Toolbar`."""
"component.divider.prop.label.doc" = """Uma palavra sobre a linha, como *ou*. A presença dela muda o elemento: um `<hr>` não guarda conteúdo, então um divisor rotulado é um `<div role="separator">` com a palavra dentro."""
"component.divider.prop.spacing.doc" = """Quanto espaço a linha ocupa em volta de si, vindo da escala de espaçamento. Use `none` onde os blocos já têm o próprio espaço, e `loose` entre as regiões maiores de uma página."""
"component.divider.prop.weight.doc" = """A espessura da linha. `hairline` é a borda que toda outra aresta deste sistema usa. `rule` é o traço largo que um `Field` desenha na borda de uma resposta recusada."""
"component.divider.prop.decorative.doc" = """Tira a linha da árvore de acessibilidade, para um traço que é decoração e não um limite. Ela escreve `aria-hidden` e papel nenhum. Com um `label` ela esconde a palavra também, então os dois combinam mal."""
"component.divider.state.labelled.doc" = """Definido quando um `label` foi dado, no `<div>` que entra no lugar do `<hr>`. A folha de estilo pendura nele as duas meias-linhas e o espaço em volta da palavra."""

"component.label.guidance" = """Use um rótulo para o nome visível de um controle, de um grupo de controles ou de uma região. O `Field` já desenha um para o controle que ele envolve. Use este onde não há campo, ao lado de um `Segmented` ou sobre um `Toolbar`."""
"component.label.a11y-notes" = """Um `<label for>` nomeia um controle rotulável, e um `<legend>` nomeia o `<fieldset>` que ele abre. Um `<p>` nomeia qualquer outra coisa por referência, então o grupo carrega `aria-labelledby` apontando para este id."""
"component.label.prop.text.doc" = """O nome, na língua de quem lê. **Obrigatório**, porque um rótulo sem palavras não nomeia nada. Nomeie o que está sendo perguntado, e não o ato de perguntar."""
"component.label.prop.for_control.doc" = """O id do que isto nomeia. Com `kind = "label"` ele vira um `for` de verdade, a única ligação que o navegador executa. O rótulo assume `{for_control}-label` como id próprio, para um grupo apontar."""
"component.label.prop.kind.doc" = """Qual elemento nomeia. `label` nomeia um controle rotulável pelo `for`. `legend` nomeia o `<fieldset>` que ele abre. `name` renderiza um `<p>` para um grupo que não é nenhum dos dois, como um `role="radiogroup"`."""
"component.label.prop.size.doc" = """A escala tipográfica do nome: `small`, `medium` ou `large`. Combine com o controle que ele nomeia, para uma caixa grande não ser respondida por uma pergunta pequena."""
"component.label.prop.required.doc" = """Se o que isto nomeia é marcado como uma resposta que precisa ser dada. **A marca é tudo o que isto faz.** O atributo `required` de verdade fica no controle de verdade, porque só ele impede o envio."""
"component.label.prop.required_label.doc" = """A palavra que marca, na língua de quem lê, como *obrigatório*. Necessária na prática pelo `required`. Uma palavra em vez de um asterisco, que não chega a quem não enxerga."""
"component.label.prop.optional_label.doc" = """A palavra para uma pergunta que pode ficar em branco, como *opcional*. Escrita apenas enquanto `required` está desligado, porque uma pergunta é uma coisa ou a outra. Marque a mais rara das duas."""

"component.image.guidance" = """Use uma imagem para uma figura que faz parte do conteúdo, junto com as palavras que ficam no lugar dela. Dê um `ratio` a ela, para a caixa ficar reservada antes de os bytes chegarem. Para o retrato de uma pessoa, use `Avatar`."""
"component.image.a11y-notes" = """A figura carrega um `alt` de verdade, sempre, e um `alt` vazio é uma decisão e não um esquecimento. Uma imagem com legenda é um `<figure>` com um `<figcaption>`, então a linha embaixo fica presa a ela."""
"component.image.prop.src.doc" = """Onde a figura está. **Obrigatório**, porque uma imagem sem origem é uma caixa que nunca enche. A caixa vem do `ratio` e não do arquivo, então nada se move quando ele chega."""
"component.image.prop.alt.doc" = """As palavras que ficam no lugar da figura. **Obrigatório**, e uma string vazia é uma resposta de verdade. Ela diz que a figura repete o que está ao lado, então o leitor de tela passa por ela."""
"component.image.prop.ratio.doc" = """O formato da caixa, mantido antes de a figura chegar. Ausente, deixa o arquivo decidir, e o arquivo chega depois do layout. Tudo abaixo da figura então se move, o que este sistema proíbe."""
"component.image.prop.fit.doc" = """Como a figura preenche uma caixa de outro formato. `cover` corta até as bordas, e `contain` cabe inteira com espaço sobrando. Use `contain` onde as bordas carregam significado."""
"component.image.prop.loading.doc" = """Quando o navegador busca o arquivo. `lazy` espera até a figura chegar perto da janela. Use `eager` para a primeira figura que a pessoa vê, onde esperar custa mais do que os bytes."""
"component.image.prop.caption.doc" = """Uma linha embaixo da figura, na língua de quem lê. A presença dela muda o elemento: uma imagem com legenda é um `<figure>` com um `<figcaption>`, que é o que prende as palavras à figura."""
"component.image.prop.rounded.doc" = """Se os cantos são arredondados, a partir do raio de superfície. Desligado por padrão, porque o quadrado é a base deste sistema e o arredondado é a exceção (`NOCTUA.md §9.7`)."""
"component.image.prop.width.doc" = """A largura própria da figura, em pixels, como o arquivo a tem. Escrita junto com `height`, ela entrega a proporção ao navegador antes de qualquer folha de estilo. É a resposta da própria plataforma a uma página que se mexe."""
"component.image.prop.height.doc" = """A altura própria da figura, em pixels. É a outra metade do `width` e não faz nada sozinha. O tamanho com que a caixa é desenhada continua sendo assunto da folha de estilo."""

"component.message-bar.guidance" = """Use uma barra de mensagem para algo que aconteceu, mostrada no lugar e deixada na página. Para um campo recusado, use `Field`. Para tudo o que está errado num formulário de uma vez, use `ErrorSummary`."""
"component.message-bar.a11y-notes" = """A barra é um `role="status"` até `alert` ser ligado, e um status espera uma pausa em vez de cortar a fala. O ícone é `aria-hidden`, e o tom nunca é o único sinal."""
"component.message-bar.prop.tone.doc" = """De qual tom do sistema de cores a barra é pintada. Os tons ficam em `noctua_design::tones`. **Nunca o único sinal** (`NOCTUA.md §8.8.6`): as palavras e o ícone carregam o significado."""
"component.message-bar.prop.title.doc" = """Uma linha curta acima da mensagem, como *Pagamento recusado*. Ausente é o caso comum, porque uma frase não precisa de título. É um `<strong>` e não um título, então não entra na estrutura da página."""
"component.message-bar.prop.icon.doc" = """Um desenho antes das palavras, nomeado a partir de `spec/icons.toml`. Ele carrega `aria-hidden`, porque diz o que as palavras dizem. Escolha um que signifique o que o tom significa, para a cor nunca ficar sozinha."""
"component.message-bar.prop.alert.doc" = """Se a barra interrompe. Desligado por padrão, e desligado quase sempre está certo: `role="alert"` corta a fala do leitor de tela. Ligue onde a pessoa precisa agir antes de seguir."""
"component.message-bar.prop.live.doc" = """Como a barra é anunciada quando chega depois de a página ter carregado. Ausente deixa o papel decidir, o que está certo quase sempre. Use `off` para uma barra que já veio com a página."""
"component.message-bar.prop.dismissible.doc" = """Se a pessoa pode tirar a barra dali. Desligado por padrão, porque uma barra que relata o estado de algo não pode ser removível enquanto esse estado durar."""
"component.message-bar.prop.dismiss_label.doc" = """O nome do controle que tira a barra dali, como *Dispensar esta mensagem*. Necessário na prática pelo `dismissible`, porque esse controle é um glifo e este é o único nome que ele tem."""
"component.message-bar.prop.children.doc" = """A mensagem, em uma ou duas frases. Ela pode conter um `Link` para o que a pessoa precisa fazer a respeito."""
"component.message-bar.state.dismissed.doc" = """Definido numa barra que a pessoa tirou dali. A folha de estilo a tira do layout a partir daí, então o elemento continua no documento e a região viva dele segue funcionando."""
"component.message-bar.key.enter-or-space.name" = "Enter ou Espaço"
"component.message-bar.key.enter-or-space.action" = """Tira a barra dali, no controle que a dispensa. As duas teclas funcionam, porque esse controle é um `<button>`."""

"example.divider.appearance" = "Aparência"
"example.divider.appearance-body" = "O modo, a cor de destaque e os cantos da página."
"example.divider.motion" = "Movimento"
