# --- Icon, Rating, OtpField e as três que formam uma tira de abas -------------
#
# Seis componentes acrescentados numa passada: o resumo de cada um, o contrato
# inteiro traduzido, e tudo o que os exemplos deles desenham.

"component.icon.summary" = """Desenhe um dos ícones declarados, no tamanho do texto ao lado do qual ele fica."""
"component.rating.summary" = """Mostre ou peça uma nota numa escala de cinco, com o número escrito ao lado."""
"component.otp-field.summary" = """Peça um código curto, numa fila de caixas que enchem e avançam conforme se digita."""
"component.tabs.summary" = """Mostre um painel por vez entre vários, a partir de uma tira em que a pessoa escolhe."""
"component.tab.summary" = """Nomeie um painel numa tira de abas, e mostre esse painel quando a pessoa escolher."""
"component.tab-panel.summary" = """Guarde o conteúdo que uma aba nomeia, e mostre-o quando essa aba for escolhida."""
"component.dialog.summary" = """Peça uma coisa numa janela sobre a página, e devolva o foco depois."""
"component.popover.summary" = """Pendure uma superfície pequena num controle, com texto sobre o qual a pessoa pode agir."""
"component.tooltip.summary" = """Explique um controle com uma dica curta, mostrada ao passar o ponteiro e ao focar."""
"component.toast.summary" = """Relate o que acabou de acontecer numa mensagem curta que flutua sem cobrir o trabalho."""

"component.icon.guidance" = """Use um ícone ao lado de uma palavra, onde o desenho repete o que a palavra diz. Sozinho ele precisa de um `label`. Um controle que é só um desenho é `Button { hide_label }` e não um ícone clicável."""
"component.icon.a11y-notes" = """Um ícone sem rótulo é `aria-hidden` e `focusable="false"`, então não chega a leitor de tela nenhum nem à ordem de tabulação. Um `label` o torna um `role="img"` com esse nome, e os dois estados se excluem."""
"component.icon.prop.icon.doc" = """Qual desenho, pelo nome que o `spec/icons.toml` dá a ele. **Obrigatório**, e um tipo de verdade nas duas linguagens em vez de uma string. Um nome que não é um ícone vira então erro de compilação e não uma caixa vazia na página."""
"component.icon.prop.label.doc" = """O nome acessível dele. Ausente é o caso comum e deixa o ícone `aria-hidden`, o que está certo ao lado de uma palavra que já diz aquilo. Dê um só onde o desenho carrega a mensagem inteira."""
"component.icon.prop.size.doc" = """A caixa desenhada, como um degrau da escala tipográfica: o degrau pequeno, o de corpo e o de h3. O desenho em si é `1em`, então um ícone sem tamanho assume o tamanho do texto em volta."""

"component.rating.guidance" = """Use uma nota para uma pontuação numa escala pequena de números inteiros. `readonly` mostra uma que já foi dada, como uma frase com estrelas ao lado. Sem ele, o controle é um grupo de rádios de verdade que envia sem script."""
"component.rating.a11y-notes" = """As estrelas são `aria-hidden`, porque a frase ao lado diz o que elas desenham. A forma interativa são rádios de verdade dentro de um `<fieldset>`, então o grupo, as setas e o anúncio são da própria plataforma."""
"component.rating.prop.name.doc" = """O que está sendo pontuado, na marcação, e a raiz de todo id daqui. É também o campo sob o qual cada opção é enviada. **Obrigatório**, porque um id vindo de um nome opcional é um id que toda nota da página divide."""
"component.rating.prop.label.doc" = """De que é a pontuação, na língua de quem lê, como *Como foi a entrega*. **Obrigatório**. É o `<legend>` da forma interativa e as palavras antes das estrelas na forma de leitura."""
"component.rating.prop.value.doc" = """A pontuação. Inteira na forma interativa, onde ela nomeia a opção que já vem marcada. Fracionária é permitida na forma de leitura e é desenhada recortando a fila cheia, sem arredondar."""
"component.rating.prop.max.doc" = """Quantos degraus existem. Cinco por padrão, que é o que se espera de uma fila de estrelas. Mantenha pequeno: cada degrau é uma opção, e uma fila de dez não se escolhe de relance."""
"component.rating.prop.readonly.doc" = """Se isto é uma leitura em vez de uma pergunta. Ligado, desenha uma frase com estrelas ao lado e controle de formulário nenhum. Desligado, é um `<fieldset>` de rádios de verdade que envia sem script."""
"component.rating.prop.value_label.doc" = """A frase ao lado das estrelas, com buracos `{value}` e `{max}`, como *{value} de {max}*. **Sem ela a pessoa tem que estimar a partir de uma forma.** Uma frase com buracos, nunca palavras emendadas."""
"component.rating.prop.item_label.doc" = """O nome de uma opção, com os mesmos dois buracos, como *Dar {value} de {max}*. Necessário na prática pela forma interativa: uma estrela é um desenho, então este é o único nome que cada rádio tem."""
"component.rating.prop.size.doc" = """Quão grande uma estrela é desenhada. Na forma interativa a estrela também é o alvo, então os três passam do mínimo de 24px da WCAG 2.5.8 e `large` também atinge o alvo ampliado de 44px."""
"component.rating.prop.tone.doc" = """De qual tom do sistema de cores as estrelas cheias são pintadas. Os tons ficam em `noctua_design::tones`. **Nunca o único sinal** (`NOCTUA.md §8.8.6`): o número ao lado carrega a leitura."""
"component.rating.prop.hint.doc" = """Uma frase abaixo da pergunta, desenhada pelo `Field`, como o que o topo da escala significa. Ela pertence à forma interativa, porque uma leitura não responde pergunta nenhuma."""
"component.rating.prop.error.doc" = """O que está errado na resposta, na língua de quem lê, desenhado pelo `Field`. A presença dela também marca cada opção como inválida."""
"component.rating.prop.required.doc" = """Se uma pontuação precisa ser dada. Escreve o `required` da própria plataforma em cada opção, então um grupo sem nada escolhido é recusado sem script."""
"component.rating.prop.required_label.doc" = """A palavra que marca a pergunta como uma que precisa de resposta, como *obrigatório*. Necessária na prática pelo `required`, e desenhada pelo `Field` ao lado da legenda."""
"component.rating.prop.disabled.doc" = """Se as opções recusam ser escolhidas. Alcança cada rádio e o `<fieldset>` em volta deles, então nada lá dentro é alcançável nem enviado."""
"component.rating.state.level.doc" = """Quanto da fila está cheio, em porcentagem, na cópia recortada das estrelas. É lido de `value` e `max` na renderização, então uma fração é desenhada em vez de arredondada."""
"component.rating.key.tab.name" = "Tab"
"component.rating.key.tab.action" = """Entra no grupo uma vez, na opção escolhida, em vez de parar em cada estrela. É o comportamento do próprio navegador."""
"component.rating.key.arrow-keys.name" = "Setas"
"component.rating.key.arrow-keys.action" = """Vai para a opção seguinte ou anterior e a escolhe. Também é do próprio navegador, então este componente não traz script."""
"component.rating.key.space.name" = "Espaço"
"component.rating.key.space.action" = """Escolhe a opção em foco, para quem chegou com Tab e não encontrou nada escolhido ainda."""

"component.otp-field.guidance" = """Use um campo de código para um código curto que a pessoa copia de outro lugar, como os seis dígitos de uma mensagem. Para algo que ela redige, use `Input`. As caixas são um retrato do código, nunca uma forma obrigatória."""
"component.otp-field.a11y-notes" = """`Field { kind = "group" }` é o `<fieldset>`, então a dica e o erro são ouvidos uma vez na entrada, não por caixa. Cada caixa carrega o próprio `<label>`, escondido da tela e guardado para o leitor de tela."""
"component.otp-field.prop.name.doc" = """O nome do campo e a raiz de todo id dele. **Cada caixa é enviada sob ele**, então o código chega como `length` valores em ordem. **Obrigatório**, porque um id vindo de um nome opcional é um id que todo campo da página divide."""
"component.otp-field.prop.legend.doc" = """A pergunta, na língua de quem lê, desenhada pelo `Field` como um `<legend>` de verdade. **Obrigatório**, porque um fieldset sem legenda dá ao leitor de tela um grupo sem nome."""
"component.otp-field.prop.box_label.doc" = """O nome de uma caixa, com buracos `{index}` e `{length}`, como *Dígito {index} de {length}*. **Obrigatório**, porque a legenda nomeia o grupo e cada caixa é um controle próprio. Uma frase com buracos, nunca palavras emendadas."""
"component.otp-field.prop.length.doc" = """Quantas caixas existem. Seis por padrão, que é o tamanho da maioria dos códigos. Combine com quem enviou o código: uma fila menor perde caracteres, e uma maior pede algo que nunca foi enviado."""
"component.otp-field.prop.kind.doc" = """O que uma caixa aceita. `numeric` pede ao telefone o teclado numérico e descarta o resto conforme se digita. `alphanumeric` aceita letras também, e as caixas ficam mais largas para elas."""
"component.otp-field.prop.value.doc" = """O código com que começar, como uma string só. Ele é dividido entre as caixas na renderização, então um código que o servidor já tem chega preenchido em vez de vazio."""
"component.otp-field.prop.autocomplete.doc" = """Se a plataforma pode oferecer um código que acabou de ver. Ligado por padrão, e escreve `autocomplete="one-time-code"` **só na primeira caixa**. Repetido em todas, a plataforma oferece o código inteiro a cada uma."""
"component.otp-field.prop.hint.doc" = """Uma frase abaixo da pergunta, desenhada pelo `Field`, como para onde o código foi enviado. Ela nomeia o lugar e não o endereço, então nada privado é desenhado na tela."""
"component.otp-field.prop.error.doc" = """O que está errado no código, na língua de quem lê, desenhado pelo `Field`. A presença dele marca cada caixa como inválida, porque o código é um valor só."""
"component.otp-field.prop.invalid_label.doc" = """A frase para um código curto ou que traz algo que as caixas não aceitam. Ela é dita ao sair do campo e não entre duas caixas, porque uma resposta inacabada não é uma resposta errada."""
"component.otp-field.prop.required.doc" = """Se um código precisa ser dado. Alcança cada caixa, então um formulário com a fila vazia é recusado pelo próprio navegador sem script nenhum."""
"component.otp-field.prop.required_label.doc" = """A palavra que marca a pergunta como uma que precisa de resposta, como *obrigatório*. Necessária na prática pelo `required`, e desenhada pelo `Field` ao lado da legenda."""
"component.otp-field.prop.size.doc" = """Quão grande é uma caixa. Os três passam do mínimo de 24px da WCAG 2.5.8, e `large` também atinge o alvo ampliado de 44px."""
"component.otp-field.prop.disabled.doc" = """Se as caixas recusam ser digitadas. Alcança cada caixa e o `<fieldset>` em volta delas, então nada lá dentro é alcançável nem enviado."""
"component.otp-field.state.invalid.doc" = """Definido numa fila que o script recusou, e numa em que quem chama passou um `error`. A folha de estilo marca cada caixa a partir dele, porque um código é um valor só e metade dele não erra sozinha."""
"component.otp-field.key.a-character.name" = "Um caractere"
"component.otp-field.key.a-character.action" = """Preenche a caixa e vai para a seguinte. Uma caixa já cheia é substituída, então quem corrige um dígito digita por cima."""
"component.otp-field.key.backspace.name" = "Backspace"
"component.otp-field.key.backspace.action" = """Limpa a caixa. Numa que já está vazia, volta para a caixa anterior, que é o gesto que toda pessoa tenta."""
"component.otp-field.key.left-arrow-right-arrow.name" = "Seta para a esquerda / Seta para a direita"
"component.otp-field.key.left-arrow-right-arrow.action" = """Anda entre as caixas sem mudar nada, para a pessoa alcançar o dígito que quer corrigir."""
"component.otp-field.key.home-end.name" = "Home / End"
"component.otp-field.key.home-end.action" = """Vai para a primeira e a última caixa."""
"component.otp-field.key.paste.name" = "Colar"
"component.otp-field.key.paste.action" = """Divide o código inteiro entre as caixas, onde o cursor estiver. O que as caixas recusam é descartado sem aviso."""

"component.tabs.guidance" = """Use abas onde uma região da página mostra um painel por vez entre vários. Para escolher um **valor** em vez de revelar um painel, use `Segmented`. Sem script, todo painel aparece e as abas são links que descem até eles."""
"component.tabs.a11y-notes" = """Sem script isto é uma lista de links para painéis que estão todos visíveis, e não afirma papel nenhum. O script escreve `role="tablist"`, `role="tab"` e `role="tabpanel"`, e a tira vira uma parada de tabulação só."""
"component.tabs.prop.name.doc" = """De que é este conjunto de painéis, como um script o encontra, e a raiz de todo id dele. Cada `Tab` e `TabPanel` repete a mesma palavra. **Obrigatório**, porque um id vindo de um nome opcional é um id que todo conjunto da página divide."""
"component.tabs.prop.label.doc" = """O nome acessível da tira, como *Seções deste relatório*. Necessário a menos que `labelledby` a nomeie, porque uma lista de abas sem nome dá ao leitor de tela apenas o papel dela."""
"component.tabs.prop.labelledby.doc" = """O id do elemento que nomeia esta tira, quando o nome já está visível na página. Prefira-o ao `label` nesse caso, porque um nome escrito duas vezes pode se afastar de si mesmo."""
"component.tabs.prop.activation.doc" = """Se uma seta também escolhe. `automatic` mostra o painel para onde a pessoa se move, o que serve a painéis já carregados. `manual` move só o foco e espera Espaço ou Enter, o que serve a painéis que custam algo."""
"component.tabs.prop.orientation.doc" = """Para que lado a tira corre, e portanto quais setas andam por ela. É escrito em `aria-orientation`, então a tecnologia assistiva também relata o eixo, além de a folha de estilo o desenhar."""
"component.tabs.prop.appearance.doc" = """Como a aba escolhida é marcada. `underline` desenha um traço embaixo dela e um fio embaixo da tira inteira. `enclosed` dá a cada aba a própria caixa, o que sobrevive a uma tira que quebra em duas linhas."""
"component.tabs.prop.size.doc" = """O tamanho de uma aba. Os três passam do mínimo de 24px da WCAG 2.5.8, e `large` também atinge o alvo ampliado de 44px."""
"component.tabs.prop.fill.doc" = """`hug` deixa cada aba do tamanho do rótulo dela. `equal` dá a toda aba a largura da mais larga, então a tira não se refaz quando uma palavra é traduzida. `stretch` faz isso e toma o contêiner inteiro."""
"component.tabs.prop.children.doc" = """As `Tab`s. Os painéis são `TabPanel`s **depois** deste elemento e não dentro dele, porque uma lista de abas guarda abas e mais nada."""
"component.tabs.key.tab.name" = "Tab"
"component.tabs.key.tab.action" = """Entra na tira uma vez, na aba escolhida, em vez de parar em cada uma. Apertar de novo sai da tira para o painel."""
"component.tabs.key.arrow-keys.name" = "Setas"
"component.tabs.key.arrow-keys.action" = """Anda pela tira, e com `automatic` mostra o painel. Esquerda e direita quando horizontal, cima e baixo quando vertical."""
"component.tabs.key.home-end.name" = "Home / End"
"component.tabs.key.home-end.action" = """Vai para a primeira e a última aba, nos mesmos termos de uma seta."""
"component.tabs.key.space-or-enter.name" = "Espaço ou Enter"
"component.tabs.key.space-or-enter.action" = """Mostra o painel da aba em foco. É o único jeito de escolher uma sob `manual`, e funciona sob `automatic` também."""

"component.tab.guidance" = """Use uma `Tab` para cada `TabPanel`, dentro da tira `Tabs`, com o mesmo `name` e o mesmo `value` do painel que ela mostra. Os dois ids vêm dessas duas palavras, então não há nada para ligar nem para digitar."""
"component.tab.a11y-notes" = """Ela não afirma papel nenhum até o script lhe dar um, e até lá é um link para um painel que já está na página. O `count` fica dentro da aba e não ao lado, então é lido como parte do nome."""
"component.tab.prop.name.doc" = """O `Tabs` a que isto pertence. **Obrigatório**, e precisa bater com o `name` da própria tira. O id desta aba e o do painel apontado vêm dele, então outra palavra não aponta para nada."""
"component.tab.prop.value.doc" = """Qual painel isto nomeia, batendo com o `TabPanel` de mesmo `value`. **Obrigatório**, e único dentro de uma tira, porque ele é metade dos dois ids."""
"component.tab.prop.label.doc" = """As palavras na aba, na língua de quem lê. **Obrigatório**, porque uma aba é um nome para um painel e uma aba sem nome não nomeia nada."""
"component.tab.prop.icon.doc" = """Um desenho antes das palavras, nomeado a partir de `spec/icons.toml`. Ele carrega `aria-hidden`, porque o rótulo ao lado já diz o que o painel guarda."""
"component.tab.prop.count.doc" = """Um número depois das palavras, como quantas linhas o painel guarda. Ele faz parte do nome acessível da aba, então quem não enxerga também fica sabendo."""
"component.tab.prop.selected.doc" = """Se este é o painel mostrado primeiro. Exatamente uma aba da tira carrega isso, e uma tira sem nenhuma abre na primeira aba. **Não** é `aria-selected`: esse atributo chega com o papel, e o papel chega com o script."""
"component.tab.prop.disabled.doc" = """Se o painel recusa ser mostrado. `aria-disabled` em vez de tirar a aba, para ela manter o lugar e o nome. Uma aba que não se encontra é um painel que se conclui não existir."""

"component.tab-panel.guidance" = """Use um `TabPanel` para cada `Tab`, depois da tira `Tabs` e não dentro dela, com o mesmo `name` e `value`. Sem script todo painel aparece, o que é o que faz a tira acima deles virar um sumário."""
"component.tab-panel.a11y-notes" = """Ele não afirma papel nenhum até o script lhe dar um, e carrega `aria-labelledby` apontando para a aba dele desde a primeira renderização. Todo painel aparece sem script, então nada fica escondido atrás de um controle que não funciona."""
"component.tab-panel.prop.name.doc" = """O `Tabs` a que isto pertence. **Obrigatório**, e precisa bater com o `name` da própria tira. O id deste painel e a aba que o nomeia vêm dele, então outra palavra o deixa inalcançável."""
"component.tab-panel.prop.value.doc" = """Qual aba mostra isto, batendo com a `Tab` de mesmo `value`. **Obrigatório**, e único dentro de um conjunto, porque ele é metade dos dois ids."""
"component.tab-panel.prop.children.doc" = """O conteúdo do painel. Pode ser qualquer coisa, inclusive outro conjunto de abas, já que os ids vêm de um `name` que difere."""

