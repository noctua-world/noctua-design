"component.abbr.summary" = """Mostre uma abreviatura junto com as palavras que ela representa."""
"component.theme-scope.summary" = """Dê um tema próprio a uma parte da página, da paleta ao fundo."""
"component.blockquote.summary" = """Mostre uma citação destacada do texto ao redor dela."""
"component.button.summary" = """Deixe a pessoa executar uma ação com um toque, em todas as formas que uma interface pede."""
"component.button-group.summary" = """Agrupe botões que andam juntos, unidos em um só controle ou separados."""
"component.switch.summary" = """Deixe a pessoa ligar ou desligar uma configuração, com efeito assim que o controle é apertado."""
"component.tag-picker.summary" = """Deixe a pessoa escrever vários valores, cada um uma tag que ela pode tirar."""
"component.tag-picker.guidance" = """Use um seletor de tags para vários valores que a pessoa **escreve**, como palavras-chave, destinatários ou rótulos. Cada valor confirmado é uma `Tag` removível no campo. Se as respostas são uma lista fixa, use `Select { multiple, searchable }`."""
"component.tag-picker.a11y-notes" = """A caixa de texto é o combobox e as tags são uma lista ao lado, cada uma com o próprio papel. Remover a última tag leva o foco ao próximo controle de remover ou à caixa de texto, nunca ao `<body>`."""
"component.tag-picker.prop.name.doc" = """O campo sob o qual estes valores são enviados, e a raiz de todo id daqui. **Obrigatório**, porque um id derivado de um nome opcional pode ser compartilhado por vários componentes na mesma página."""
"component.tag-picker.prop.label.doc" = """O que está sendo coletado, na língua de quem lê. É um `<label for>` de verdade na caixa de texto, e também o nome acessível da lista de tags."""
"component.tag-picker.prop.hint.doc" = """Uma frase abaixo do rótulo, antes de qualquer coisa dar errado. É ligada por `aria-describedby`, então um leitor de tela a lê junto com a caixa de texto."""
"component.tag-picker.prop.error.doc" = """O que está errado, depois de um envio. Carrega `role="alert"`, então um leitor de tela a lê quando ela aparece. É a frase de quem chama, e nada aqui escreve por cima nem a apaga."""
"component.tag-picker.prop.placeholder.doc" = """A dica dentro da caixa de texto. Nunca é o único nome que o campo tem."""
"component.tag-picker.prop.size.doc" = """O tamanho do campo e das tags nele, acompanhando o `Button` passo a passo. A altura do campo é o que as tags fizerem dela, e ele ganha uma linha quando as tags precisam."""
"component.tag-picker.prop.creatable.doc" = """Se o que a pessoa digita pode virar um valor que não foi oferecido. **Ligado por padrão**, ao contrário do `Select`. Desligado, o controle funciona como um `Select { multiple }` que desenha as respostas de outro jeito."""
"component.tag-picker.prop.create_label.doc" = """A oferta de adicionar o que foi digitado, com um buraco `{term}`. Defina quando `creatable` estiver ligado, para que a pessoa saiba que a linha pode ser apertada."""
"component.tag-picker.prop.separators.doc" = """Os caracteres que confirmam um valor, além do Enter. Uma vírgula por padrão, e uma prop porque uma lista de e-mails pode querer também um ponto e vírgula. Um separador é uma tecla aqui e nunca uma codificação."""
"component.tag-picker.prop.paste.doc" = """Se colar um texto com um separador confirma vários valores de uma vez. Ligado por padrão. Desligue quando os valores podem conter um separador legitimamente."""
"component.tag-picker.prop.duplicates.doc" = """Se o mesmo valor pode ser confirmado duas vezes. Desligado por padrão. A comparação ignora caixa e forma do acento, então `Ochre` e `ochre` são uma resposta só, assim como as duas grafias de `é`."""
"component.tag-picker.prop.max.doc" = """Quantos valores são permitidos. Texto e não número, porque toda prop que cruza as duas linguagens é texto. No limite a caixa de texto recusa o que é digitado e diz o motivo."""
"component.tag-picker.prop.max_label.doc" = """O que é dito nesse limite, com um buraco `{max}`. Defina, para que um campo que para de aceitar valores dê um motivo."""
"component.tag-picker.prop.pattern.doc" = """Uma expressão regular que todo valor precisa atender. É o `pattern` da própria plataforma, e é como um seletor de e-mails rejeita uma palavra."""
"component.tag-picker.prop.invalid_label.doc" = """O que é dito quando um valor não casa, com um buraco `{term}`. Defina sempre que `pattern` estiver definido."""
"component.tag-picker.prop.clearable.doc" = """Se aparece um controle para tirar todas as tags de uma vez. Desligado por padrão, ao contrário do `Search`, porque redigitar várias tags custa mais do que redigitar uma busca."""
"component.tag-picker.prop.clear_label.doc" = "O nome desse controle. Ele é um glifo, então este é o único nome que ele tem."
"component.tag-picker.prop.remove_label.doc" = """O nome do controle de remover de cada tag, com um buraco `{label}`. Um leitor de tela lê *Remover ocre* em vez de *Remover* em cada tag."""
"component.tag-picker.prop.added_label.doc" = """O que é lido quando um valor é confirmado, com um buraco `{label}`. Confirmar não muda nada que tenha foco, então sem esta frase apertar Enter é silencioso para o leitor de tela."""
"component.tag-picker.prop.removed_label.doc" = """O mesmo, para um valor tirado. Importa mais, porque o controle que o removeu saiu da página e o foco teve de ir para outro lugar."""
"component.tag-picker.prop.status.doc" = """Quantos valores existem, com um buraco `{count}`. Uma frase com um buraco, e pode levar uma forma por categoria de plural (`one:…|other:…`), como o `Search.status` faz."""
"component.tag-picker.prop.empty_label.doc" = """O que a lista de sugestões diz quando nada casa com o que foi digitado. Defina, para que a lista dê uma resposta em vez de não mostrar nada."""
"component.tag-picker.prop.loading.doc" = """Se as sugestões ainda estão a caminho. A lista diz isso em vez de não mostrar nada, porque uma lista vazia e uma lista que não chegou significam coisas opostas."""
"component.tag-picker.prop.loading_label.doc" = """O que a lista diz enquanto as sugestões vêm."""
"component.tag-picker.prop.disabled.doc" = """Desabilita o controle inteiro. Escreve o atributo `disabled` de verdade no `<select>` e na caixa de texto, porque só o de verdade impede um formulário de enviar."""
"component.tag-picker.prop.required.doc" = """Se ao menos um valor é necessário. Vai na **caixa de texto** e não no `<select>` escondido, porque o navegador precisa focar um controle inválido para ancorar a bolha dele."""
"component.tag-picker.prop.glass.doc" = """Fosca o campo. A lista de sugestões continua opaca diga o que disser, pelo motivo do `Select`: uma lista flutuante precisa ser legível contra o que estiver atrás."""
"component.tag-picker.prop.children.doc" = """As sugestões, como `SelectOption` e `SelectGroup`, que renderizam como elementos `<option>` e `<optgroup>` de verdade e funcionam sem script. **Dentro de um seletor o `value` delas tem de ser igual ao rótulo**."""
"component.tag-picker.key.enter.name" = "Enter"
"component.tag-picker.key.enter.action" = """Confirma o que foi digitado, ou pega a sugestão destacada. Com a caixa de texto vazia, não faz nada."""
"component.tag-picker.key.a-separator.name" = "Um separador"
"component.tag-picker.key.a-separator.action" = """Confirma o que foi digitado. Um separador é uma tecla aqui e nunca parte de um valor."""
"component.tag-picker.key.backspace.name" = "Backspace"
"component.tag-picker.key.backspace.action" = """Remove a última tag, quando a caixa de texto está vazia."""
"component.tag-picker.key.down-arrow-up-arrow.name" = "Seta para baixo / Seta para cima"
"component.tag-picker.key.down-arrow-up-arrow.action" = """Move pelas sugestões. O foco fica na caixa de texto, então o destaque anda por `aria-activedescendant`."""
"component.tag-picker.key.escape.name" = "Escape"
"component.tag-picker.key.escape.action" = """Fecha a lista de sugestões e mantém o que foi digitado."""
"component.tag-picker.key.tab.name" = "Tab"
"component.tag-picker.key.tab.action" = """Sai do campo. As tags **não** são paradas de tabulação, e são alcançadas com as setas a partir da caixa de texto vazia."""
"component.tag.summary" = """Mostre um valor ou um rótulo em uma pílula que também pode ser link, alternador ou removível."""
"component.avatar.summary" = """Mostre quem é uma pessoa, como foto, como iniciais ou como ícone."""
"component.avatar.guidance" = """Use um avatar quando o nome sozinho não identifica a pessoa, como em uma fileira de revisores ou em quem escreveu um comentário. Para uma coisa em vez de uma pessoa, use `Tag` com uma `image`. Ele desenha a foto sobre as iniciais sobre o ícone."""
"component.avatar.a11y-notes" = """O nome acessível está no invólucro e a foto carrega `alt=""`. As iniciais são `aria-hidden`, e esse alt vazio é o que deixa uma foto quebrada cair nelas."""
"component.avatar.prop.label.doc" = """Quem é esta pessoa, por extenso. É o nome acessível do componente inteiro, não o da foto, que carrega `alt=""`. **Obrigatório**. Para um avatar sem nome, use `decorative`."""
"component.avatar.prop.initials.doc" = """As letras mostradas quando não há foto. **Escritas por quem chama, nunca derivadas do nome**, porque a derivação falha em alguns nomes e segue uma convenção diferente em cada idioma. Ausente, cai no ícone."""
"component.avatar.prop.src.doc" = """A foto. É posta **sobre** as iniciais em vez de no lugar delas, então uma URL que nunca responde mostra as letras, sem script. A caixa dela usa o tamanho definido abaixo e não o da imagem, então nada se mexe quando ela chega."""
"component.avatar.prop.icon.doc" = """O desenho atrás de todo o resto, para uma pessoa sem foto e sem iniciais, como um convite pendente. Ausente, desenha `user`."""
"component.avatar.prop.href.doc" = """Para onde esta pessoa leva, como a página de perfil dela. A presença dele faz do avatar um `<a>` de verdade. O botão do meio do mouse, o menu de contexto e a lista de links de um leitor de tela funcionam."""
"component.avatar.prop.size.doc" = """O tamanho da caixa: `small`, `medium` ou `large`. Acompanha `Button` passo a passo, então um avatar ao lado de um controle se alinha. Dentro de um `AvatarGroup` vale o tamanho do grupo."""
"component.avatar.prop.shape.doc" = """Os cantos: círculo, cantos arredondados ou quadrado. Padrão `circle`. Use círculo para uma pessoa e quadrado para uma organização ou uma coisa."""
"component.avatar.prop.tone.doc" = """Qual cor semântica pinta o que aparece quando não há foto. `neutral` por padrão. As letras são o que distingue duas pessoas, então a cor é um segundo sinal e não o único."""
"component.avatar.prop.decorative.doc" = """Esconde o componente inteiro de um leitor de tela, para um avatar ao lado de um nome que já está na tela. **Um avatar decorativo não pode ser interativo**, porque um elemento focável dentro de `aria-hidden` é alcançável pelo teclado e não descrito."""
"component.avatar-group.summary" = """Mostra várias pessoas como um grupo sobreposto, com uma contagem para o resto."""
"component.avatar-group.guidance" = """Use um grupo de avatares para mostrar várias pessoas como uma coisa só, como quem revisou uma mudança ou quem está numa sala. Nomeie o grupo com `label`, passe os avatares como filhos e escreva `more` para quem não aparece."""
"component.avatar-group.a11y-notes" = """Um `role="list"` com nome obrigatório. O contador é o último item da lista em vez de algo ao lado, então a contagem que o leitor de tela lê inclui ele. Cada avatar mantém o próprio nome."""
"component.avatar-group.prop.label.doc" = """O nome do grupo, como *Revisores* ou *Nesta sala*. **Obrigatório**, porque o grupo é um `role="list"` e uma lista sem nome dá ao leitor de tela apenas o tamanho dela. `Toolbar` e `Pagination` também exigem um."""
"component.avatar-group.prop.more.doc" = """A palavra para quem não aparece, como `+5` ou `mais 5`. Quem chama escreve, porque a redação muda com o idioma. Ausente, nenhum contador é desenhado, o que serve a um grupo que mostra todo mundo."""
"component.avatar-group.prop.more_label.doc" = """O que o contador significa, como frase inteira: *mais 5 revisores*. A ficha tem dois caracteres, então este é o único nome acessível que ela tem. Desejado na prática por `more`."""
"component.avatar-group.prop.more_href.doc" = """Para onde o contador leva, em geral a lista completa numa página própria. Com ele o contador é um `<a>` de verdade. Sem ele o contador não é um controle e não recebe foco."""
"component.avatar-group.prop.size.doc" = """O tamanho de todo mundo no grupo, declarado uma vez. Ele prevalece sobre o `size` de cada `Avatar`, então os rostos de uma fileira sempre compartilham a mesma caixa (`NOCTUA.md §9.7`)."""
"component.avatar-group.prop.shape.doc" = """O formato dos cantos de todo mundo no grupo, declarado uma vez. Ele prevalece sobre o `shape` de cada `Avatar`, pelo mesmo motivo do tamanho."""
"component.avatar-group.prop.overlap.doc" = """O quanto cada rosto cobre o anterior. Use `none` quando os rostos são links, porque um avatar sobreposto deixa um crescente menor que o alvo de 24 pixels que a WCAG 2.5.8 pede. Um grupo largo demais **rola** em vez de quebrar linha."""
"component.avatar-group.prop.children.doc" = """Os avatares, na ordem em que devem ser lidos. Cada um vira um item da lista, e o contador é o último item dessa lista em vez de algo ao lado dela."""
"component.badge.summary" = """Marca um controle com uma contagem ou um ponto, e diz o que ele conta."""
"component.input.summary" = """Deixe a pessoa escrever uma linha de texto, com o teclado que o celular dela deve abrir."""
"component.textarea.summary" = """Deixe a pessoa escrever uma resposta de várias linhas, numa caixa que pode crescer com ela."""
"component.number-input.summary" = """Deixe a pessoa informar uma quantidade, com botões de passo e teclado numérico."""
"component.slider.summary" = """Deixe a pessoa definir um valor arrastando um cursor por uma trilha."""
"component.file-input.summary" = """Deixe a pessoa escolher arquivos, selecionando ou soltando, e corrigir o que escolheu."""
"component.time-input.summary" = """Pede uma hora do dia, em caixas separadas, no relógio da pessoa."""
"component.field.summary" = """Rotule um controle de formulário, e mostre a dica e a mensagem de erro embaixo dele."""
"component.swatch.summary" = """Mostre a cor de destaque de uma paleta como um chip."""
"component.color-picker.summary" = """Deixe a pessoa escolher uma cor num quadrado, com todas as notações dela recolhidas."""
"component.search.summary" = """Deixe a pessoa achar uma coisa entre muitas, com os resultados abaixo da caixa ou num painel."""
"component.search-group.summary" = """Agrupe uma sequência de resultados sob um título que os nomeia."""
"component.search-result.summary" = """Mostra um resultado de busca como link, com uma segunda linha sob o nome."""
"component.segmented.summary" = """Deixe a pessoa escolher um valor de um conjunto curto e fixo, com todas as opções visíveis."""
"component.segmented-item.summary" = """Dê a um `Segmented` um dos valores entre os quais ele escolhe."""
"component.pagination.summary" = """Percorra um conjunto de páginas com links de verdade e uma janela em volta da atual."""
"component.select.summary" = """Deixe a pessoa escolher um valor, ou vários, entre mais opções do que uma lista mostra."""
"component.select-group.summary" = """Agrupe as opções dentro de um Select sob um nome."""
"component.select-option.summary" = """Adicione um valor a um select, com segunda linha, ícone ou cor opcionais."""
"component.checkbox.summary" = """Deixe a pessoa marcar uma ou mais opções, ou concordar com uma única declaração."""
"component.radio.summary" = """Deixe a pessoa escolher exatamente uma resposta entre várias."""
"component.fieldset.summary" = """Agrupe os controles que respondem a uma pergunta, com a dica e o erro do grupo."""
"component.code-block.summary" = """Mostre um bloco de código com realce de sintaxe, em qualquer uma de trinta e quatro linguagens."""
"component.code.summary" = """Marque um fragmento de código dentro de uma frase."""
"component.del.summary" = """Mostra texto que foi removido do documento."""
"component.disclosure.summary" = """Deixe a pessoa mostrar e esconder um bloco de conteúdo pelo controle dele."""
"component.em.summary" = """Marque a ênfase de entonação em uma palavra dentro de uma frase."""
"component.heading.summary" = """Defina o nível na estrutura e o tamanho visual de um título separadamente."""
"component.ins.summary" = """Marque um texto que foi adicionado ao documento."""
"component.kbd.summary" = """Mostre uma tecla ou um atalho, como impresso em um teclado."""
"component.link.summary" = """Leva a outra página, e marca os links que saem do site."""
"component.list.summary" = """Agrupe itens numa lista ordenada, não ordenada ou de descrição, com aninhamento."""
"component.list-item.summary" = """Mostre um item de uma lista, ou um termo e a descrição dele."""
"component.mark.summary" = """Realce um texto para o que a pessoa está fazendo agora, como um resultado de busca."""
"component.paragraph.summary" = """Renderize um parágrafo de prosa."""
"component.prose.summary" = """Guarda texto longo numa coluna que limita o próprio comprimento de linha."""
"component.strong.summary" = """Marque um texto como importante, grave ou urgente, e não apenas em negrito."""
"component.text.summary" = """Defina o tamanho, o peso e o tom de um trecho de texto, pela escala tipográfica."""
"component.toolbar.summary" = """Agrupe controles numa barra que é uma única parada de tabulação, percorrida com as setas."""
"component.toolbar-group.summary" = """Agrupa os controles que ficam numa ponta da barra de ferramentas."""
"component.time.summary" = """Marque uma data ou hora de modo que máquinas e pessoas consigam ler."""
"component.menu.summary" = """Deixe a pessoa escolher uma ação na lista que um botão abre."""
"component.menu-item.summary" = """Coloque uma ação num menu, como botão de verdade ou link de verdade quando leva a algum lugar."""
"component.tree.summary" = """Deixe a pessoa percorrer uma hierarquia, abrindo, fechando e escolhendo nós nela."""
"component.tree.guidance" = """Use uma árvore para uma hierarquia que a pessoa percorre, como uma árvore de arquivos ou um sumário. Sem script ela é uma `<ul>` aninhada de links, porque o runtime escreve todo papel, estado e `tabindex`."""
"component.tree.a11y-notes" = """Todo papel e todo estado são escritos pelo script, e sem nenhum isto é uma `<ul>` aninhada de links. `role="treeitem"` vai na linha e nunca no link dentro dela, e a árvore inteira é uma parada de tabulação."""
"component.tree.prop.name.doc" = """Do que esta árvore é, como um script a encontra, e a raiz de todo id nela. **Obrigatório**, porque um id derivado de um nome opcional é compartilhado por todas as árvores da página."""
"component.tree.prop.label.doc" = """O nome da hierarquia. Obrigatório, porque um `role="tree"` sem nome dá ao leitor de tela só a palavra *árvore*."""
"component.tree.prop.selection.doc" = """Se os nós podem ser escolhidos, e quantos. `none` é o padrão e deixa a árvore só como navegação. `multiple` também escreve `aria-multiselectable`. **Um nó selecionável não deveria ser um link**, e carrega `TreeItem { value }`."""
"component.tree.prop.form.doc" = """O campo sob o qual os nós escolhidos são enviados. A presença dele põe uma caixa de seleção escondida de verdade dentro de cada nó selecionável, então o estado sobrevive a um envio sem script. Ausente, a seleção fica só na tela."""
"component.tree.prop.size.doc" = """A altura de uma linha e o passo de recuo de cada nível. Linhas são alvos, então os três valores passam do mínimo de 24px da WCAG 2.5.8."""
"component.tree.prop.guides.doc" = """Desenha um traço descendo cada nível, para que a pessoa veja a que pai uma linha profunda pertence. Desligado por padrão, e mais útil numa árvore de vários níveis."""
"component.tree.prop.expand_label.doc" = """O nome do controle que abre um ramo, com um buraco `{label}` para o nome do próprio ramo. O controle é um chevron, então este é o único nome que ele tem."""
"component.tree.prop.collapse_label.doc" = """O nome desse controle quando o ramo está aberto. Dois nomes e não um, porque *Expandir* num ramo aberto descreve o estado e não o que apertar faz."""
"component.tree.prop.empty_label.doc" = """O que um ramo sem nada dentro diz. Defina, para que uma linha que abre num vazio seja explicada."""
"component.tree.prop.children.doc" = """Os `TreeItem`s de primeiro nível. Os aninhados são filhos do item a que pertencem. Essa contenção real no DOM é o que deixa o navegador calcular `aria-level`, `aria-setsize` e `aria-posinset`."""
"component.tree.key.down-arrow-up-arrow.name" = "Seta para baixo / Seta para cima"
"component.tree.key.down-arrow-up-arrow.action" = """Vai para o nó **visível** seguinte e anterior, entre níveis, que não é o irmão seguinte quando um ramo está aberto."""
"component.tree.key.right-arrow.name" = "Seta para a direita"
"component.tree.key.right-arrow.action" = """Abre um ramo fechado, ou vai para o primeiro filho de um aberto. Numa folha não faz nada."""
"component.tree.key.left-arrow.name" = "Seta para a esquerda"
"component.tree.key.left-arrow.action" = """Fecha um ramo aberto, ou vai para o pai a partir de um ramo fechado ou de uma folha."""
"component.tree.key.home-end.name" = "Home / End"
"component.tree.key.home-end.action" = """Vai para o primeiro e o último nó visível."""
"component.tree.key.asterisk.name" = "Asterisco"
"component.tree.key.asterisk.action" = """Abre todos os ramos do nível do nó em foco. Não abre os ramos abaixo deles."""
"component.tree.key.enter.name" = "Enter"
"component.tree.key.enter.action" = """Segue o link do nó, honrando Command ou Control para uma nova aba. Num ramo sem link, abre ou fecha."""
"component.tree.key.space.name" = "Espaço"
"component.tree.key.space.action" = """Escolhe o nó, numa árvore com seleção. Numa árvore sem seleção, não faz nada em vez de rolar a página."""
"component.tree.key.shift-with-an-arrow.name" = "Shift com uma seta"
"component.tree.key.shift-with-an-arrow.action" = """Estende a seleção até o nó para onde se moveu. Precisa de `multiple`."""
"component.tree.key.control-with-an-arrow.name" = "Control com uma seta"
"component.tree.key.control-with-an-arrow.action" = """Move sem escolher, para que um nó distante possa ser somado com Espaço. Precisa de `multiple`."""
"component.tree.key.control-with-a.name" = "Control com A"
"component.tree.key.control-with-a.action" = """Escolhe todos os nós visíveis. Precisa de `multiple`. Em outra árvore continua o *selecionar tudo* do navegador."""
"component.tree.key.a-printable-character.name" = "Um caractere imprimível"
"component.tree.key.a-printable-character.action" = """Pula para o próximo nó visível cujo nome começa com as letras digitadas, com cerca de um segundo entre elas."""
"component.tree-item.summary" = """Ponha um nó numa árvore: o nome dele, para onde leva, e o que está embaixo."""
"component.tree-item.guidance" = """Use um item de árvore para um nó dentro de uma `Tree`: o nome dele, para onde leva e o que está embaixo. **O nome é uma prop e os filhos são os nós embaixo dele**, porque um `treeitem` calcula o nome a partir do conteúdo."""
"component.tree-item.a11y-notes" = """`role="treeitem"` vai no `<li>` e o `<a>` dentro dele continua um link, então o botão do meio e o *copiar endereço do link* seguem funcionando. `aria-expanded` só é escrito num nó que tem filhos."""
"component.tree-item.prop.label.doc" = """O nome do nó. Uma prop e não filhos, porque o nome acessível de um `treeitem` é calculado a partir do conteúdo. Um nome contendo uma subárvore levaria junto cada descendente."""
"component.tree-item.prop.value.doc" = """O que este nó *é*, como um script ou um formulário o encontra, quando isso não é o nome dele. Um nó selecionável o envia, e ele segue a regra do `SelectOption.value`, porque um rótulo é uma frase na língua de quem lê."""
"component.tree-item.prop.href.doc" = """Para onde o nó leva. A presença dele faz do conteúdo da linha um `<a>` de verdade, dentro da linha e nunca no lugar dela. O papel fica no `<li>`, então o *copiar endereço do link* continua funcionando."""
"component.tree-item.prop.icon.doc" = """Um desenho antes do nome, como uma pasta ou um arquivo. É decorativo, e o nome ao lado é o que o leitor de tela lê."""
"component.tree-item.prop.icon_expanded.doc" = """O desenho a usar enquanto o ramo está aberto, como uma pasta aberta. Ausente mantém `icon` seja qual for o estado, o que serve para o que não é um container."""
"component.tree-item.prop.badge.doc" = """Uma palavra curta ou contagem no fim da linha, como quantos nós há dentro. É renderizado como uma `Tag` de verdade."""
"component.tree-item.prop.expanded.doc" = """Se este ramo começa aberto. É honrado **antes da primeira pintura**, por uma regra ligada ao atributo que o bootstrap carimba. Uma árvore meio fechada não salta quando o script chega."""
"component.tree-item.prop.branch.doc" = """Diz que há filhos que **não** foram passados, para o caso de carga preguiçosa. O nó ganha `aria-expanded="false"` e um controle, nada é escondido, e o link da linha é onde o resto vive."""
"component.tree-item.prop.selected.doc" = """Se este nó começa escolhido. Onde a árvore tem um `form`, é o `checked` da caixa escondida e o que um servidor recebe sem script. Onde não tem, o script escreve o `aria-selected` a partir dele."""
"component.tree-item.prop.disabled.doc" = """Impede que o nó seja escolhido ou seguido. Escreve `aria-disabled` em vez de tirar o nó do percurso, então a pessoa ainda chega até a linha e ouve que o nó está desabilitado."""
"component.tree-item.prop.current.doc" = """Marca o nó como a página em que quem lê está, com `aria-current="page"`. É uma afirmação diferente de `selected`, e uma árvore usada como navegação tem exatamente um nó atual."""
"component.tree-item.prop.children.doc" = """Os nós embaixo deste. A presença deles é o que faz disto um ramo e não uma folha, e `branch` diz isso quando não foram passados."""
"page.lineage.summary" = """Desenhe figuras e as relações entre elas em espaço tridimensional."""
"page.lineage.body" = """Uma cena de figuras e os vínculos entre elas, desenhada a partir de um grafo. Serve para uma família ao longo de seis gerações, o organograma de uma empresa, uma descendência mítica. A cena sabe de níveis e de ligações, não de pessoas."""
"page.lineage.section-bonds" = """Vínculos e uniões"""
"page.lineage.section-space" = """Rotas, tamanho e vista"""
"page.lineage.section-acting" = """Filtrar, destacar, câmera"""
"page.lineage.section-live" = """Cenas que mudam"""
"page.lineage.section-placed" = """Colocação definida no grafo"""
"page.lineage.section-models" = """Modelos na cena"""
"page.lineage.section-variants" = """Cada valor de cada prop"""
"page.lineage.section-contracts" = """Os contratos"""
"component.lineage.summary" = """Desenha figuras e as relações entre elas em espaço tridimensional."""
"component.lineage-figure.summary" = """Coloque qualquer conteúdo em um ponto nomeado de uma cena de linhagem."""
"component.date-input.summary" = """Peça uma data como três números, na ordem em que a língua da pessoa os escreve."""
"component.date-input.guidance" = """Use uma entrada de data para pedir uma data como dia, mês e ano em três caixas rotuladas. Serve para uma data que a pessoa sabe de cabeça, como a de nascimento. `order` dispõe a fileira para o locale de quem lê movendo as caixas no documento."""
"component.date-input.a11y-notes" = """Um `<fieldset>` e um `<legend>` nomeiam a pergunta, e cada caixa tem o próprio `<label for>`. A reordenação por locale move as caixas no documento, então a ordem visual é sempre a do documento."""
"component.date-input.prop.name.doc" = """O nome do campo e a raiz de todos os ids nele (`nd-date-input-{name}`). As três caixas enviam `{name}-day`, `{name}-month` e `{name}-year`. Obrigatório, porque um id derivado de um nome opcional se repete em cada cópia do campo."""
"component.date-input.prop.legend.doc" = """A pergunta, na língua de quem lê. Obrigatória, porque um fieldset sem legenda dá ao leitor de tela um grupo e nada que diga para que o grupo serve."""
"component.date-input.prop.day_label.doc" = """O rótulo visível da caixa do dia. Obrigatório, porque três caixas sem rótulo deixam a pessoa adivinhando qual é qual."""
"component.date-input.prop.month_label.doc" = "O rótulo visível da caixa do mês."
"component.date-input.prop.year_label.doc" = "O rótulo visível da caixa do ano."
"component.date-input.prop.hint.doc" = """O que a pessoa precisa saber antes de responder, como `Por exemplo, 27 3 2007`. Anda no `aria-describedby` do fieldset, então é lido junto com a pergunta."""
"component.date-input.prop.error.doc" = """O que está errado com a data, nas palavras de quem chama. A presença dele marca o campo como inválido, então a borda vermelha e a mensagem sempre aparecem juntas. Uma frase de quem chama nunca é apagada pelo script."""
"component.date-input.prop.error_label.doc" = """A palavra lida antes da mensagem, como `Erro:`. Fica escondida visualmente, porque a mensagem já está marcada como erro na tela. O `Field` a desenha antes de toda frase, a de quem chama e a do validador."""
"component.date-input.prop.value.doc" = """A data já conhecida, no formato ano-mês-dia (`2026-08-07`). É dividida nas três caixas na renderização, e a ordem da fileira decide como a pessoa a vê."""
"component.date-input.prop.min.doc" = """A data mais antiga aceita, no mesmo formato do `value`. O script rejeita datas anteriores com `min_label`, e o calendário desabilita os dias delas. Não é o `min` da plataforma, porque estas caixas são de texto."""
"component.date-input.prop.max.doc" = """A data mais recente aceita, no mesmo formato, rejeitada com `max_label`."""
"component.date-input.prop.required.doc" = """O atributo `required` de verdade, nas três caixas, para que o próprio navegador rejeite um envio vazio sem script rodando."""
"component.date-input.prop.disabled.doc" = """Desabilita o campo inteiro de uma vez. `<fieldset disabled>` é a cascata do próprio navegador, então nada aqui percorre os filhos. A troca por setas, as sugestões e o calendário param junto."""
"component.date-input.prop.size.doc" = """A altura das caixas, igualada aos passos do `Select` para que uma data e um select na mesma linha fiquem nivelados."""
"component.date-input.prop.order.doc" = """Qual caixa vem primeiro. `auto` serve dia-mês-ano e deixa o script dispor a fileira para o locale de quem lê. Uma ordem nomeada é servida como escrita e não é mexida. A ordem em vigor é legível em `data-nd-resolved`."""
"component.date-input.prop.bday.doc" = """Marca o campo como data de nascimento, o que escreve os tokens `autocomplete="bday-day"`, `bday-month` e `bday-year` da plataforma nas caixas. O navegador então preenche as três, na ordem em que estiverem."""
"component.date-input.prop.pad.doc" = """Um auxílio de digitação, desligado por padrão: `7` vira `07` quando a caixa do dia ou do mês é deixada. Acontece ao sair da caixa e nunca enquanto se digita."""
"component.date-input.prop.expand.doc" = """Um auxílio de digitação, desligado por padrão: um ano de dois dígitos vira quatro ao sair da caixa. O século é o que cai dentro de `min` e `max` quando exatamente um cai. Fora isso, um ano até dez à frente fica neste século e os outros no anterior."""
"component.date-input.prop.calendar.doc" = """Adiciona uma grade de mês ao painel de sugestões, construída pelo script com o formatador do próprio locale. Traz nomes de mês, iniciais dos dias e o primeiro dia da semana. Precisa de `suggest_label`, que nomeia o controle que a abre."""
"component.date-input.prop.suggest_label.doc" = """O nome do controle de sugestões e do painel dele. O script só constrói o botão quando isto está definido, junto com escolhas rápidas nos filhos ou `calendar` ligado."""
"component.date-input.prop.previous_label.doc" = """O nome do controle de voltar um mês no calendário. Controles só de ícone também precisam de nome."""
"component.date-input.prop.next_label.doc" = """O nome do controle de avançar um mês no calendário."""
"component.date-input.prop.required_label.doc" = """A frase para um campo obrigatório enviado com as três caixas vazias, como `Informe sua data de nascimento`."""
"component.date-input.prop.missing_label.doc" = """A frase para uma data com uma caixa vazia, com `{field}` preenchido com o rótulo daquela caixa."""
"component.date-input.prop.number_label.doc" = """A frase para uma caixa com algo que não é número, com `{field}` preenchido com o rótulo dela. É julgada depois da normalização Unicode, então dígitos de largura inteira contam como dígitos."""
"component.date-input.prop.year_digits_label.doc" = """A frase para um ano com menos de quatro dígitos, usada quando `expand` está desligado ou o ano tem três dígitos, que nunca são expandidos."""
"component.date-input.prop.invalid_label.doc" = """A frase para três números que não são uma data existente. Exemplos são 31 de abril e 29 de fevereiro fora de um ano bissexto."""
"component.date-input.prop.min_label.doc" = """A frase para uma data anterior a `min`, com `{min}` preenchido com o limite escrito pelo formatador do próprio locale. O formato de máquina não é mostrado."""
"component.date-input.prop.max_label.doc" = """A frase para uma data posterior a `max`, com `{max}` preenchido do mesmo jeito."""
"component.date-input.prop.glass.doc" = """Fosca as caixas. O painel de sugestões continua opaco, pelo motivo do `Select`: uma lista vista através do que está atrás dela é difícil de ler."""
"component.date-input.prop.children.doc" = """As escolhas rápidas, como elementos `Time`, com o valor de máquina no `datetime` e as palavras de quem lê como conteúdo. São servidas inertes e escondidas, e o script monta a lista de sugestões a partir delas."""
"component.date-input.state.invalid.doc" = """Se o campo está em erro. É derivado da frase no espaço de erro, a de quem chama na renderização e a do validador depois. A borda vermelha e a frase sempre aparecem juntas."""
"component.date-input.state.resolved.doc" = """A ordem realmente em vigor, que é a ordem do documento: `dmy`, `mdy` ou `ymd`. É servida como a ordem declarada, ou `dmy` sob `auto`, e re-carimbada pelo script depois da detecção."""
"component.date-input.state.expanded.doc" = """Se o painel de sugestões está aberto. É escrito só no botão construído pelo script, então uma página sem script nunca reivindica um popup que não pode abrir."""
"component.date-input.key.digits.name" = "Dígitos"
"component.date-input.key.digits.action" = """Preenchem a caixa em foco. O foco nunca avança sozinho, então uma caixa já completa ainda pode ser editada."""
"component.date-input.key.tab-shift-tab.name" = "Tab / Shift+Tab"
"component.date-input.key.tab-shift-tab.action" = """Move entre as caixas na ordem visual, que é sempre a ordem do documento."""
"component.date-input.key.up-down-arrow.name" = "Seta para cima / para baixo"
"component.date-input.key.up-down-arrow.action" = """Muda o número da caixa em foco, girando nos limites dela. A caixa continua um campo de texto e não é spinbutton."""
"component.date-input.key.alt-with-down-arrow.name" = "Alt com seta para baixo"
"component.date-input.key.alt-with-down-arrow.action" = """Abre as sugestões, quando existem. A seta para baixo sozinha já muda o número."""
"component.date-input.key.down-up-arrow-list-open.name" = "Setas, com a lista aberta"
"component.date-input.key.down-up-arrow-list-open.action" = """Move o destaque pelas escolhas rápidas, por `aria-activedescendant` e não movendo o foco."""
"component.date-input.key.arrows-in-the-calendar.name" = "Setas, no calendário"
"component.date-input.key.arrows-in-the-calendar.action" = """Um dia ao lado, uma semana acima ou abaixo. Page Up e Page Down mudam o mês, Shift o ano, Home e End as pontas."""
"component.date-input.key.enter-in-the-panel.name" = "Enter, no painel"
"component.date-input.key.enter-in-the-panel.action" = """Leva a data destacada para as três caixas, fecha o painel e devolve o foco ao controle que o abriu."""
"component.date-input.key.enter-in-a-box.name" = "Enter, numa caixa"
"component.date-input.key.enter-in-a-box.action" = """Envia o formulário, como em qualquer campo de texto, e o validador roda em seguida."""
"component.date-input.key.escape.name" = "Escape"
"component.date-input.key.escape.action" = """Fecha o painel e não muda nada do que já foi digitado nas três caixas."""
"component.date-input.key.paste.name" = "Colar"
"component.date-input.key.paste.action" = """Divide uma data colada pelas três caixas, na ordem em vigor. Um primeiro número de quatro dígitos é sempre o ano."""
"component.lineage.guidance" = """Use uma linhagem para desenhar figuras e as relações entre elas, escritas em `graph`, uma pequena linguagem de texto. O layout é o mesmo em Rust e em JavaScript, então os dois põem uma figura na mesma célula. A cena é feita de elementos reais."""
"component.lineage.a11y-notes" = """O campo é nomeado e focalizável, então uma cena que um ponteiro gira é uma cena que um teclado alcança. Cada figura carrega uma lista escondida de links para as figuras a que está ligada."""
"component.lineage.prop.name.doc" = """Como esta cena se chama na marcação, e a raiz de todo id dentro dela. **Obrigatório**, porque uma página pode renderizar várias cenas ao mesmo tempo e ids feitos de um nome opcional colidiriam. `LineageFigure.scene` usa a mesma palavra."""
"component.lineage.prop.label.doc" = """O nome da cena. Ele nomeia uma região em que quem lê pode pôr o foco. Uma região focalizável sem nome não deixa nada para o leitor de tela dizer na chegada. `Tree` e `Toolbar` também exigem um."""
"component.lineage.prop.graph.doc" = """A estrutura, em três declarações: `figure <id>`, `mark <id>` e `bond <de> <para>`. Outras palavras são atributos: `label`, `kind`, `tone`, `set`. Um `kind` `union` ou `partner` põe duas figuras na mesma fileira, e qualquer outra desce."""
"component.lineage.prop.view.doc" = """Como os ramos são arranjados. `flat` põe os ramos lado a lado, do jeito que uma árvore genealógica costuma ser desenhada, com a perspectiva e a espessura ainda ali. `deep` empilha os ramos na cena, então um ramo vira um plano."""
"component.lineage.prop.line.doc" = """De que uma ligação é feita. `ribbon` é uma tira plana, que é tudo o que uma vista plana mostra. `beam` dá a cada traço uma seção quadrada de verdade. Sem valor, segue `thickness`, então figuras com volume ganham traços com volume."""
"component.lineage.prop.reach.doc" = """Onde uma ligação termina. `touch` leva cada traço até a figura que ele liga. `shy` para cada traço a um terço de célula. Use `shy` onde as figuras não são caixas (`shape=bare`) e um traço riscaria um nome solto."""
"component.lineage.prop.lettering.doc" = """De que a tipografia é feita. `flat` é texto comum. `solid` extruda cada nome e data, dando a cada glifo profundidade real a partir de camadas empilhadas que giram com a cena. `thickness` e `line: beam` fazem o mesmo pelas figuras."""
"component.lineage.prop.route.doc" = """Como uma ligação é desenhada quando o vínculo não diz. `elbow` é o colchete que uma árvore genealógica usa e `taut` é um traço reto de ponta a ponta. Uma união entre gerações contorna o bloco dela de todo jeito."""
"component.lineage.prop.size.doc" = """A escala da cena inteira, cobrindo célula, fileira, plano e figura juntos. É um multiplicador só sobre os tokens de `[scene]` em vez de três tamanhos de cartão, então as proporções se mantêm em todo tamanho."""
"component.lineage.prop.tilt.doc" = """Onde a câmera descansa antes de a pessoa mexer nela. **`level` é o padrão e olha de frente.** A profundidade está lá de todo jeito, e o primeiro arrasto a revela. `resting` abre com inclinação para ver as caixas, e `raked` olha de cima."""
"component.lineage.prop.thickness.doc" = """O quanto uma figura é espessa. `none` desenha a figura plana. `thin` e `slab` dão ao cartão uma borda real. Uma órbita revela essa borda, que é o que mostra a quem lê que a cena tem profundidade."""
"component.lineage.prop.filter.doc" = """O texto a casar. Ele procura no rótulo da figura, nos dados dela e nos `terms` declarados, ignorando maiúsculas e acentos, então *reis* acha *Reis*. É aplicado ao renderizar a cena e reaplicado pelo runtime conforme se digita."""
"component.lineage.prop.filter_mode.doc" = """O que um filtro faz com todo o resto. `highlight` esmaece e mantém, então quem lê vê onde na família está a resposta. `isolate` tira do desenho. **Nenhum dos dois refaz a disposição**, então a cena não se rearranja."""
"component.lineage.prop.occasion.doc" = """Que dia é hoje, se houver. Uma `LineageFigure` que declara a mesma palavra é mostrada e uma que declara outra não. É uma prop e não um relógio, porque um componente que lesse a data discordaria de um servidor de ontem."""
"component.lineage.prop.sets.doc" = """Quais segmentos trocáveis estão à mostra, como `group:name`, separados por espaços. Tudo que carrega um `set=` de um grupo nomeado aqui é desenhado, e tudo de outro conjunto do mesmo grupo não é. **Este componente nunca busca nada.**"""
"component.lineage.prop.parallax.doc" = """Se as camadas dentro de uma figura seguem o ponteiro, para que um retrato se volte a quem lê. Precisa do runtime, é desligado por padrão, e fica desligado por completo sob movimento reduzido."""
"component.lineage.prop.pick.doc" = """O que quem lê pode destacar. Uma ligação destacada é desenhada mais forte em todo o percurso, o que mostra para onde um traço vai numa cena cheia. Um destaque é uma caixa de seleção de verdade e funciona sem script."""
"component.lineage.prop.form.doc" = """O campo sob o qual as figuras e as ligações destacadas são enviadas. A presença dele dá a toda coisa destacável um `name`, então uma cena pode fazer parte de um formulário. Ausente, um destaque é só uma marca na tela."""
"component.lineage.prop.height.doc" = """Quanto espaço o campo ocupa, no máximo. O desenho é ajustado ao espaço que sobra, então uma janela mais alta dá uma cena maior em vez de mais dela. Este é o tamanho da janela, nunca o do grafo."""
"component.lineage.prop.empty_label.doc" = """O que a cena diz quando não tem nada a desenhar. Sem ele, um campo que abre no vazio não dá a quem lê nenhum sinal de que o grafo falhou ao ser lido."""
"component.lineage.prop.camera_label.doc" = """O nome dos controles de câmera, juntos. São três botões que o runtime acrescenta, e um grupo de botões sem nome sobre uma imagem não dá para usar sem enxergar."""
"component.lineage.prop.zoom_in_label.doc" = """O nome do controle que aproxima a câmera."""
"component.lineage.prop.zoom_out_label.doc" = """O nome do controle que afasta a câmera."""
"component.lineage.prop.fit_label.doc" = """O nome do controle que traz a cena inteira de volta à tela. `0` faz o mesmo, e é a saída de qualquer posição de câmera em que quem lê tenha se perdido."""
"component.lineage.prop.elided_label.doc" = """O nome de um marcador de corte, com um buraco `{count}`. `isolate` deixa um marcador onde estava cada grupo removido, carregando quantas figuras estão atrás dele. É isto que o leitor de tela lê sobre esse número."""
"component.lineage.prop.matches_label.doc" = """O que a cena diz quando um filtro muda, com um buraco `{count}`, como `one:{count} resultado|other:{count} resultados`. As duas variantes vão numa mensagem só, porque a concordância não se monta em volta de um numeral."""
"component.lineage.prop.children.doc" = """`LineageFigure`s, para as peças cujo conteúdo é mais que um nome. Uma figura marcada `slot` no grafo não desenha nada de si e espera por uma, e qualquer figura pode receber uma por cima. O resto fica na origem da cena."""
"component.lineage.state.picked.doc" = """Marcado numa ligação ou numa figura que quem lê destacou. **Carimbado pelo runtime**, enquanto o destaque em si não é. Um destaque é uma caixa de seleção de verdade, então `:checked` já o desenha sem nada rodando."""
"component.lineage.state.match.doc" = """Se uma peça responde ao filtro atual. Ausente quando não há filtro, então sem filtro e tudo casando são um estado só e não dois."""
"component.lineage.state.piece.doc" = """O que uma peça é: `figure`, `mark`, ou `elided` para os marcadores de corte que `filter_mode: isolate` sintetiza. Renderizado no servidor e nunca alterado. É contrato porque a contagem do runtime e a folha de estilo dependem dele."""
"component.lineage.key.tab.name" = "Tab"
"component.lineage.key.tab.action" = """Alcança o campo, depois cada ligação destacável e cada figura que é link. O runtime troca isso por uma parada só."""
"component.lineage.key.down-arrow-up-arrow.name" = "Seta para baixo / Seta para cima"
"component.lineage.key.down-arrow-up-arrow.action" = """Vai para um filho e para um pai, descendo as gerações e voltando. Sem o runtime, as setas rolam a página."""
"component.lineage.key.left-arrow-right-arrow.name" = "Seta para a esquerda / Seta para a direita"
"component.lineage.key.left-arrow-right-arrow.action" = """Move entre as figuras de uma fileira: irmãos, e os parceiros de cada lado de uma união."""
"component.lineage.key.shift-with-an-arrow.name" = "Shift com uma seta"
"component.lineage.key.shift-with-an-arrow.action" = """Orbita a câmera. Cima e baixo inclinam, esquerda e direita giram."""
"component.lineage.key.plus-minus.name" = "Mais / Menos"
"component.lineage.key.plus-minus.action" = """Aproxima e afasta a câmera."""
"component.lineage.key.zero.name" = "Zero"
"component.lineage.key.zero.action" = """Ajusta a cena inteira à tela, de qualquer posição de câmera."""
"component.lineage.key.enter.name" = "Enter"
"component.lineage.key.enter.action" = """Segue o link da figura quando ela tem um, e destaca a figura quando não tem."""
"component.lineage.key.space.name" = "Espaço"
"component.lineage.key.space.action" = """Destaca a figura ou a ligação em foco, onde a cena permite destacar."""
"component.lineage.key.escape.name" = "Escape"
"component.lineage.key.escape.action" = """Limpa os destaques e o filtro, e devolve a câmera para onde ela descansa."""
"component.lineage-figure.guidance" = """Use uma figura de linhagem para colocar conteúdo em um ponto nomeado de um `Lineage`, como um retrato, um cartão ou um botão. A cena publica uma posição para cada id, e a figura com aquele `at` é desenhada ali."""
"component.lineage-figure.a11y-notes" = """`href` renderiza um `<a>`, `action` renderiza um `<button>`, e com os dois o link vence. `label` vira `aria-label` e substitui o conteúdo, então não use quando o conteúdo já é texto."""
"component.lineage-figure.prop.scene.doc" = """O `name` do `Lineage` a que esta figura pertence. **Obrigatório**, e declarado em vez de herdado de um pai, o que `NOCTUA.md §9.3` proíbe. Também evita que duas cenas na mesma página compartilhem um id."""
"component.lineage-figure.prop.at.doc" = """O id no grafo em que esta figura fica. A cena publica cada posição como três propriedades personalizadas, e a figura as lê. Um `at` que não nomeia nenhum id coloca a figura na origem da cena."""
"component.lineage-figure.prop.label.doc" = """O nome acessível da figura. Informe quando o conteúdo for apenas uma imagem ou um desenho. Deixe de fora quando o conteúdo já for texto, porque o nome substitui esse texto."""
"component.lineage-figure.prop.shape.doc" = """O contorno da figura. `card` é um retângulo e `round` é um círculo, para uma marca em uma conexão. `plaque` é mais largo que alto, para um título, e `bare` não tem superfície. `card` é o padrão."""
"component.lineage-figure.prop.tone.doc" = """De qual família de cor vêm a borda e o texto. Seis famílias não se distinguem sob dicromacia, então acompanhe todo tom com uma palavra. `neutral` é o padrão."""
"component.lineage-figure.prop.parallax.doc" = """O quanto as camadas dentro desta figura inclinam em direção ao ponteiro. Cada filho direto é uma camada, do fundo para a frente. Precisa do `parallax` da cena e do runtime, e para sob movimento reduzido."""
"component.lineage-figure.prop.occasion.doc" = """A ocasião a que esta figura pertence. É desenhada apenas enquanto o `occasion` da cena for a mesma palavra, então duas figuras podem dividir um lugar. A ocultação usa uma propriedade personalizada da cena e já vale sem script."""
"component.lineage-figure.prop.set.doc" = """O conjunto intercambiável a que esta figura pertence, como `group:name`. É desenhada apenas enquanto o `sets` da cena a nomeia. **Uma figura que declara um `occasion` ignora isto**, porque uma propriedade carrega um motivo só."""
"component.lineage-figure.prop.action.doc" = """Torna esta figura um `<button>` real e nomeia o que pressioná-la significa, para a aplicação ouvir. O runtime da cena não age sobre isso, e `swaps` é a propriedade sobre a qual ele age."""
"component.lineage-figure.prop.swaps.doc" = """Para o que pressionar esta figura alterna, como `group:name`. O ramo nomeado substitui o que está à mostra, e pressionar de novo o traz de volta. A figura renderiza `aria-pressed="false"`, e o runtime o mantém igual ao conjunto à mostra."""
"component.lineage-figure.prop.href.doc" = """Torna esta figura um link, renderizado como `<a>`. Um `href` ao lado de um `action` vence, e a ação é descartada, então a figura é ou um link ou um botão."""
"component.lineage-figure.prop.children.doc" = """O conteúdo da figura, como um `Avatar`, um `Badge`, um título ou uma imagem. Os filhos diretos são as camadas de paralaxe, do fundo para a frente."""
"component.truncate.summary" = """Corte o texto num número fixo de linhas e mantenha o valor inteiro disponível."""
"component.visually-hidden.summary" = """Esconda o conteúdo da tela mantendo-o para a tecnologia assistiva."""
