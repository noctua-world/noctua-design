# --- Páginas --------------------------------------------------------------

"page.intro.title" = """Introdução"""
"page.intro.summary" = """Leia o que é este design system e por onde começar."""
"page.intro.body" = """O Noctua é um design system em dois pacotes que se comportam de forma idêntica: um crate Dioxus e um pacote React. Os dois vêm da mesma especificação. Comece pelas bases, em Tipografia, Espaçamento ou Ícones, ou abra um componente na barra lateral."""
"page.menu.summary" = """Deixe a pessoa escolher uma ação na lista que um botão abre."""
"page.menu.body" = """Um menu e os itens dele. O botão que abre um menu é um `Button` com `menu` e `controls`. Tudo depois do toque é o `dist/menu.js`: a ancoragem, o caminho das setas, a letra que salta, o Esc e o foco voltando para o botão."""
"page.tree.summary" = """Deixe a pessoa percorrer uma hierarquia, abrindo, fechando e escolhendo nós nela."""
"page.tree.body" = """A árvore e os nós dela. Com o script bloqueado, ela é uma lista aninhada de links e não afirma nada além disso. Todo papel, todo estado e toda parada de tabulação são escritos pelo script."""
"page.tabs.summary" = """Mostre um painel por vez entre vários, a partir de uma tira em que a pessoa escolhe."""
"page.tabs.body" = """A tira, uma aba e um painel. Com o script bloqueado, todo painel está na página e cada aba é um link que desce até o que ela nomeia. Nada afirma um papel que não consegue cumprir."""
"page.typography.title" = """Tipografia"""
"page.typography.summary" = """Componha o texto com a escala tipográfica, as quatro famílias e uma medida de linha fixa."""
"page.icons.title" = """Ícones"""
"page.icons.summary" = """Use qualquer ícone do conjunto, e acrescente um novo à especificação."""
"page.inline-text.summary" = """Marque abreviaturas, teclas, correções e datas dentro de uma frase."""
"page.inline-text.body" = """Dez marcações que vão dentro de uma linha, e não em um bloco próprio: uma abreviatura, uma tecla, uma correção, uma data. Cada uma é um componente, e cada uma recebe como filhos o texto que marca."""
"page.avatars.summary" = """Mostre uma pessoa, ou várias delas como um grupo só."""
"page.avatars.body" = """Uma pessoa, e várias delas como uma lista. O grupo recebe um nome e desenha os avatares passados a ele. A contagem de quem não aparece é escrita por quem chama, porque o componente não conta os próprios filhos."""
"page.search.summary" = """Busque em um conjunto de páginas e mostre os resultados agrupados abaixo da caixa."""
"page.search.body" = """Uma caixa de busca, os resultados abaixo dela e um resultado. Os filhos são links de verdade e funcionam sem script. Um índice numa URL é buscado na primeira busca e fica em cache. A busca casa por subsequência, ordena e marca as letras que casaram."""
"page.tables.summary" = """Monte uma tabela com as seis partes de que ela é feita."""
"page.tables.body" = """Linhas e colunas, e as partes de que uma tabela é feita. Numa tela estreita ela rola de lado onde há espaço, e empilha em pares de rótulo e valor onde não há. Cada parte escreve o próprio papel ARIA, que o empilhamento tiraria."""
"page.spacing.title" = """Espaçamento"""
"page.spacing.summary" = """Espace a página a partir de uma escala. Todo espaço deste site é um degrau dela."""
"spacing.tight" = """Entre um rótulo e o controle que ele nomeia. O menor dos espaços nomeados."""
"spacing.inset" = "Dentro de um controle: o preenchimento de um botão, de um campo, de um chip."
"spacing.gap" = """Entre controles irmãos numa fileira ou num formulário."""
"spacing.paragraph" = """Entre parágrafos. Generoso, porque a §9.7 pede isso."""
"spacing.heading" = """Entre um título e o texto embaixo dele."""
"spacing.section" = "Entre uma seção da página e a seguinte."
"spacing.region" = """Entre as regiões maiores de um layout."""
"spacing.named.title" = """Os espaços que têm nome"""
"spacing.named.body" = """Estes são os espaços que um componente pede por finalidade. `--noctua-space-gap` diz para que serve o espaço. `--noctua-space-4` diz só um número, e o sentido dele precisa ser decidido a cada chamada."""
"spacing.scale.title" = "A escala"
"spacing.scale.body" = """Todo degrau é múltiplo de uma base só, então nada cai entre dois degraus. A sequência é quase geométrica depois do degrau 4. Não existe 5, 20 nem 36, e um comprimento escrito à mão no código de um componente quebra o build."""
"spacing.rhythm.title" = "O ritmo que eles fazem"
"spacing.rhythm.body" = """O tamanho do espaço é o que agrupa uma página. Um título fica perto do parágrafo abaixo dele, e dois parágrafos ficam mais perto um do outro do que da próxima seção."""
"spacing.rhythm.heading" = """Um título"""
"spacing.rhythm.first" = """O parágrafo logo abaixo, perto o bastante para se ler como parte dele."""
"spacing.rhythm.second" = """Um segundo parágrafo, mais longe do título do que o primeiro e mais perto do que a próxima seção."""
"spacing.rhythm.next" = "A próxima seção"
"spacing.rhythm.third" = "Longe o bastante para o olho saber que o assunto mudou antes de ler uma palavra."
"spacing.inset.title" = "Dentro de um controle, e entre dois"
"spacing.inset.body" = """Um é o preenchimento que um controle carrega. O outro é o espaço entre ele e o próximo controle. Desenhados em botões de verdade, então o que se mede é o preenchimento entregue."""
