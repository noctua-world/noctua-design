"example.carousel.next" = "Próximo slide"
"example.carousel.dot" = "Ir para o slide {index} de {count}"
"example.carousel.counter" = "{index} de {count}"
"example.carousel.announce" = "Slide {index} de {count}"
"example.carousel.pause" = "Parar os slides"
"example.carousel.play" = "Começar os slides"
"example.carousel.slide-one" = "A chaleira, vista de cima"
"example.carousel.slide-two" = "A alça, à luz do dia"
"example.carousel.slide-three" = "O bico, de perto"
"example.carousel.slide-four" = "A tampa, aberta"
"example.carousel.slide-five" = "A base, vista de baixo"
"example.carousel.gallery-note" = """Arraste a faixa, deslize ou aperte Home. O carrossel é um contêiner de rolagem, então tudo isso funciona com o script bloqueado."""
"example.carousel.dots-note" = """Os pontos marcam a posição na sequência, e o contador diz qual slide está visível e quantos existem."""
"example.carousel.rotating-note" = """`autoplay` avança os slides por temporizador. Nunca começa sem `pause_label`, e para de vez no primeiro toque em um controle."""
"example.carousel.wrap-note" = """`wrap` volta do último slide para o primeiro, e `orientation` faz a trilha correr para baixo em vez de para o lado."""
"component.field.prop.error_slot.doc" = """Se o parágrafo de erro é renderizado **mesmo quando não há erro**, vazio, para um script escrever dentro. Desligado por padrão, porque um parágrafo vazio é um marco que o leitor de tela anuncia. Ligado para um controle que um script esconde."""
"component.field.prop.error_label.doc" = """Uma palavra anunciada antes da frase, como *Erro*. Visualmente escondida, porque o tom de perigo e a posição já dizem isso a quem enxerga. Necessária na prática pelo `error`."""
"component.field.state.slot.doc" = """Definido no parágrafo de erro, sempre, como o gancho em que um script escreve uma mensagem. Um script que procura onde pôr a mensagem do navegador acha um lugar só em qualquer componente."""
"component.error-summary.summary" = """Mostre tudo o que está errado num formulário, no topo dele, com um link para cada controle."""
"component.error-summary-item.summary" = """Ligue uma coisa errada num formulário ao controle de que ela fala."""
"page.error-summary.summary" = """Liste tudo o que está errado num formulário no topo dele, com um link para cada controle."""
"page.error-summary.body" = """O resumo e as entradas dele. Cada entrada aponta para o id de um controle, então um resumo vindo do servidor funciona sem script. O script recebe o foco, manda esse foco para o controle em vez do rótulo e monta a lista no navegador."""
# --- O sumário de erros ------------------------------------------------------

"component.error-summary.guidance" = """Use um resumo de erros no topo de um formulário que o servidor ou o navegador recusou. Cada entrada leva ao controle de que fala. Só renderize quando houver entradas."""
"component.error-summary.a11y-notes" = """A caixa leva `tabindex="-1"`, para que o foco possa ser mandado até ela sem virar uma parada de tabulação. O conteúdo de dentro leva `role="alert"`. Cada entrada é um link de verdade para um id de verdade."""
"component.error-summary.prop.name.doc" = """O identificador deste resumo, e a raiz de todo id dentro dele. **Obrigatório**, porque uma página pode ter um resumo por formulário e ids derivados de um nome ausente colidiriam."""
"component.error-summary.prop.title.doc" = """O título acima da lista, como *Há um problema*. **Obrigatório**. Ele nomeia a caixa pelo `aria-labelledby`, então quem chega pelo foco ouve o que é."""
"component.error-summary.prop.description.doc" = """Uma frase abaixo do título, antes da lista. Use para o que a lista não diz, como *sua reserva fica guardada por mais 10 minutos*. Não para repetir a contagem."""
"component.error-summary.prop.focus.doc" = """Se o resumo recebe o foco quando aparece. Ligado por padrão, porque depois de uma recusa a pessoa está no fim do formulário. Desligue só onde outra coisa tenha um direito maior ao foco."""
"component.error-summary.prop.collect.doc" = """Se o script monta a lista a partir dos campos do formulário em vez dos `children`. Desligado por padrão, porque um servidor que recusou um envio renderiza a lista sem script. Ligado, o `validationMessage` de cada campo é lido para a lista."""
"component.error-summary.prop.form.doc" = """O id do formulário de onde coletar. Ausente significa o formulário mais próximo que contenha este resumo. Isso é certo no caso comum e errado para um resumo que fica acima do formulário."""
"component.error-summary.prop.title_prefix.doc" = """Uma palavra posta antes do `<title>` do documento enquanto o resumo aparece, como *Erro:*. Marca a aba para quem saiu dela. Ausente deixa o título como está."""
"component.error-summary.prop.children.doc" = """As entradas, como `ErrorSummaryItem`. Ignoradas quando `collect` está ligado, porque duas listas do que está errado significam que uma delas está desatualizada."""
"component.error-summary.state.empty.doc" = """Definido quando o resumo não tem nada a listar. É um atributo `data-` em vez de `hidden`, e a folha de estilo tira a caixa do layout a partir daí."""
"component.error-summary.key.tab.name" = "Tab"
"component.error-summary.key.tab.action" = """Percorre as entradas, e sai. A caixa não é uma parada: `tabindex="-1"` só permite mandar o foco até ela."""
"component.error-summary.key.enter.name" = "Enter"
"component.error-summary.key.enter.action" = """Segue uma entrada até o controle dela. Cada entrada é um link de verdade, então é o comportamento do navegador."""
"component.error-summary-item.guidance" = """Use um item de resumo de erros para uma coisa errada num formulário, dentro de um `ErrorSummary` e em nenhum outro lugar. Dê a ele a mesma frase que o próprio campo mostra."""
"component.error-summary-item.a11y-notes" = """Um `<a href>` de verdade, nunca um botão, então funciona com o script bloqueado e abre em nova aba quando a pessoa pede. O texto do link é a frase inteira, então listar os links da página lista as queixas."""
"component.error-summary-item.prop.control.doc" = """O id do controle de que este item fala, o mesmo id que o `Field` dele recebeu. **Obrigatório**. Vira `href="#{control}"`, então o link funciona com o script bloqueado."""
"component.error-summary-item.prop.children.doc" = """A frase, na língua de quem lê. Use as mesmas palavras que o próprio campo mostra, para que quem segue o link ache a mensagem que leu aqui."""
# O sumário de erros. O único exemplo deste site cujo formulário existe para
