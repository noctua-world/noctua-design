# --- O contrato de cada componente ------------------------------------------
#
# Estas chaves são DERIVADAS de `spec/components/*.toml`: o inglês vive lá,
# onde também vira o comentário de documentação das duas implementações, e a
# tradução vive aqui. A verificação entre locales cobra uma resposta para cada
# uma delas, então uma prop nova no contrato para a compilação até ser traduzida.

"component.pagination.guidance" = """Use a paginação sob qualquer coisa que mostra uma página de um conjunto maior: uma tabela, uma lista, uma grade de resultados. É um componente próprio, e não uma prop do `Table`, porque uma lista de resultados precisa do mesmo controle."""
"component.pagination.a11y-notes" = """Um `<nav>` nomeado com uma lista de links, então um leitor de tela diz quantas páginas existem. O intervalo entre duas séries de números leva `aria-hidden`, e toda página é um `<a href>` de verdade."""
"component.pagination.prop.name.doc" = """O que está sendo paginado. Nomeia o controle para qualquer coisa que se ligue a ele, e é o que diferencia duas paginações numa mesma página. Obrigatório."""
"component.pagination.prop.label.doc" = """Para que serve esta navegação, na língua de quem lê, como *resultados da busca*. Vira `aria-label`, então dois `<nav>` não viram dois marcos idênticos. Obrigatório."""
"component.pagination.prop.page.doc" = """A página em vigor, como texto. Texto porque toda prop que cruza as duas linguagens é texto, e ela é limitada entre um e `pages`. Obrigatório."""
"component.pagination.prop.pages.doc" = """Quantas páginas existem no total. A última é sempre alcançável num toque, por mais longe que esteja. Obrigatório."""
"component.pagination.prop.href.doc" = """O endereço de uma página, com um marcador `{page}` para o número dela. Obrigatório, porque estes são links de verdade e um link sem destino é um botão no elemento errado."""
"component.pagination.prop.spread.doc" = """Quantas páginas são oferecidas de cada lado da que está em vigor: uma, duas ou três. `compact` serve a um controle que divide a linha com outra coisa, e as duas pontas sempre aparecem. `default` por padrão."""
"component.pagination.prop.size.doc" = """O tamanho dos links: `small`, `medium` ou `large`, acompanhando o `Button` passo a passo. `medium` e `large` passam do alvo de 44 pixels. `small` é para um controle ao lado de uma tabela densa."""
"component.pagination.prop.previous_label.doc" = """O nome do link para a página anterior, na língua de quem lê. Sem ele nenhum link desses é desenhado, o que serve a um controle que só avança."""
"component.pagination.prop.next_label.doc" = """O nome do link para a página seguinte, nos mesmos termos."""
"component.pagination.prop.page_label.doc" = """O nome acessível de um link numerado, com um marcador `{page}`, como *Página 4*. Sem ele um leitor de tela lê uma coluna de números nus. Uma frase inteira com um buraco, nunca uma palavra colada a um número."""
"component.pagination.prop.current_label.doc" = """O nome acessível da página em vigor, que também diz isso, como *Página 4, página atual*. O `aria-current` carrega o mesmo fato, e esta metade sobrevive a um motor que não anuncia o atributo."""
"component.pagination.prop.summary.doc" = """A frase sob o controle: quantos resultados existem, e quais deles esta página tem. Fica numa região dinâmica, então quem lê ouve que o conjunto não mudou quando a página vira."""
"component.pagination.state.current.doc" = """Se este link é a página sendo lida. O valor é `page` e não `true`. Isso diz a um leitor de tela que isto é um passo numa sequência, e não uma coisa selecionada."""
"component.select.guidance" = """Use um select para um valor, ou vários, entre mais do que um punhado: trinta e nove paletas, duzentos países. Para um conjunto curto, mantenha as opções na página com `Radio` numa pergunta e `Segmented` numa visão."""
"component.select.a11y-notes" = """Um `<select>` de verdade com um `<label for>` de verdade, então o popup, a digitação rápida e o valor enviado são da plataforma. O script acrescenta o padrão de combobox, e o controle nativo continua enviando."""
"component.select.prop.name.doc" = """O campo, como o formulário o envia. É também a raiz de todo id daqui, o alvo do rótulo, a dica e o erro, então quem chama não escreve nenhum. Obrigatório."""
"component.select.prop.label.doc" = """O que está sendo escolhido, na língua de quem lê. Um `<label for>` de verdade, porque um placeholder some no momento em que um valor é escolhido e não é anunciado por nada. Obrigatório."""
"component.select.prop.hint.doc" = """O que a pessoa precisa saber antes de escolher. O `aria-describedby` aponta para ela, então é lida com o controle e não depois dele."""
"component.select.prop.error.doc" = """O que está errado com a escolha, na língua de quem lê. A presença dela é o que torna o campo inválido, então a borda vermelha e a explicação sempre chegam juntas."""
"component.select.prop.error_label.doc" = """A palavra anunciada antes da mensagem, como `Erro:`. Escondida visualmente, porque tudo o que a pessoa vê já diz que o campo está em erro."""
"component.select.prop.placeholder.doc" = """O que o campo diz enquanto está sem resposta. Num select simples é também um `<option value="">` de verdade no topo, então um campo sem resposta não envia nada. Num select `multiple` é só o estado vazio."""
"component.select.prop.required.doc" = """Se uma resposta é obrigatória. O atributo de verdade, então o navegador recusa o envio sem script nenhum, e o `aria-required` decorre dele."""
"component.select.prop.multiple.doc" = """Se vários valores podem ser escolhidos. De novo o atributo de verdade. O nome é enviado uma vez por valor escolhido, e o listbox aprimorado se anuncia como de seleção múltipla."""
"component.select.prop.disabled.doc" = """Impede a resposta. O atributo de verdade em vez de `aria-disabled`, porque só o de verdade mantém o valor fora do envio."""
"component.select.prop.size.doc" = """O tamanho do controle: `small`, `medium` ou `large`, acompanhando o `Button` passo a passo. `medium` por padrão."""
"component.select.prop.searchable.doc" = """Se a lista aprimorada pode ser filtrada por digitação. Ligue para trinta e nove paletas e deixe desligado para seis, onde uma caixa de filtro promete mais do que há."""
"component.select.prop.clearable.doc" = """Se aparece um controle para devolver o campo ao nada. Ofereça só onde nada é uma resposta legítima, o que com `required` não é. Desligado por padrão."""
"component.select.prop.loading.doc" = """Se as opções ainda estão a caminho. A lista diz isso em vez de mostrar uma lista vazia, porque uma lista vazia e uma lista que não chegou significam o oposto."""
"component.select.prop.loading_label.doc" = """O que a lista diz enquanto as opções estão a caminho. Uma frase separada de `empty_label`, porque uma lista lenta e uma lista vazia são fatos opostos."""
"component.select.prop.creatable.doc" = """Se digitar algo que a lista não tem oferece adicioná-lo. Ligue junto com `searchable`, que é a caixa em que se digita. A nova opção é anexada ao `<select>` de verdade."""
"component.select.prop.search_label.doc" = """O nome acessível da caixa de filtro, na língua de quem lê. Informe junto com `searchable`. É uma prop porque este pacote não traz palavra nenhuma."""
"component.select.prop.empty_label.doc" = """O que a lista diz quando o filtro não casa com nada. Sem isso a lista fica em silêncio, o que não é uma resposta."""
"component.select.prop.create_label.doc" = """A oferta de adicionar o que foi digitado, com um marcador `{term}`. Uma frase com um buraco em vez de dois pedaços juntados, porque a ordem das palavras não é a mesma em toda língua."""
"component.select.prop.clear_label.doc" = """O nome do controle que esvazia o campo. Ele é um ícone, então este é o único nome que tem."""
"component.select.prop.selected_label.doc" = """O que o controle fechado diz quando vários valores estão escolhidos, com um marcador `{count}`. Uma lista de onze nomes não cabe num controle."""
"component.select.prop.children.doc" = """As opções, em `SelectGroup`s ou soltas."""
"component.select.state.expanded.doc" = """Se a lista aprimorada está aberta. O script o escreve no controle que constrói, e ele não existe sem script, onde o controle nativo tem o próprio popup."""
"component.select.state.invalid.doc" = """Se o campo está em erro. É derivado da presença de `error` em vez de declarado ao lado dele, então os dois não aparecem um sem o outro."""
"component.select.key.down-or-up.name" = "Seta para baixo ou para cima"
"component.select.key.down-or-up.action" = """Abre a lista e depois anda por ela. Andar não escolhe, então a resposta fica intocada."""
"component.select.key.enter.name" = "Enter"
"component.select.key.enter.action" = """Escolhe a opção da lista. Fecha, a menos que vários possam ser escolhidos. Com `creatable`, adiciona o que foi digitado."""
"component.select.key.space.name" = "Espaço"
"component.select.key.space.action" = """Escolhe sem fechar, numa lista sem caixa de filtro. Onde há uma, Enter é o caminho para um segundo valor."""
"component.select.key.home-or-end.name" = "Home ou End"
"component.select.key.home-or-end.action" = """Salta para a primeira ou a última opção. Com algo digitado na caixa de filtro, elas são do cursor."""
"component.select.key.escape.name" = """Escape"""
"component.select.key.escape.action" = """Fecha a lista, descarta o filtro e devolve o foco ao controle. Nunca muda a resposta."""
"component.select.key.tab.name" = "Tab"
"component.select.key.tab.action" = """Fecha a lista e sai. O que estava destacado não é escolhido ao sair."""
"component.select-group.guidance" = """Use um grupo de opções dentro de um `Select` quando as opções se dividem em trechos nomeados, como países por continente. Um grupo com uma opção só é um título sobre uma linha."""
"component.select-group.a11y-notes" = """O nome vem do atributo `label`, que um leitor de tela lê antes da primeira opção do trecho. Ele não pode ser um elemento `<label>`, porque `<optgroup>` não aceita filhos além de `<option>`."""
"component.select-group.prop.label.doc" = """O nome do trecho, na língua de quem lê. Obrigatório, porque um `<optgroup>` sem ele é um recuo sem nada em cima."""
"component.select-group.prop.disabled.doc" = """Desabilita todas as opções do trecho de uma vez, pela cascata do próprio navegador. Nada aqui percorre os filhos."""
"component.select-group.prop.children.doc" = """As opções do trecho."""
"component.select-option.guidance" = """Use uma opção de select para um dos valores que um `Select` oferece. Uma segunda linha, um ícone ou uma cor viajam em um atributo `data-`. O controle nativo mostra o rótulo, e a lista aprimorada desenha o resto."""
"component.select-option.a11y-notes" = """`data-nd-detail` passa a fazer parte do nome acessível da opção desenhada. `data-nd-icon` e `data-nd-swatch` são decorativos e ficam escondidos da tecnologia assistiva."""
"component.select-option.prop.value.doc" = """O valor enviado quando esta opção é escolhida. Obrigatório em vez de cair no rótulo, porque o rótulo é traduzido e enviaria uma string diferente em cada locale."""
"component.select-option.prop.label.doc" = """O texto visível desta opção. É o próprio texto do `<option>`, então o controle nativo e a lista aprimorada mostram as mesmas palavras."""
"component.select-option.prop.detail.doc" = """Uma segunda linha mais discreta sob o rótulo, para o que separa duas opções parecidas. Só a lista aprimorada a desenha, e ali ela faz parte do nome acessível da opção."""
"component.select-option.prop.icon.doc" = """Um glifo exibido ao lado do rótulo, vindo do conjunto de ícones. Nunca a única coisa que distingue uma opção, porque o controle nativo mostra só o texto."""
"component.select-option.prop.swatch.doc" = """Um nome de paleta, desenhado como um chip de cor ao lado do rótulo. Usa o mecanismo do `Swatch`: o chip leva `data-palette` e tira a cor daquele escopo, então nenhuma cor é nomeada aqui."""
"component.select-option.prop.selected.doc" = """Se esta opção começa escolhida. O atributo é omitido quando falso, porque o HTML lê a presença dele e não o valor."""
"component.select-option.prop.disabled.doc" = """Impede que a pessoa escolha esta opção, mantendo-a na lista, então ela fica visível e indisponível em vez de ausente."""
"component.checkbox.guidance" = """Use uma caixa de seleção quando a pessoa puder marcar quantas opções quiser, inclusive nenhuma. Para uma configuração que passa a valer assim que é acionada, use `Switch`. Para uma opção entre poucas, use `Segmented`."""
"component.checkbox.a11y-notes" = """O componente renderiza um `<input type="checkbox">` real, que fornece o papel, o estado e o teclado. O input é transparente e fica sobre a caixa desenhada, então permanece na árvore de acessibilidade."""
"component.checkbox.prop.name.doc" = """O nome do campo no formulário. Todas as caixas que respondem à mesma pergunta usam o mesmo nome. O componente monta os ids do rótulo e do input a partir dele."""
"component.checkbox.prop.value.doc" = """O valor enviado quando a caixa está marcada. Obrigatório, porque uma caixa sem valor envia a string `on`."""
"component.checkbox.prop.label.doc" = """O texto visível desta opção. É renderizado como `<label for>`, então tocar nas palavras marca a caixa."""
"component.checkbox.prop.hint.doc" = """Orientação extra exibida sob o rótulo. É ligada por `aria-describedby`, então um leitor de tela a lê depois do rótulo."""
"component.checkbox.prop.checked.doc" = """Se a caixa começa marcada. O atributo é omitido quando falso, porque o HTML lê a presença dele e não o valor."""
"component.checkbox.prop.disabled.doc" = """Impede que a pessoa marque esta opção. Usa o atributo `disabled` real, que também mantém o valor fora do envio do formulário."""
"component.checkbox.prop.invalid.doc" = """Marca esta opção como inválida. Para marcar a pergunta inteira como inválida, use `Fieldset { error }`."""
"component.checkbox.prop.size.doc" = """O tamanho da caixa desenhada: 40, 32 ou 24 pixels. A área de toque continua em 44 pixels em todos os tamanhos."""
"component.checkbox.prop.hide_label.doc" = """Esconde o rótulo visualmente e o mantém como nome acessível. Use em uma caixa de selecionar tudo no cabeçalho de uma tabela. `label` continua obrigatório."""
"component.checkbox.prop.divider.doc" = """Uma palavra exibida acima desta opção para separá-la das anteriores, como `ou`. Informe na língua de quem lê."""
"component.checkbox.prop.exclusive.doc" = """Torna esta a opção nenhuma das anteriores. Marcá-la desmarca todas as outras do grupo, e marcar qualquer outra desmarca esta."""
"component.checkbox.prop.reveal.doc" = """Se marcar esta opção revela o bloco dentro dela. Declare explicitamente para que as duas implementações se comportem igual."""
"component.checkbox.prop.children.doc" = """A pergunta seguinte, revelada quando esta opção é marcada. Renderiza com ou sem script."""
"component.checkbox.state.expanded.doc" = """Se o bloco revelado está visível. O script escreve o atributo. Sem script o bloco fica sempre visível e o atributo não aparece."""
"component.checkbox.key.space.name" = "Espaço"
"component.checkbox.key.space.action" = """Marca ou desmarca a caixa. É o comportamento próprio do navegador."""
"component.radio.guidance" = """Use um radio quando a pessoa escolhe exatamente uma resposta e todas devem ficar visíveis na página. Para uma opção entre muitas, use `Select`. Para trocar de visualização, use `Segmented`."""
"component.radio.a11y-notes" = """O componente renderiza um `<input type="radio">` real que compartilha um `name` com o grupo. Isso fornece o agrupamento, as setas e a parada única de tabulação. Um radio não pode ser desmarcado depois de marcado."""
"component.radio.prop.name.doc" = """O nome do campo no formulário. Todos os radios que respondem à mesma pergunta usam o mesmo nome, o que os torna um grupo no navegador. O componente monta os ids do rótulo e do input a partir dele."""
"component.radio.prop.value.doc" = """O valor enviado quando este radio é escolhido. Obrigatório, porque um radio sem valor envia a string `on`."""
"component.radio.prop.label.doc" = """O texto visível desta resposta. É renderizado como `<label for>`, então tocar nas palavras escolhe a resposta."""
"component.radio.prop.hint.doc" = """Orientação extra exibida sob o rótulo. É ligada por `aria-describedby`, então um leitor de tela a lê depois do rótulo."""
"component.radio.prop.checked.doc" = """Se este radio começa escolhido. No máximo um do grupo pode declarar isso, e um grupo em que nenhum declara começa sem resposta."""
"component.radio.prop.disabled.doc" = """Impede que a pessoa escolha esta resposta. Usa o atributo `disabled` real, que também mantém o valor fora do envio do formulário."""
"component.radio.prop.invalid.doc" = """Marca esta resposta como inválida. Para marcar a pergunta inteira como inválida, use `Fieldset { error }`."""
"component.radio.prop.size.doc" = """O tamanho do círculo desenhado: 40, 32 ou 24 pixels, igual ao `Checkbox`. A área de toque continua em 44 pixels em todos os tamanhos."""
"component.radio.prop.hide_label.doc" = """Esconde o rótulo visualmente e o mantém como nome acessível. Use onde a linha em volta já diz qual é a resposta. `label` continua obrigatório."""
"component.radio.prop.divider.doc" = """Uma palavra exibida acima desta resposta para separá-la das anteriores, como `ou`. Informe na língua de quem lê."""
"component.radio.prop.reveal.doc" = """Se escolher esta resposta revela o bloco dentro dela. Declare explicitamente para que as duas implementações se comportem igual."""
"component.radio.prop.children.doc" = """A pergunta seguinte, revelada quando esta resposta é escolhida. Renderiza com ou sem script."""
"component.radio.state.expanded.doc" = """Se o bloco revelado está visível. O script escreve o atributo. Sem script o bloco fica sempre visível e o atributo não aparece."""
"component.radio.key.arrow-keys.name" = "Setas"
"component.radio.key.arrow-keys.action" = """Move entre as respostas do grupo e escolhe ao passar. É o comportamento próprio do navegador."""
"component.radio.key.space.name" = "Espaço"
"component.radio.key.space.action" = """Escolhe a resposta que está em foco."""
"component.fieldset.guidance" = """Use um fieldset em volta de um grupo de controles que responde a uma pergunta, como um conjunto de rádios ou de caixas de seleção. Não use em volta de um único campo, que já tem rótulo próprio. Para uma data, use `DateInput`."""
"component.fieldset.a11y-notes" = """Um `<fieldset>` com `<legend>`, e não `role="group"` em uma `<div>`, para a legenda ser lida com cada controle do grupo. `aria-describedby` nomeia a dica e o erro, que é um `role="alert"`."""
"component.fieldset.prop.name.doc" = """O nome da pergunta, e a raiz dos ids dentro dela. Use a mesma palavra que os controles levam como `name`, para a dica e o erro pertencerem ao grupo que está sendo respondido."""
"component.fieldset.prop.legend.doc" = """A pergunta, na língua de quem lê. **Obrigatória**, porque um fieldset sem legenda anuncia um grupo sem dizer para que o grupo serve."""
"component.fieldset.prop.hint.doc" = """O que quem lê precisa saber antes de responder, como quantas opções escolher. Fica sob a legenda e acima dos controles, então é lida antes de ser necessária."""
"component.fieldset.prop.error.doc" = """O que está errado na resposta, na língua de quem lê. A presença dela marca o grupo como inválido. Não há uma segunda flag para manter em sincronia."""
"component.fieldset.prop.error_label.doc" = """A palavra anunciada antes da mensagem, como `Erro:`. É escondida visualmente, porque tudo o que está na tela já marca a mensagem como erro."""
"component.fieldset.prop.heading.doc" = """Se a legenda também é o título da página, para uma página que faz uma pergunta só. Desligado por padrão. A legenda continua legenda e é envolvida pelo título, então a pergunta segue presa aos controles."""
"component.fieldset.prop.inline.doc" = """Se as escolhas ficam em uma linha em vez de descer a página. Desligado por padrão. Use para duas ou três respostas curtas, como sim e não, e não para uma lista que precisa ser percorrida."""
"component.fieldset.prop.disabled.doc" = """Desabilita de uma vez todos os controles dentro dele. Desligado por padrão. `<fieldset disabled>` é a cascata própria do navegador, então nada aqui percorre os filhos e nada pode esquecer um."""
"component.fieldset.prop.children.doc" = """Os controles com que esta pergunta é respondida."""
"component.fieldset.state.invalid.doc" = """Se o grupo está em erro. É derivado de `error` estar presente e não declarado ao lado, então a linha vermelha e a frase não podem aparecer uma sem a outra."""
"component.abbr.a11y-notes" = """O `title` não aparece numa tela sensível ao toque, onde não há hover. Escreva o significado por extenso na primeira vez. O atributo ajuda quem usa ponteiro e nunca é o único caminho para o sentido."""
"component.abbr.prop.title.doc" = """As palavras que a abreviatura representa, escritas no atributo `title`. Informe sempre, porque uma abreviatura sem o significado é só um texto pequeno."""
"component.abbr.prop.children.doc" = """A abreviatura, como ela aparece na frase."""
"component.blockquote.prop.cite.doc" = """Uma URL para a fonte. É lida por máquinas e não é mostrada a quem lê."""
"component.blockquote.prop.tone.doc" = "Se o traço ao lado dela assume a cor de destaque."
"component.blockquote.prop.attribution.doc" = """Quem disse, renderizado como um `<footer>` com um `<cite>` dentro. O `cite` acima é uma URL para máquinas, e esta é a linha que a pessoa vê."""
"component.blockquote.prop.children.doc" = "A citação."
"component.blockquote.prop.glass.doc" = """Fosca a superfície da própria citação, deixando sólido o traço ao lado."""
"component.button.guidance" = """Use um botão para uma ação que acontece na página em que a pessoa já está. Para um controle que muda o endereço, informe `href` e ele renderiza como `<a>`. Para um valor que fica escolhido, use `Segmented` ou `Select`."""
"component.button.a11y-notes" = """`label` é obrigatório e é o texto visível e o nome acessível, então nenhum botão aqui fica sem nome. `aria-pressed` e `aria-expanded` só são escritos quando verdadeiros. `disabled` remove a parada de tabulação."""
"component.button.prop.label.doc" = """O texto do controle, na língua de quem lê. É o texto visível **e** o nome acessível ao mesmo tempo, então os dois não podem divergir. Obrigatório."""
"component.button.prop.detail.doc" = """Uma segunda linha, menor, sob o rótulo, para a escolha cuja consequência precisa ser dita. Faz parte do nome acessível, então quem não a vê ainda a ouve."""
"component.button.prop.variant.doc" = """Quanta atenção da página o controle pede, de `solid` no topo a `link` e `nav` embaixo. Use **um `solid` por tela**. `nav` é a linha da barra lateral, mais quieta que `transparent` e com forma de linha. `solid` por padrão."""
"component.button.prop.tone.doc" = """Que tipo de ação é: `accent` a comum, `neutral` a quieta, `danger` a destrutiva, `success` a de confirmação. Cada tom já tem um primeiro plano legível resolvido contra ele. **Nunca o único sinal** (`NOCTUA.md §8.8.6`)."""
"component.button.prop.size.doc" = """O tamanho do controle como área de toque: `small`, `medium` ou `large`. Os três passam do alvo mínimo de 24 pixels da WCAG 2.5.8. `large` também passa dos 44 pixels, para uma tela usada com o polegar."""
"component.button.prop.shape.doc" = """Os cantos: `rounded`, `pill`, `square` ou `bevel`. Os três primeiros seguem a predefinição de cantos que a pessoa escolheu. `bevel` corta o canto num ângulo fixo sob qualquer predefinição. Use uma forma só numa linha de controles."""
"component.button.prop.icon.doc" = """Um ícone antes do rótulo. É decoração e fica escondido de leitores de tela, porque repete o rótulo. É centrado opticamente no texto, e nas duas linhas juntas quando há `detail`."""
"component.button.prop.icon_end.doc" = """Um ícone depois do rótulo, para uma direção ou um destino. Use um ícone decorativo, e não um de cada lado."""
"component.button.prop.icon_alt.doc" = """O ícone que um alternador mostra enquanto está pressionado. Os dois glifos são renderizados e o estado escolhe um, então nenhum script precisa trocá-los. Use junto com `icon`."""
"component.button.prop.label_alt.doc" = """O nome que o controle assume enquanto está pressionado ou expandido. Sem ele, um alternador mantém um nome só e anuncia o estado errado a partir do primeiro toque."""
"component.button.prop.action.doc" = """Um nome pelo qual um script encontra este botão. Use quando o comportamento é código de quem chama, como um alternador. Um botão que envia um formulário ou segue um link não precisa de gancho."""
"component.button.prop.hide_label.doc" = """Esconde o rótulo e renderiza só o ícone. `label` continua obrigatório e continua nomeando o controle, porque um botão só de ícone sem nome anuncia apenas o papel dele."""
"component.button.prop.justify.doc" = """Onde o conteúdo fica quando sobra largura no botão: `center`, `start` ou `between`. Isso acontece com `fill` ou numa linha esticada. `start` serve ao botão composto, e `between` empurra o ícone final para a borda."""
"component.button.prop.wrap.doc" = """Se o rótulo pode ocupar mais de uma linha. Desligado por padrão, porque um botão que cresce uma linha empurra para baixo tudo o que está embaixo dele. Um rótulo longo demais quase sempre quer `detail`."""
"component.button.prop.fill.doc" = """Estica o controle até a largura do que o contém. Desligado por padrão."""
"component.button.prop.menu.doc" = """Marca o botão como o que abre um `Menu`, e desenha o chevron. **`controls` precisa nomear esse menu por id.** O toque em si é o `dist/menu.js`, que traz a abertura, o percurso das setas, o Escape e a volta do foco."""
"component.button.prop.href.doc" = """Para onde o controle vai. Com ele, o componente renderiza um `<a>` em vez de um `<button>`, que é o que um controle que muda o endereço tem de ser. Nunca combine com `disabled`."""
"component.button.prop.rel.doc" = """A relação do link. Deixada em branco junto com `target`, o componente escreve `noopener noreferrer` sozinho."""
"component.button.prop.target.doc" = """Onde o link abre. Abrir uma nova janela tira a decisão da pessoa, então precisa de um motivo."""
"component.button.prop.pressed.doc" = """Se este alternador está ligado. Um alternador é um botão cujo estado permanece depois do toque, como silenciado, fixado ou inscrito. Só é escrito quando verdadeiro, porque `aria-pressed="false"` marca um botão comum como alternador desligado."""
"component.button.prop.expanded.doc" = """Se o que este controle abre está visível. Só é escrito quando verdadeiro, pelo mesmo motivo de `pressed`."""
"component.button.prop.controls.doc" = """O id do que este controle abre ou governa."""
"component.button.prop.current.doc" = """Marca a única entrada de uma navegação que é a página sendo lida. É escrito como `aria-current="page"`, então é anunciado além de desenhado."""
"component.button.prop.disabled.doc" = """Impede o toque no controle, e o tira da ordem de tabulação junto. Quem usa teclado não consegue chegar até ele para descobrir por quê. Onde o motivo importa, renderize algo que o dê. `MenuItem` escolhe o contrário."""
"component.button.prop.name.doc" = """O campo sob o qual este botão é enviado quando ele envia o formulário. É como um formulário com vários botões de envio registra qual foi pressionado, **sem script nenhum**. Só um botão que envia tem um."""
"component.button.prop.value.doc" = """O valor que esse campo envia. Informe junto com `name`, porque um botão nomeado sem valor envia a string vazia. Nunca use o rótulo visível, que é uma string diferente em cada locale."""
"component.tag.guidance" = """Use uma tag para um valor ou para um rótulo sobre ele, como uma palavra-chave num registro ou um status ao lado de um título. Para um controle que faz algo, use `Button`. Para uma contagem no canto de um controle, use `Badge`."""
"component.tag.a11y-notes" = """Sem `href`, sem `pressed` e sem `remove_label` a tag é um `<span>` sem papel e sem parada de tabulação. O controle de remoção fica ao lado do texto em vez de envolvê-lo."""
"component.tag.prop.label.doc" = """O texto visível da tag, na língua de quem lê. É texto e não filhos porque um `TagPicker` clona a tag e escreve dentro dela. Também é dele que o controle de remoção tira o nome."""
"component.tag.prop.value.doc" = """O valor que um script ou um formulário lê para esta tag, quando não é o texto dela. Sem ele o texto é o valor."""
"component.tag.prop.href.doc" = """Para onde a tag leva. Torna a tag um `<a>` real. O botão do meio do mouse, o menu de contexto e a lista de links de um leitor de tela funcionam."""
"component.tag.prop.pressed.doc" = """Se a tag está ligada, para o formato de chip de filtro. **Só de declarar** já torna a tag um `<button aria-pressed>` real. Deixá-la de fora deixa um rótulo que não é um controle."""
"component.tag.prop.tone.doc" = """De qual tom do sistema de cores a tag é pintada. A paleta declara 349 famílias semânticas, então `overdue` vale tanto quanto `danger`. Um nome que nenhuma família declara quebra o build. Sem ele a tag fica neutra."""
"component.tag.prop.variant.doc" = """Com que força a tag é pintada. `soft` é um campo tingido, `solid` é o tom em força total, e `outline` é um fio sem preenchimento. `soft` por padrão."""
"component.tag.prop.size.doc" = """O tamanho da tag, igual ao `Button` passo a passo, para que uma tag ao lado de um botão fique alinhada. `large` atinge o alvo ampliado de 44 pixels da WCAG 2.5.8."""
"component.tag.prop.shape.doc" = """Os cantos da tag, vindos da predefinição de raio em vigor: `pill`, `rounded` ou `square`. `pill` por padrão."""
"component.tag.prop.icon.doc" = """Um glifo exibido antes do texto. É decorativo, porque o texto ao lado é o nome acessível."""
"component.tag.prop.swatch.doc" = """Um nome de paleta, desenhado como um `Swatch` real antes do texto. O chip resolve o destaque dentro do próprio escopo, que é o mecanismo do `ThemeScope` e o único que `NOCTUA.md §8.8` permite."""
"component.tag.prop.image.doc" = """Uma imagem exibida antes do texto, como um rosto ou um favicon. O texto alternativo é vazio, porque o texto ao lado é o nome. A caixa assume o tamanho da tag, e uma URL que falha não desenha nada."""
"component.tag.prop.remove_label.doc" = """O nome acessível do controle que remove esta tag, com um buraco `{label}` para o texto. **Declará-lo é o que adiciona o controle**, como em `CodeBlock { copy }`."""
"component.tag.prop.remove_name.doc" = """O campo sob o qual o controle de remoção envia, em um formulário. Com ele o controle é um `<button type="submit" name value>` real e funciona sem script. Sem ele é um `<button type="button">`."""
"component.tag.prop.disabled.doc" = """Impede que a pessoa acione o controle da tag, quando ela tem um. Escreve o atributo `disabled` real no botão, e nada na forma `<span>`."""
"component.tag.prop.glass.doc" = """Fosca a tag. Use para uma tag sobre uma fotografia, em vez de em uma fileira de tags."""
"component.tag.key.enter.name" = "Enter"
"component.tag.key.enter.action" = """Segue a tag quando ela é um link, ou a pressiona quando é um alternador. É o comportamento próprio do elemento."""
"component.tag.key.space.name" = "Espaço"
"component.tag.key.space.action" = """Pressiona a tag quando ela é um alternador. É o comportamento próprio de um `<button>`."""
"component.tag.key.tab.name" = "Tab"
"component.tag.key.tab.action" = """Alcança a tag e depois o controle de remoção dela. São duas paradas de tabulação separadas."""
"component.badge.guidance" = """Use um selo para pôr uma contagem ou um ponto no canto de outro controle, como onze mensagens não lidas ou três builds falhando. Ele envolve o controle que marca, então precisa de filhos, e `label` é obrigatório."""
"component.badge.a11y-notes" = """A marca carrega `aria-hidden` e `label` é um nó de texto escondido, então o leitor de tela lê *Notificações, 3 mensagens não lidas*. O invólucro não acrescenta papel, e isto não é uma região dinâmica."""
"component.badge.prop.label.doc" = """O que a contagem significa, como frase inteira: *3 mensagens não lidas*, não *3*. **Obrigatório**, porque os dígitos carregam `aria-hidden` e é isto que o leitor de tela lê depois do nome do que estiver dentro."""
"component.badge.prop.count.doc" = """O número a desenhar. Texto em vez de número, para que `1,2 mil` seja possível e a prop atravesse as duas linguagens sem mudar. Ausente não desenha nada, a menos que `dot` peça uma marca."""
"component.badge.prop.max.doc" = """O maior número que vale desenhar. Acima dele a marca lê `{max}+`, o que impede um selo de quatro dígitos de ficar mais largo que o controle. Os dois são comparados numericamente quando ambos são números."""
"component.badge.prop.dot.doc" = """Se um ponto é desenhado em vez de um número, dizendo que algo mudou sem dizer quanto. Use quando a contagem é desconhecida ou não importa. `label` ainda tem de dizer o que mudou."""
"component.badge.prop.show_zero.doc" = """Se uma contagem de zero é desenhada. Desligado por padrão, então nada a relatar não desenha selo nenhum. Ligue num painel, onde o zero é uma resposta de verdade e um selo ausente seria lido como falha."""
"component.badge.prop.tone.doc" = """De qual tom do sistema de cores o selo é pintado, nomeado em vez de escolhido numa lista fechada. As 349 famílias estão em `noctua_design::tones`, mais `neutral` e `muted`. Um nome que nenhuma família declara quebra o build."""
"component.badge.prop.placement.doc" = """Em qual canto a marca fica. Os valores são lógicos em vez de esquerda e direita, então a marca passa para o outro canto numa página da direita para a esquerda."""
"component.badge.prop.overlap.doc" = """O formato do que está por baixo, que decide o quanto encaixar a marca para dentro. O canto de um círculo fica mais longe da borda que o de um retângulo, então um selo ajustado para um fica errado no outro."""
"component.badge.prop.children.doc" = """O controle que está sendo marcado, como um botão, um avatar ou um ícone. Obrigatório na prática, porque este componente desenha um canto e um canto precisa de algo em que ficar."""
"component.button.prop.submit.doc" = """O atributo `type`: `button`, `submit` ou `reset`. `button` por padrão, porque um `type` não declarado dentro de um formulário é `submit`. Não há grade de variantes, porque `type` não tem aparência."""
"component.button.prop.glass.doc" = """Fosca o controle em vez de preenchê-lo. O tom vai para a tinta e a borda, e o que está atrás do controle transparece. Use só onde há alguma coisa atrás."""
"component.button.key.enter.name" = "Enter"
"component.button.key.enter.action" = """Aciona o controle. A forma de botão e a forma de link respondem."""
"component.button.key.space.name" = "Espaço"
"component.button.key.space.action" = """Aciona o controle. Só a forma `<button>`, porque um link responde só ao Enter."""
"component.button-group.guidance" = """Use um grupo de botões para dois ou mais botões que são uma decisão só, como um botão dividido ou uma fileira de ações. Para um valor escolhido de uma lista, use `Segmented`, que marca um membro como escolhido."""
"component.button-group.a11y-notes" = """A raiz carrega `role="group"` e não `toolbar`. Uma toolbar é uma única parada de tabulação percorrida com as setas, e estes são botões comuns que a pessoa percorre com Tab. Nomeie com `label` ou com `labelledby`, nunca com os dois."""
"component.button-group.prop.label.doc" = """O nome acessível do grupo, dizendo para que servem os botões. Obrigatório, a não ser que `labelledby` o nomeie, porque um `role="group"` sem nome dá ao leitor de tela só a palavra `group`."""
"component.button-group.prop.labelledby.doc" = "O id do elemento que nomeia este grupo, quando o nome já está visível na página."
"component.button-group.prop.attached.doc" = """Se os botões compartilham um contorno só, com os cantos internos quadrados. Desligado, eles ficam separados, para ações que são relacionadas mas independentes."""
"component.button-group.prop.orientation.doc" = "Em que direção os botões correm. Vertical os empilha e move as bordas compartilhadas para o topo e a base."
"component.button-group.prop.fill.doc" = "Estica o grupo pelo contêiner e dá a cada botão uma fatia igual dele."
"component.button-group.prop.children.doc" = "Os botões."
"component.switch.guidance" = """Use um switch para uma configuração que está ligada ou desligada e passa a valer na hora. Para um valor entre três ou mais, use `Segmented`. Para um campo enviado depois com o resto do formulário, use `Checkbox`."""
"component.switch.a11y-notes" = """O controle carrega `role="switch"` e não o papel de caixa de seleção, que é para um valor que será enviado. O `aria-checked` é sempre escrito, `true` ou `false`, e o `aria-disabled` mantém um switch desabilitado na ordem de tabulação."""
"component.switch.prop.name.doc" = """O nome da configuração que o switch liga e desliga. O script se liga a ele do mesmo jeito que se liga a um `Segmented`, então um handler só serve aos dois."""
"component.switch.prop.label.doc" = """O que o switch liga, na língua de quem lê. É o nome acessível e o texto visível ao lado do controle."""
"component.switch.prop.on.doc" = """O valor que significa ligado. É lido do modelo no ponto de chamada e não presumido aqui, porque uma configuração pode escrever os dois valores com quaisquer palavras."""
"component.switch.prop.off.doc" = """O valor que significa desligado. O script envia aquele dos dois que não está em vigor, então nenhum valor é composto em lugar nenhum."""
"component.switch.prop.checked.doc" = """Se o switch está ligado. Sempre escrito, `true` ou `false`, porque um `role="switch"` sem ele deixa o estado desconhecido para a tecnologia assistiva."""
"component.switch.prop.describedby.doc" = """O id da frase que explica o que o switch faz. É ligada por `aria-describedby`, então um leitor de tela a lê depois do nome."""
"component.switch.prop.size.doc" = """O tamanho da caixa do controle, e com ela do trilho e do botão. Os dois valores passam do alvo mínimo de 24px da WCAG 2.5.8."""
"component.switch.prop.disabled.doc" = """Impede que a pessoa mude a configuração. Usa `aria-disabled`, então o switch continua alcançável e dá para descobrir que a configuração existe."""
"component.switch.prop.glass.doc" = """Fosca a trilha. A alça continua sólida, porque é a posição dela que carrega o estado."""
"component.switch.key.space-or-enter.name" = "Espaço ou Enter"
"component.switch.key.space-or-enter.action" = """Liga ou desliga o switch. As duas teclas funcionam, porque o controle é um `<button>`."""
"component.swatch.guidance" = """Use um swatch para mostrar uma cor ao lado da palavra que a nomeia. Nunca sozinho, porque o chip não tem nome acessível próprio."""
"component.swatch.a11y-notes" = """O chip é sempre `aria-hidden` e não tem nome acessível. Quem o contém fornece o nome."""
"component.swatch.prop.palette.doc" = """De qual paleta o chip mostra o destaque. Sem ela o chip mostra o tema que chegar até ele, o que faz dele um indicador sempre atual do destaque em vigor."""
"component.swatch.prop.size.doc" = """O tamanho do chip: `small`, `medium` ou `large`. `medium` por padrão."""
"component.swatch.prop.shape.doc" = """Os cantos do chip: `pill`, `rounded` ou `square`. `pill` por padrão, e `square` serve a um chip que representa um tema inteiro em vez de um destaque."""
"component.segmented.guidance" = """Use um controle segmentado para escolher um **valor** entre um conjunto curto e fixo, todo visível de uma vez. Para revelar um **painel** em vez de responder uma pergunta, use `Tabs`. Para botões sem membro escolhido, use `ButtonGroup`."""
"component.segmented.a11y-notes" = """Uma parada de tabulação para o grupo inteiro. O grupo a carrega na marcação e o script a move para o item escolhido, então um grupo sem nada escolhido também é alcançável. A seleção segue o foco, e todo item carrega `aria-checked`."""
"component.segmented.prop.name.doc" = "O que está sendo escolhido. O script se liga a isto, e todo item do grupo repete a mesma palavra."
"component.segmented.prop.label.doc" = """O nome acessível do grupo. Obrigatório, a não ser que `labelledby` o nomeie, porque um radiogroup sem nome dá ao leitor de tela só o papel dele."""
"component.segmented.prop.labelledby.doc" = """O id do elemento que nomeia este grupo, quando o nome já está visível na página. Prefira-o ao `label` nesse caso, porque um `aria-label` ao lado de um nome visível pode divergir dele."""
"component.segmented.prop.appearance.doc" = """`joined` desenha uma caixa só com bordas compartilhadas, que é o controle segmentado clássico. `spread` dá a cada item a própria caixa, que sobrevive à quebra em duas linhas onde uma caixa única se desmancharia."""
"component.segmented.prop.size.doc" = """O tamanho da caixa do item. Os três passam do alvo mínimo de 24px da WCAG 2.5.8, e `large` também atende ao alvo ampliado de 44px."""
"component.segmented.prop.shape.doc" = """Os cantos, nas mesmas quatro palavras que o `Button` usa. Dê ao grupo a mesma forma dos outros controles da fileira."""
"component.segmented.prop.orientation.doc" = """Para que lado os itens correm, e portanto que setas movem entre eles. É escrito em `aria-orientation`, então a tecnologia assistiva também informa o eixo."""
"component.segmented.prop.fill.doc" = """`hug` deixa cada item da largura do próprio rótulo. `equal` dá a todos a largura do mais largo, então o grupo não se rearranja quando uma palavra é traduzida. `stretch` faz isso e ocupa o contêiner inteiro."""
"component.segmented.prop.children.doc" = "Os itens."
"component.segmented.prop.glass.doc" = """Fosca a caixa do grupo e não cada opção. Use num controle que flutua sobre conteúdo que ele não pode esconder."""
"component.segmented.prop.selection.doc" = """Com que força o valor escolhido é marcado. `accent` é o padrão e serve para quase todo grupo. `quiet` marca com a superfície e uma borda mais forte, para um grupo que fica numa barra ao lado de outros controles."""
"component.segmented.key.tab.name" = "Tab"
"component.segmented.key.tab.action" = """Entra no grupo uma vez, no item escolhido, e não para em cada item."""
"component.segmented.key.arrow-keys.name" = "Setas"
"component.segmented.key.arrow-keys.action" = """Move para o item seguinte ou anterior e o escolhe. Esquerda e Direita na horizontal, Cima e Baixo na vertical."""
"component.segmented.key.home.name" = "Home"
"component.segmented.key.home.action" = """Vai para o primeiro item e o escolhe."""
"component.segmented.key.end.name" = "End"
"component.segmented.key.end.action" = """Vai para o último item e o escolhe."""
"component.segmented.key.space-or-enter.name" = "Espaço ou Enter"
"component.segmented.key.space-or-enter.action" = """Escolhe o item em foco, para quem chegou com Tab e não com as setas."""
"component.segmented-item.guidance" = """Use só dentro de um `Segmented`. Fora de um, ele é um `role="radio"` sem grupo, o que anuncia um controle pertencente a um conjunto que não existe."""
"component.segmented-item.a11y-notes" = """`aria-checked` está sempre presente, `true` ou `false`, porque um radio que o omite tem estado desconhecido. `aria-disabled` em vez de `disabled` mantém o item na ordem rotativa. O grupo carrega a parada de tabulação."""
"component.segmented-item.prop.value.doc" = """O que escolher este item significa, como identificador. O script lê isto e mais nada, então nunca é traduzido."""
"component.segmented-item.prop.label.doc" = """O que escolher este item significa, na língua de quem lê. **Obrigatório**. Continua sendo o nome acessível mesmo quando `hide_label` tira o texto da tela."""
"component.segmented-item.prop.selected.doc" = """Se este é o valor em vigor. Desligado por padrão. Renderize do padrão conhecido no servidor, para quem lê chegar a um grupo que já declara a resposta dele."""
"component.segmented-item.prop.icon.doc" = """Um ícone ao lado do rótulo, ou no lugar dele com `hide_label`. É `aria-hidden` dos dois jeitos, porque repete o rótulo e anunciar os dois diz a mesma coisa duas vezes."""
"component.segmented-item.prop.hide_label.doc" = """Se o texto sai da tela enquanto o nome fica. Desligado por padrão. Use para uma fileira de ícones cujo sentido é claro à vista e ainda precisa ser anunciado pelo nome."""
"component.segmented-item.prop.disabled.doc" = """Se a escolha é recusada. Desligado por padrão. O item continua alcançável, para quem lê descobrir que ele existe e está recusado em vez de encontrar um vazio."""
"component.segmented-item.prop.children.doc" = """Conteúdo mostrado antes do rótulo, para a única coisa que um ícone não pode ser: uma cor. `Swatch` é o que vai aqui. O rótulo continua nomeando o item."""
"component.segmented-item.prop.glass.doc" = """Fosca a caixa de cada opção. Desligado por padrão. A opção escolhida mantém a camada de cor sobre o fosco, para ainda ficar claro qual valor está em vigor."""
"component.segmented-item.prop.detail.doc" = """Uma segunda linha, menor, sob o rótulo, como a unidade sob o número. Faz parte do nome acessível, porque quem não vê a pilha tem só a primeira linha."""
"component.code.prop.tone.doc" = """O quanto o fragmento se destaca do texto ao redor. `default` é o contraste normal e `subtle` é mais discreto."""
"component.code.prop.children.doc" = "O código."
"component.del.a11y-notes" = """A maioria dos leitores de tela não anuncia o tachado, então o texto removido soa igual ao texto atual. `label` é a palavra que diz que ele foi removido, e é necessária quando a remoção carrega sentido."""
"component.del.prop.cite.doc" = """Uma URL que explica a mudança."""
"component.del.prop.datetime.doc" = """Quando o texto foi removido, como um carimbo de data e hora legível por máquina."""
"component.del.prop.label.doc" = """Uma palavra lida antes do texto para dizer que ele foi removido. Informe na língua de quem lê, porque este pacote não traz nenhuma palavra própria."""
"component.del.prop.children.doc" = """O texto removido."""
"component.disclosure.guidance" = """Use um disclosure para recolher conteúdo atrás de um controle que o abre. Ele renderiza `<details>`, então o conteúdo fica no fluxo e abrir empurra a página para baixo. Para uma superfície que flutua sobre a página, use `Menu`."""
"component.disclosure.a11y-notes" = """O componente renderiza `<details>` e `<summary>`, que fornecem o papel, o estado e o teclado em todos os motores. Abrir não move foco e não prende nenhum."""
"component.disclosure.prop.summary.doc" = """O texto do controle, que também é o nome acessível dele."""
"component.disclosure.prop.name.doc" = """O identificador que um script usa para achar este disclosure. É escrito em `data-nd-disclosure`. Um disclosure sem script atrás dele não precisa de um."""
"component.disclosure.prop.icon.doc" = """Um ícone exibido no lugar do texto do resumo. `summary` continua obrigatório e vira o nome acessível."""
"component.disclosure.prop.open.doc" = """Se o disclosure começa aberto. Renderizado na marcação e não aplicado por script, porque abrir depois de a página pintar move o conteúdo abaixo dele."""
"component.disclosure.prop.marker.doc" = """Se o chevron é desenhado. Desligue para um controle que já é um ícone."""
"component.disclosure.prop.heading.doc" = """Torna o resumo um título de verdade dentro de `<summary>`, no nível 2, 3 ou 4. Use quando o disclosure for uma seção da página. Assim a seção mantém o lugar dela no sumário pelo qual um leitor de tela navega."""
"component.disclosure.prop.children.doc" = """O conteúdo."""
"component.disclosure.prop.glass.doc" = """Se o controle é fosco. Vale para o resumo e o painel juntos, então os dois carregam o mesmo material."""
"component.disclosure.key.space-or-enter.name" = "Espaço ou Enter"
"component.disclosure.key.space-or-enter.action" = """Abre e fecha o disclosure, a partir do resumo. É o comportamento próprio do navegador."""
"component.em.a11y-notes" = """`em` marca ênfase de entonação e `strong` marca importância. Um leitor de tela pode pronunciá-los de formas diferentes, então use cada um com o sentido próprio dele."""
"component.em.prop.children.doc" = "O texto enfatizado."
"component.heading.a11y-notes" = """O nível não pode pular. Um `<h2>` seguido de um `<h4>` deixa um buraco no sumário pelo qual um leitor de tela navega. Escolha o nível pelo documento e o tamanho pelo desenho."""
"component.heading.prop.level.doc" = """O nível na estrutura do documento, de `1` a `6`, renderizado como `<h1>` a `<h6>`. Isto é estrutura, não aparência."""
"component.heading.prop.size.doc" = """O tamanho visual, vindo da escala tipográfica: `display`, `h1`, `h2`, `h3`, `h4` ou `lead`. Independente do `level`."""
"component.heading.prop.tone.doc" = """O quanto o título se destaca. `muted` serve a um título sobre material de apoio, e `accent` serve a um título que também é um sinal."""
"component.heading.prop.balance.doc" = """Se o comprimento das linhas é equilibrado. Para um título que quebra em mais de uma linha."""
"component.heading.prop.children.doc" = """O texto do título."""
"component.ins.a11y-notes" = """Leitores de tela não anunciam o sublinhado, então o texto inserido é lido como o texto ao redor. Use `label` para declarar que ele foi adicionado."""
"component.ins.prop.cite.doc" = "Uma URL que explica a mudança."
"component.ins.prop.datetime.doc" = """Quando foi acrescentado, como um carimbo de data e hora legível por máquina."""
"component.ins.prop.label.doc" = """Uma palavra lida antes do texto para dizer que ele foi adicionado. Informe na língua de quem lê, como em `Del`."""
"component.ins.prop.children.doc" = "O texto acrescentado."
"component.kbd.prop.size.doc" = """O tamanho: `small` ou `body`. Padrão `small`."""
"component.kbd.prop.children.doc" = """O nome da tecla, como `Ctrl` ou `Esc`."""
"component.link.a11y-notes" = """O texto do link é o nome acessível, então precisa fazer sentido fora de contexto. Não dá para navegar com leitor de tela numa página em que todos os links se chamam *aqui*. O ícone de externo carrega `aria-hidden`."""
"component.link.prop.href.doc" = """O destino."""
"component.link.prop.external.doc" = """Se o link sai do site. Desenha um pequeno ícone de link externo depois do texto."""
"component.link.prop.rel.doc" = """O atributo `rel` do link. Use `noreferrer` em tudo que sai do site."""
"component.link.prop.tone.doc" = """A cor do texto do link. `accent` é a cor de link, e `inherit` assume a cor do texto ao redor, para um link dentro de um trecho colorido."""
"component.link.prop.children.doc" = """O texto do link."""
"component.list.a11y-notes" = """`marker: none` remove só o marcador visual. Uma lista em flex e uma sem marcador perdem a semântica em alguns motores, então `list` e `listitem` são declarados de novo. Uma lista de descrição mantém o mapeamento dela."""
"component.list.prop.kind.doc" = """Que tipo de lista renderizar: `unordered` é um `<ul>`, `ordered` um `<ol>`, `description` um `<dl>`. Muda o elemento e não só o marcador, então o leitor de tela anuncia a coisa certa."""
"component.list.prop.marker.doc" = """O marcador de cada item. `none` o remove e mantém a semântica de lista. `default` o desenha, e é o padrão."""
"component.list.prop.spacing.doc" = """O espaço entre os itens: `tight`, `default` ou `loose`."""
"component.list.prop.children.doc" = """Os itens da lista."""
"component.list-item.guidance" = """Use para um item de uma `List`. Dê um `term` quando a lista for uma lista de descrição, e deixe de fora em qualquer outro tipo de lista."""
"component.list-item.a11y-notes" = """Um `<dt>` e o `<dd>` dele precisam ser filhos diretos do `<dl>`, então isto renderiza dois irmãos em vez de envolvê-los. Um invólucro quebra a associação que um leitor de tela lê. O `<li>` declara `listitem` de novo."""
"component.list-item.prop.term.doc" = """A coisa que está sendo descrita. A presença dele troca o item de `<li>` para um `<dt>` e um `<dd>`, que é do que uma lista de descrição é feita."""
"component.list-item.prop.children.doc" = """O item, ou a descrição do termo."""
"component.mark.a11y-notes" = """Um realce que carrega sentido precisa de mais do que uma cor de fundo. A cor sozinha é invisível para quem não a distingue, então isto também muda o peso do texto."""
"component.mark.prop.children.doc" = """O texto realçado."""
"component.paragraph.prop.size.doc" = """O tamanho do texto, vindo da escala tipográfica: `small`, `body` ou `lead`. `body` é o padrão."""
"component.paragraph.prop.tone.doc" = """A intensidade da cor do texto. `muted` é mais discreto que `default`, para um texto que apoia o texto ao redor."""
"component.paragraph.prop.children.doc" = "O texto."
"component.prose.prop.measure.doc" = """Qual limite de comprimento de linha aplicar. `default` é a medida de leitura e `lead` é a mais estreita, para um parágrafo de abertura. `none` serve a uma prosa dentro de uma coluna que já a limita."""
"component.prose.prop.children.doc" = """O conteúdo."""
"component.strong.prop.children.doc" = "O texto importante."
"component.text.prop.size.doc" = """O tamanho, pela escala tipográfica: `caption`, `small`, `body` ou `lead`. Padrão `body`."""
"component.text.prop.weight.doc" = """O peso: `regular`, `medium`, `semibold` ou `bold`. Padrão `regular`."""
"component.text.prop.tone.doc" = """Quanto o texto se destaca: `default`, `muted` para texto secundário, ou `accent`. Padrão `default`."""
"component.text.prop.numeric.doc" = """Se os algarismos são tabulares, para os dígitos se alinharem em coluna. Desligado por padrão."""
"component.text.prop.children.doc" = """O texto."""
"component.time.a11y-notes" = """O texto visível é o que é anunciado. Ele precisa ser uma data de verdade na língua de quem lê, e não o valor legível por máquina. O `datetime` é lido só por máquinas."""
"component.toolbar.guidance" = """Use uma toolbar para uma barra de controles de uma coisa só, como as ações de um painel. É uma parada de tabulação percorrida com as setas. Para uma fileira de links, use `nav`. Para botões que são uma decisão, use `ButtonGroup`."""
"component.toolbar.a11y-notes" = """Uma única parada de tabulação para a barra inteira, percorrida com as setas. Exatamente um controle dentro carrega `tabindex="0"` e os outros carregam `-1`, então voltar à barra cai onde a pessoa parou."""
"component.toolbar.prop.label.doc" = """O nome acessível da toolbar, dizendo para que serve a barra de controles. Obrigatório, a não ser que `labelledby` a nomeie, porque um `role="toolbar"` sem nome dá ao leitor de tela só a palavra `toolbar`."""
"component.toolbar.prop.labelledby.doc" = "O id do elemento que nomeia esta toolbar, quando o nome já está visível na página."
"component.toolbar.prop.orientation.doc" = """Para que lado os controles correm, e portanto que setas os percorrem. É escrito em `aria-orientation`, então a tecnologia assistiva também informa o eixo."""
"component.toolbar.prop.wrap.doc" = """Se a barra quebra em mais linhas quando falta espaço. Ligado por padrão, para que o último controle continue alcançável em 320px."""
"component.toolbar.prop.density.doc" = """O espaço entre os grupos dela. `compact` é para uma barra dentro de outra coisa, onde o espaçamento ao redor já a separa."""
"component.toolbar.prop.children.doc" = "Os grupos de controles."
"component.toolbar.prop.glass.doc" = """Fosca a barra. Use numa barra que rola sobre o conteúdo que ela controla, que é o que transparece."""
"component.toolbar.key.tab.name" = "Tab"
"component.toolbar.key.tab.action" = """Entra na barra uma vez, no último controle usado, e não para em cada controle."""
"component.toolbar.key.arrow-keys.name" = "Setas"
"component.toolbar.key.arrow-keys.action" = """Vai para o controle seguinte ou anterior, escolhendo-o se for um radio. Esquerda e Direita, ou Cima e Baixo na vertical."""
"component.toolbar.key.home.name" = "Home"
"component.toolbar.key.home.action" = """Vai para o primeiro controle."""
"component.toolbar.key.end.name" = "End"
"component.toolbar.key.end.action" = """Vai para o último controle."""
"component.toolbar-group.guidance" = """Use um grupo de toolbar dentro de uma `Toolbar`, para dizer quais controles andam juntos e em que ponta da barra eles ficam. Não use em nenhum outro lugar, porque sozinho ele é um `role="group"` sem toolbar ao redor."""
"component.toolbar-group.a11y-notes" = """`needs_name` é falso aqui. A toolbar em volta já é nomeada. Nomear cada agrupamento também faz o leitor de tela marcar uma fronteira de grupo duas vezes no caminho até cada controle."""
"component.toolbar-group.prop.align.doc" = """Em que ponta da barra este grupo fica. `end` empurra o grupo e tudo depois dele para o lado oposto, então uma barra só carrega dois blocos sem elemento espaçador no meio."""
"component.toolbar-group.prop.label.doc" = """Para que este bloco serve, quando ele precisa de um nome separado do da barra. A maioria não precisa, porque o leitor de tela marca uma fronteira de grupo em cada bloco nomeado na passagem."""
"component.toolbar-group.prop.children.doc" = """Os controles."""
"component.time.prop.datetime.doc" = """O valor legível por máquina, no formato `datetime` que a especificação do HTML define, como `2026-08-14` ou `2026-08-14T09:30`."""
"component.time.prop.children.doc" = """Como a data é escrita para quem lê, no locale dessa pessoa."""
"component.truncate.a11y-notes" = """O corte é só visual. O texto inteiro fica na árvore de acessibilidade, então um leitor de tela lê o valor completo. Cortar também o anúncio esconderia conteúdo de quem não vê as reticências."""
"component.truncate.prop.lines.doc" = """Quantas linhas aparecem antes do corte: 1, 2, 3 ou 4. Uma linha por padrão."""
"component.truncate.prop.title.doc" = """O texto inteiro, escrito no atributo `title`. Quem usa ponteiro o vê ao passar o mouse."""
"component.truncate.prop.children.doc" = """O texto a cortar."""
"component.visually-hidden.a11y-notes" = """Nem `display: none` nem `visibility: hidden`, porque os dois tiram o conteúdo da árvore de acessibilidade. O clip-path o mantém anunciado e fora do layout."""
"component.visually-hidden.prop.focusable.doc" = """Se o conteúdo é revelado quando recebe o foco, como acontece com um link de pular para o conteúdo."""
"component.visually-hidden.prop.children.doc" = """O conteúdo."""
"component.color-picker.guidance" = """Use um seletor de cor quando a cor for o valor da própria pessoa, como um rótulo ou uma forma que ela está criando. Quando as respostas são um conjunto fixo de cores nomeadas, use `Segmented` ou `Select`."""
"component.color-picker.a11y-notes" = """Cada chip carrega a notação como nome acessível, então cores parecidas continuam distinguíveis. O campo de saturação e valor é feito de dois `<input type="range">` reais."""
"component.color-picker.prop.name.doc" = """O nome do campo sob o qual a cor é enviada, e a raiz de todos os ids aqui. **Obrigatório**, porque ids derivados de um nome opcional seriam compartilhados por todos os seletores da página."""
"component.color-picker.prop.label.doc" = """Para que serve a cor, na língua de quem lê, como *Cor do rótulo*. Renderiza um `<label>` real no controle que carrega o valor, e nomeia a lista de cores quando `multiple` está ligado."""
"component.color-picker.prop.value.doc" = """A cor inicial, como `#rrggbb`, ou `#rrggbbaa` com `alpha`. Só hexadecimal, porque a forma sem script é `<input type="color">`. Vários valores são separados por espaços quando `multiple` está ligado."""
"component.color-picker.prop.hint.doc" = """Orientação extra exibida sob o rótulo. É ligada por `aria-describedby`, então um leitor de tela a lê junto com o controle."""
"component.color-picker.prop.error.doc" = """A mensagem exibida quando a resposta está errada, depois de um envio. Leva `role="alert"`, e nada aqui escreve por cima dela nem a apaga."""
"component.color-picker.prop.size.doc" = """O tamanho do chip, igual ao `Button` e ao `Swatch` passo a passo, para que o seletor se alinhe em uma fileira de controles. `medium` por padrão."""
"component.color-picker.prop.shape.doc" = """Os cantos do chip, entre os três do `Swatch`: `pill`, `rounded` ou `square`. `rounded` por padrão em vez do `pill` do `Swatch`, porque este chip é um controle que a pessoa aciona."""
"component.color-picker.prop.trigger_label.doc" = """O nome acessível do chip, com um buraco `{value}`, como *Escolha uma cor, agora {value}*. Sem ele o botão recai no `label`, que não carrega a cor."""
"component.color-picker.prop.glass.doc" = """Fosca o chip. O painel continua opaco de qualquer forma, porque um fundo transparecendo tingiria as cores pelas quais o painel é julgado."""
"component.color-picker.prop.multiple.doc" = """Se a pessoa monta uma lista de cores. Ligado, o gatilho mostra um chip por cor confirmada e o painel ganha uma fileira deles. De todo modo o armazenamento é um `<input type="color">` por valor sob um `name`."""
"component.color-picker.prop.max.doc" = """Quantas cores são permitidas. Texto e não número, porque toda propriedade que cruza as duas linguagens é texto. No limite o controle de adicionar fica desativado e `max_label` aparece."""
"component.color-picker.prop.max_label.doc" = """A mensagem exibida nesse limite, com um buraco `{max}`. Informe sempre que `max` estiver definido."""
"component.color-picker.prop.add_label.doc" = """O nome acessível do controle que adiciona a cor atual à lista. Informe sempre que `multiple` estiver ligado, porque esse controle é o único caminho de uma cor até a lista."""
"component.color-picker.prop.remove_label.doc" = """O nome acessível do controle de remover de cada cor confirmada, com um buraco `{value}`, para que cada um nomeie a cor que remove."""
"component.color-picker.prop.added_label.doc" = """A mensagem lida quando uma cor entra na lista, com um buraco `{value}`. Nada move o foco quando isso acontece, então sem ela um leitor de tela não recebe confirmação."""
"component.color-picker.prop.removed_label.doc" = """A mensagem lida quando uma cor sai da lista, com um buraco `{value}`. O controle que a removeu saiu da página, então o foco mudou de lugar."""
"component.color-picker.prop.status.doc" = """Quantas cores existem, com um buraco `{count}`. Pode carregar uma forma por categoria de plural, escrita como `one:…|other:…`, como faz `Search.status`."""
"component.color-picker.prop.spectrum_label.doc" = """O nome da aba de escolha livre. Só aparece quando `palette` acrescenta uma segunda aba, porque uma aba sozinha é um título e não uma aba."""
"component.color-picker.prop.area_label.doc" = """O nome do campo de saturação e valor, que é o quadrado em que a pessoa arrasta. São dois sliders em uma caixa, nomeados uma vez, com cada eixo carregando o próprio valor."""
"component.color-picker.prop.hue_label.doc" = """O nome da trilha de matiz. É um `<input type=\"range\">` real, que fornece o teclado, a alça e o valor."""
"component.color-picker.prop.alpha.doc" = """Se a cor pode ser transparente. Desligado por padrão. Ligado, os códigos ganham as formas com alfa e o input nativo ganha o atributo `alpha`. Um navegador sem esse atributo entrega uma cor opaca."""
"component.color-picker.prop.alpha_label.doc" = """O nome da trilha de transparência. Informe sempre que `alpha` estiver ligado."""
"component.color-picker.prop.palette.doc" = """Se as rampas do Noctua são oferecidas ao lado do espectro. Desligado por padrão. Ligado, o painel ganha uma segunda aba com todas as paletas de `noctua-colors`, e os códigos ganham uma linha de **token**, como `--nc-violet-solid`."""
"component.color-picker.prop.palette_label.doc" = """O nome dessa aba. Informe sempre que `palette` estiver ligado."""
"component.color-picker.prop.entry.doc" = """Se a pessoa pode digitar ou colar uma cor. **Ligado por padrão**. Aceita hexadecimal, `rgb()`, `hsl()` e `oklch()`, e recusa todo o resto, inclusive os nomes de cor do CSS."""
"component.color-picker.prop.entry_label.doc" = """O nome desse campo. É um rótulo real e não um placeholder, que sumiria assim que a pessoa começasse a digitar."""
"component.color-picker.prop.entry_invalid_label.doc" = """A mensagem exibida quando uma string não é uma cor, com um buraco `{value}`. A cor já escolhida **não** muda."""
"component.color-picker.prop.eyedropper.doc" = """Se surge um controle para pegar uma cor da tela. Desligado por padrão, e **ausente em vez de desativado** onde o navegador não tem `EyeDropper`. O que ele devolve é validado como texto digitado."""
"component.color-picker.prop.eyedropper_label.doc" = "O nome desse controle. Ele é um glifo, então este é o único nome que ele tem."
"component.color-picker.prop.recent.doc" = """A chave de armazenamento sob a qual as últimas cores ficam guardadas. **Sem ela não há fileira de recentes**, que é o padrão, porque guardar cores escreve no navegador da pessoa. Valores guardados que não são cores são descartados."""
"component.color-picker.prop.recent_label.doc" = """O título sobre essa fileira. Informe sempre que `recent` estiver definido."""
"component.color-picker.prop.forget_label.doc" = """O nome do controle que esvazia a fileira de recentes. Informe sempre que `recent` estiver definido, para que a pessoa possa limpar o que foi guardado."""
"component.color-picker.prop.codes_label.doc" = """O resumo do painel dobrado de notações, como *Códigos*. É um `Disclosure`, então o painel começa fechado e a cor continua na tela."""
"component.color-picker.prop.formats.doc" = """Quais notações oferecer, separadas por espaços, na ordem exibida: `hex`, `rgb`, `hsl`, `oklch`, `token`. Um nome desconhecido é descartado. `token` aparece só na aba Noctua, seja qual for a ordem listada."""
"component.color-picker.prop.copy_label.doc" = """O nome do controle de copiar de cada linha, com um buraco `{format}`, como *Copiar a notação hexadecimal*, para que os controles se distingam."""
"component.color-picker.prop.copied_label.doc" = """A mensagem que a região dinâmica carrega quando uma cópia dá certo. Sem ela o controle ainda funciona e troca o glifo, sem confirmação para um leitor de tela. Nada é anunciado quando uma cópia **falha**."""
"component.color-picker.prop.close_label.doc" = """O nome do controle que fecha o painel. Escape também fecha, e quem usa só o ponteiro não tem Escape."""
"component.color-picker.prop.disabled.doc" = """Impede que a pessoa mude a cor. Escreve o atributo `disabled` real nos elementos `<input>` e em todos os controles do painel. Isso também mantém o valor fora do envio do formulário."""
"component.color-picker.prop.required.doc" = """Se uma cor é necessária. Vai no **input nativo**, nunca em um controle que o script escondeu, porque o navegador ancora a mensagem no controle inválido. Um input de cor sempre tem valor, então nunca é violado."""
"component.color-picker.state.invalid.doc" = """Definido quando há um `error`, ou quando o campo de entrada não consegue ler uma string como cor. A borda muda e uma mensagem aparece. A cor já escolhida não muda."""
"component.color-picker.state.expanded.doc" = """Se o painel está aberto. Fica no gatilho e não no painel, que é onde um leitor de tela o lê."""
"component.color-picker.state.copied.doc" = """Definido quando uma notação acabou de chegar à área de transferência. Fica no controle de copiar pelos dois segundos em que o glifo é um tique, o mesmo estado e a mesma janela do `CodeBlock`."""
"component.color-picker.key.enter-or-space.name" = "Enter ou Espaço"
"component.color-picker.key.enter-or-space.action" = """Abre o painel a partir do chip. É o comportamento próprio do navegador, porque o chip é um botão real."""
"component.color-picker.key.escape.name" = "Escape"
"component.color-picker.key.escape.action" = """Fecha o painel e **mantém** a cor escolhida."""
"component.color-picker.key.arrow-keys.name" = "Setas"
"component.color-picker.key.arrow-keys.action" = """Move o ponto no campo, ou a trilha em foco, em um passo."""
"component.color-picker.key.shift-an-arrow.name" = "Shift + uma seta"
"component.color-picker.key.shift-an-arrow.action" = """O mesmo, dez passos por vez."""
"component.color-picker.key.home-end.name" = "Home / End"
"component.color-picker.key.home-end.action" = """Vai para as pontas da trilha que estiver em foco."""
"component.color-picker.key.tab.name" = "Tab"
"component.color-picker.key.tab.action" = """Percorre o painel e sai dele. O foco não fica preso, porque o painel é um popover e não um diálogo."""
