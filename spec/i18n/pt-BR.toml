"component.carousel.summary" = """Deixe a pessoa percorrer de lado uma fileira de coisas, num contêiner de rolagem real."""
"component.carousel-slide.summary" = """Mostre um slide de um carrossel como item de lista, com a posição no nome acessível."""
"page.carousel.summary" = """Deixe a pessoa percorrer de lado uma fileira de slides."""
"page.carousel.body" = """O carrossel e os slides dele. É antes de tudo um contêiner de rolagem: arrastar, deslizar, o trackpad, o Home e o End funcionam com o script bloqueado. O script acrescenta os dois controles, os pontos, a contagem e a frase que diz qual slide chegou."""
# --- O carrossel -------------------------------------------------------------

"component.carousel.guidance" = """Use um carrossel para uma fileira de coisas que se percorre de lado, como fotos de um produto. É raro chegar ao segundo slide, então use uma grade quando o conteúdo importa. Os slides rolam e encaixam antes de qualquer script."""
"component.carousel.a11y-notes" = """`role="group"` com `aria-roledescription="carousel"` e o `label` de quem chama. O foco não se move quando a trilha rola, então `announce_label` é como quem lê fica sabendo qual slide chegou."""
"component.carousel.prop.name.doc" = """Como este carrossel se chama na marcação, e a raiz de cada id nele. **Obrigatório**, porque um id derivado de um nome opcional é um id que toda cópia do componente na página compartilha."""
"component.carousel.prop.label.doc" = """O que é a fileira, na língua de quem lê, como *Fotos da chaleira*. **Obrigatório**, porque o componente se anuncia como carrossel e essa palavra sozinha não diz o que há nele."""
"component.carousel.prop.per_view.doc" = """Quantos slides cabem de uma vez: um número, ou `auto` para cada slide manter a própria largura. Padrão `1`, a galeria. `auto` é a prateleira, e sobrevive a uma tela estreita. Texto e não número, como todo prop que cruza as duas linguagens."""
"component.carousel.prop.snap.doc" = """Onde um slide para. `start` alinha a borda inicial dele com a da trilha, o que serve a uma prateleira, e `center` serve a uma galeria de um. `none` deixa uma rolagem simples, e faz os controles rolarem uma tela em vez de ir a um slide."""
"component.carousel.prop.orientation.doc" = """Para que lado a trilha corre. Padrão `horizontal`. É desenhado, não anunciado, porque um grupo não tem eixo em ARIA. É escrito com propriedades lógicas, então se inverte em um idioma da direita para a esquerda."""
"component.carousel.prop.controls.doc" = """Se os controles de anterior e próximo aparecem. **Ligado por padrão**, porque um mouse sem roda horizontal não move um contêiner de rolagem sem eles. São renderizados escondidos e o script os revela depois de medir a trilha."""
"component.carousel.prop.previous_label.doc" = """O nome do controle que volta. Necessário sempre que `controls` estiver ligado, porque o controle é um glifo e este é o único nome dele. *Anterior* sozinho dá quatro nomes iguais em uma página com quatro carrosséis."""
"component.carousel.prop.next_label.doc" = """O nome do controle que avança, pelo mesmo motivo."""
"component.carousel.prop.dots.doc" = """Se aparece uma fileira de controles, um por slide. Desligado por padrão, e **errado passando de uns oito slides**, onde vinte pontos são vinte alvos que quem lê não distingue. São botões de verdade que movem a trilha."""
"component.carousel.prop.dot_label.doc" = """O nome de cada ponto, com buracos `{index}` e `{count}`, como *Ir para o slide {index} de {count}*. Necessário sempre que `dots` estiver ligado, porque um círculo sem nome é anunciado só como *botão*."""
"component.carousel.prop.counter.doc" = """Se a posição é escrita, como *3 de 8*. Desligado por padrão. Use no lugar de `dots` passando de uns poucos slides, ou ao lado deles, porque só um número dá a contagem."""
"component.carousel.prop.counter_label.doc" = """O que o contador diz, com buracos `{index}` e `{count}`. Uma frase inteira com dois buracos, nunca montada em pedaços."""
"component.carousel.prop.announce_label.doc" = """O que é anunciado quando um slide chega, com buracos `{index}` e `{count}`. O foco não se move quando a trilha rola, então sem esta frase apertar *próximo* é silencioso para um leitor de tela."""
"component.carousel.prop.wrap.doc" = """Se *próximo* no último slide volta ao primeiro. Desligado por padrão, para quem lê sentir onde a fileira termina. Chamado `wrap` e não `loop`, porque `loop` é palavra-chave em Rust. Ligado, os controles nunca ficam desabilitados nas pontas."""
"component.carousel.prop.autoplay.doc" = """Quantos milissegundos cada slide espera antes do próximo. **Ausente significa desligado.** Nunca começa sob `prefers-reduced-motion: reduce` nem sem `pause_label`, que é a WCAG 2.2.2. Pausa sob o ponteiro ou o foco, e para no primeiro controle usado."""
"component.carousel.prop.pause_label.doc" = """O nome do controle que para a rotação. **Obrigatório sempre que `autoplay` estiver definido, e imposto**: sem nome não há controle, e sem controle a rotação nunca começa. Isso é a WCAG 2.2.2."""
"component.carousel.prop.play_label.doc" = """O nome que ele assume depois de parada a rotação. Um alternador que mantém um só nome anuncia o estado errado desde o primeiro toque. Nenhum script pode inventar o outro nome na língua de quem lê."""
"component.carousel.prop.glass.doc" = """Fosca os dois controles e os pontos. Desligado por padrão. A trilha nunca é fosca, porque atrás de um slide está a página."""
"component.carousel.prop.children.doc" = """Os slides, como `CarouselSlide`. Itens de lista de verdade em uma lista de verdade. Um leitor de tela os conta, e a pessoa rola a lista sem script."""
"component.carousel.state.paused.doc" = """Se a rotação está parada, pela pessoa, por um ponteiro parado em cima, pelo foco chegar dentro dela, ou pela aba sair de vista. Fica na raiz, para o controle trocar o glifo e o nome junto."""
"component.carousel.state.ends.doc" = """Em que ponta a trilha está encostada: `start`, `end`, ou ausente no meio. O script escreve a partir da posição de rolagem e não de um índice, então um último slide parcialmente visível ainda conta como a ponta."""
"component.carousel.key.left-arrow-right-arrow.name" = "Seta para a esquerda / Seta para a direita"
"component.carousel.key.left-arrow-right-arrow.action" = """Rola a trilha, que é o comportamento próprio do navegador. Em um carrossel vertical as teclas são Cima e Baixo."""
"component.carousel.key.home-end.name" = "Home / End"
"component.carousel.key.home-end.action" = """Vai para o primeiro ou o último slide. Os controles fazem o mesmo nas pontas quando `wrap` está desligado."""
"component.carousel.key.tab.name" = "Tab"
"component.carousel.key.tab.action" = """Entra nos slides e sai do outro lado. A trilha é uma parada de tabulação só quando nada dentro dela é focável."""
"component.carousel-slide.guidance" = """Use um slide de carrossel dentro de um `Carousel`, e apenas ali. O script escreve a posição de cada slide no nome acessível, então *3 de 8* continua correto. Um `label` é somado a essa contagem em vez de substituí-la."""
"component.carousel-slide.a11y-notes" = """O `<li>` leva `role="group"` e `aria-roledescription="slide"`, então a tecnologia assistiva o identifica como um slide. Conteúdo rolado para fora da borda mantém seu lugar na ordem de tabulação."""
"component.carousel-slide.prop.label.doc" = """Uma descrição deste slide, como *a chaleira vista de cima*. É somada à posição no nome acessível em vez de substituí-la. Sem ela, o slide é nomeado apenas pela posição."""
"component.carousel-slide.prop.children.doc" = """O conteúdo do slide, como uma imagem, um cartão ou um parágrafo. Qualquer elemento focável dentro continua focável e na ordem de tabulação, inclusive o que estiver rolado para fora da borda."""
# O carrossel. Uma galeria, uma prateleira, e o que gira — que é o único
# exemplo deste site que se move sozinho, e ele diz como parar.
