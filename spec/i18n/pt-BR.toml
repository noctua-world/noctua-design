"spacing.region" = "Entre regiões maiores de um layout"
"effects.patterns.title" = "Padrões"
"effects.patterns.body" = "Quatro geometrias, cada uma desenhada na cor do texto a quatro por cento. Esse teto é o que torna a promessa de legibilidade mensurável em vez de otimista — e um teste a mede, em cada padrão, nos dois modos."
"effects.ambient.title" = "Ambiente"
"effects.ambient.body" = "A aurora segue a cor de destaque, então muda com a paleta sem nomear uma cor. O granulado fica sempre atrás do texto, porque ruído sobre glifos custa muito mais legibilidade que um véu uniforme."
