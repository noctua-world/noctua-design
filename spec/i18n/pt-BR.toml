# --- O select ---------------------------------------------------------------
#
# As opções são as paletas deste sistema, que é a única lista do site comprida
# o bastante para precisar de um select — trinta e nove — e o único lugar em
# que uma amostra de cor ao lado da opção é a resposta, e não enfeite. Os nomes
# das paletas são identificadores e continuam identificadores; tudo em volta
# deles é frase e passa pelo catálogo como qualquer outra.

