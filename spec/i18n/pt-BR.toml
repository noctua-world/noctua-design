# --- Menu e MenuItem --------------------------------------------------------

"component.menu.guidance" = """Use um menu para as ações que um botão abre, como *Duplicar*, *Renomear* e *Excluir*. Cada item executa uma ação e fecha o menu. Para escolher um valor de uma lista, use `Segmented` ou `Select`. Nem o menu nem o botão dele renderizam sem script."""
"component.menu.a11y-notes" = """É `role="menu"` com filhos `role="menuitem"`, o que dá uma parada de tabulação e as setas entre os itens. Escape e escolher um item devolvem o foco ao botão que o abriu."""
"component.menu.prop.name.doc" = """Como este menu se chama na marcação, e o id para onde o botão dele aponta com `controls`. **Obrigatório**, porque um id derivado de um nome opcional é um id que toda cópia na página compartilha."""
"component.menu.prop.label.doc" = """O nome do próprio menu, na língua de quem lê, como *Ações desta fatura*. **Obrigatório**, porque um leitor de tela anuncia o menu quando o foco entra nele. Nomeie sobre o que são as ações."""
"component.menu.prop.placement.doc" = """Onde ele fica pendurado no botão: `auto`, `start` ou `end`. `auto` mede o espaço, virando para cima e pendurando pela borda que couber. `start` e `end` fixam uma borda seja qual for o espaço."""
"component.menu.prop.children.doc" = """Os itens, como `MenuItem`. Nada mais cabe aqui. Um título, um parágrafo ou um controle de formulário dentro de um `role="menu"` não pode ser alcançado. O teclado do menu anda entre itens e mais nada."""
"component.menu.state.open.doc" = """Se o menu está aparecendo. O atributo fica no botão e não aqui, porque é o elemento que se aperta. O menu em si está presente ou escondido, o que não é um estado que quem chama define."""
"component.menu.key.down-or-up.name" = """Seta para baixo ou para cima"""
"component.menu.key.down-or-up.action" = """Vai ao item seguinte ou anterior, dando a volta nas pontas. Para baixo abre no primeiro item e para cima no último."""
"component.menu.key.home-or-end.name" = "Home ou End"
"component.menu.key.home-or-end.action" = """Vai para o primeiro item ou para o último."""
"component.menu.key.a-printable-key.name" = "Uma tecla imprimível"
"component.menu.key.a-printable-key.action" = """Salta para o próximo item cujo rótulo começa com esse caractere."""
"component.menu.key.enter-or-space.name" = "Enter ou Espaço"
"component.menu.key.enter-or-space.action" = """Executa o item sob foco e fecha o menu."""
"component.menu.key.escape.name" = """Escape"""
"component.menu.key.escape.action" = """Fecha o menu e devolve o foco ao botão que o abriu."""
"component.menu.key.tab.name" = "Tab"
"component.menu.key.tab.action" = """Sai do menu, o que o fecha. Os itens não são paradas de tabulação, porque um menu usa as setas."""
"component.menu-item.guidance" = """Use um item de menu para uma ação dentro de um `Menu`. Ele renderiza um `<button>` de verdade, ou um `<a>` de verdade quando `href` é informado. Para itens que são valores e não ações, use `Segmented` ou `Select`."""
"component.menu-item.a11y-notes" = """`aria-disabled` em vez de `disabled`, então um item recusado fica no percurso das setas e é anunciado em vez de sumir. O `tabindex` dele é `-1`, porque o menu é uma parada de tabulação só."""
"component.menu-item.prop.label.doc" = """O texto do item, na língua de quem lê. É o texto visível **e** o nome acessível ao mesmo tempo, então os dois não podem divergir. Obrigatório."""
"component.menu-item.prop.icon.doc" = """Um ícone antes do rótulo, centrado opticamente no texto. É decoração e leva `aria-hidden`, porque repete o rótulo."""
"component.menu-item.prop.detail.doc" = """Uma segunda linha, menor, sob o rótulo, para a ação cuja consequência vale explicitar. Faz parte do nome acessível, então quem não a vê ainda a ouve."""
"component.menu-item.prop.value.doc" = """O que este item aplica sua ação, como identificador. O script lê isso e mais nada, então nunca é traduzido. `SegmentedItem` tem o mesmo prop pelo mesmo motivo."""
"component.menu-item.prop.action.doc" = """Um nome pelo qual um script encontra este item. O script do próprio menu fecha o menu e devolve o foco, e o código de quem chama faz o resto. `Button` e `Disclosure` têm o mesmo tipo de gancho."""
"component.menu-item.prop.tone.doc" = """De qual tom do sistema de cores o item é pintado. Os tons ficam em `noctua_design::tones`. Use o tom de perigo no item que destrói alguma coisa. **Nunca o único sinal** (`NOCTUA.md §8.8.6`): a palavra faz o trabalho."""
"component.menu-item.prop.disabled.doc" = """Impede que este item seja acionado e **o mantém no percurso das setas**. Escreve `aria-disabled` em vez de `disabled`, então o item é anunciado como indisponível em vez de sumir. `Button.disabled` faz o contrário."""
"component.menu-item.prop.href.doc" = """Para onde o item vai. Com ele, o componente renderiza um `<a role="menuitem">` em vez de um `<button>`. Nunca combine com `disabled`, porque um link desabilitado não existe na plataforma."""
"component.menu-item.prop.rel.doc" = """A relação do link. Deixada em branco junto com `target`, o componente escreve `noopener noreferrer` sozinho."""
"component.menu-item.prop.target.doc" = """Onde o link abre. Abrir uma nova janela tira a decisão da pessoa, então precisa de um motivo."""
"component.menu-item.key.enter-or-space.name" = "Enter ou Espaço"
"component.menu-item.key.enter-or-space.action" = """Aciona o item e fecha o menu. A forma de link responde só ao Enter."""
"component.info.guidance" = """Use um marcador de informação para uma frase que explica a palavra ao lado. Ele abre num toque e não ao passar o ponteiro, então funciona em tela de toque e pelo teclado. Se todo mundo precisa da frase, escreva-a na página."""
"component.info.a11y-notes" = """O controle é um `<button>` com `aria-expanded` e `aria-controls`, e o glifo é `aria-hidden`. A nota é um `role="note"` e não um diálogo. O Escape a fecha e devolve o foco ao botão."""
"component.info.prop.name.doc" = """O identificador desta nota, e a raiz dos dois ids daqui. **Obrigatório**, porque uma página pode ter muitos destes e ids derivados de um nome ausente colidiriam."""
"component.info.prop.label.doc" = """O nome do controle, na língua de quem lê, como *Sobre o prazo*. **Obrigatório**: o controle é um glifo, então este é o único nome que ele tem. Nomeie o que é explicado, e não o ato de explicar."""
"component.info.prop.heading.doc" = """Um título dentro da nota, para a explicação que precisa de um, como um termo sendo definido. Ausente é o caso comum, porque uma frase não precisa de título."""
"component.info.prop.close_label.doc" = """O nome do controle que fecha a nota. Necessário na prática, porque o Escape e um clique fora também fecham e nenhum dos dois se descobre numa tela de toque."""
"component.info.prop.placement.doc" = """Onde a nota abre. `auto` mede o espaço, virando para cima e pendurando pela borda que couber. `start` e `end` prendem a borda inicial ou final da nota seja qual for o espaço, para um marcador na borda de uma tabela."""
"component.info.prop.children.doc" = """A explicação, em uma ou duas frases. Ela pode conter um `Link`, e a pessoa pode selecionar e copiar o texto, o que o balão do próprio navegador não permite."""
"component.info.state.open.doc" = """Se a nota está aparecendo. Escrito no controle, que é o elemento que a pessoa aperta e o elemento cujo estado um leitor de tela lê."""
"component.info.key.enter-or-space.name" = "Enter ou Espaço"
"component.info.key.enter-or-space.action" = """Abre a nota, e fecha de novo."""
"component.info.key.escape.name" = """Escape"""
"component.info.key.escape.action" = """Fecha a nota e devolve o foco ao controle que a abriu."""
"component.info.key.tab.name" = "Tab"
"component.info.key.tab.action" = """Entra na nota e sai dela. Nada fica preso, e sair da nota é o que a fecha."""
"component.info.summary" = """Explique uma palavra com uma frase, aberta por um pequeno `i` ao lado dela."""
# O `i` e a nota dele.
"example.info.deadline" = "Prazo de pagamento"
"example.info.deadline-label" = "Sobre o prazo de pagamento"
"example.info.deadline-note" = "Dias úteis a partir da aprovação da fatura, não da data em que ela foi emitida. Feriados nacionais não contam."
"example.info.deadline-hint" = """A nota abre com um toque, e não ao passar o ponteiro, então funciona no celular e pelo teclado."""
"example.info.usage" = "Tokens usados"
"example.info.usage-label" = "O que conta como token"
"example.info.usage-heading" = "O que é contado"
"example.info.usage-note" = "Tanto o que você manda quanto o que volta. Uma requisição repetida conta uma vez; uma que falhou antes de chegar ao modelo não conta."
"example.info.usage-hint" = """`heading` dá um título à nota. Use para uma explicação que passa de uma frase."""
"example.info.close" = "Fechar"
"example.info.close-hint" = """`close_label` nomeia o controle que fecha a nota. O Esc e um clique fora também a fecham."""
"example.info.column" = "Saldo"
"example.info.column-label" = "Como o saldo é calculado"
"example.info.column-note" = "Faturado menos pago, no fim do dia mostrado. Uma nota de crédito é subtraída no dia em que foi emitida, e não no dia em que foi aplicada."
"component.table.prop.search_label.doc" = """O nome do campo de busca, e do controle que o revela. **Uma caixa só, atrás de uma lupa**, em vez de uma em cada título filtrável. Necessário na prática por um `TableColumn` filtrável."""
"component.table.prop.search_placeholder.doc" = """O exemplo dentro da caixa de busca, como *fatura, cliente, status*. **Nunca o único nome que ela tem**, porque some na primeira tecla."""
"component.table.prop.export.doc" = """Se a barra de ferramentas carrega o menu que salva a tabela: um arquivo `.csv`, um `.json`, a área de transferência e a impressora. Escreve o que está **aparecendo**: as colunas visíveis, as linhas que o filtro deixou e as escolhidas."""
"component.table.prop.export_label.doc" = """O nome desse menu. Necessário na prática pelo `export`."""
"component.table.prop.csv_label.doc" = """O nome da entrada que baixa um `.csv`. O arquivo abre numa planilha e leva o nome da tabela."""
"component.table.prop.json_label.doc" = """O nome da entrada que baixa um `.json`, com o `name` de cada `TableColumn` como chave. Para quem processa a tabela com código."""
"component.table.prop.print_label.doc" = """O nome da entrada que imprime. A folha de estilo de impressão tira a barra de ferramentas e desdobra a área de rolagem para que nada fique cortado. A linha de títulos se repete em cada folha."""
"component.table.prop.exported_label.doc" = """O que é dito depois de um arquivo ser salvo, com um buraco `{count}`. Um download que falha não diz **nada**, em vez de nomear um arquivo que nunca foi escrito."""
"component.table.prop.more_src.doc" = """De onde vêm as próximas linhas. O endereço devolve **marcação `<tr>`** em vez de JSON. A resposta pode trazer um `data-nd-more-src` próprio na primeira linha, e nenhum atributo significa que não há mais. Nada é buscado até a pessoa pedir."""
"component.table.prop.more_label.doc" = """O nome do controle que as busca. **Um botão de verdade, sempre**, que o script aperta quando ele entra na tela. Necessário na prática pelo `more_src`."""
"component.table.prop.more_status_label.doc" = """O que é anunciado quando linhas chegam, com buracos `{count}` e `{total}`. As linhas aparecem sem mover o foco, então a frase é o único sinal de que a tabela mudou de tamanho."""
"component.table.prop.total.doc" = """Quantas linhas existem ao todo, quando o resto delas está em outro lugar. É de onde o `{total}` é preenchido. Sem ele, vinte linhas buscadas de quatrocentas são anunciadas como *20 de 20*."""
"component.table-column.prop.low.doc" = """O número abaixo do qual os valores desta coluna recebem `tone_below`. É como um estado é derivado de um valor, como um saldo abaixo de zero. É lido do `sort_value` da célula quando existe, então *R$ 1.240,00* compara como `1240`."""
"component.table-column.prop.high.doc" = """O número acima do qual os valores desta coluna recebem `tone_above`. Com `low` faz três faixas de uma coluna só. Sem nenhum dos dois declarado, `tone_within` pinta todos os valores."""
"component.table-column.prop.tone_below.doc" = """O tom para um valor abaixo de `low`, entre os nomes do sistema de cores. **O `tone` da própria célula sempre vence**, então quem chama pode desligar a regra numa linha."""
"component.table-column.prop.tone_within.doc" = """O tom para um valor entre os dois limites. Ele pinta a coluna inteira quando nenhum limite é declarado."""
"component.table-column.prop.tone_above.doc" = """O tom para um valor acima de `high`. **Recalculado quando um filtro esconde uma linha ou chegam mais linhas**, então os tons acompanham as linhas que estão à vista."""
"component.table-row.prop.emphasis.doc" = """Quanto peso esta linha carrega em relação às linhas ao redor. `subtle` é um traço leve acima da linha. `strong` é um traço forte e texto em negrito. **Qualquer um dos dois tira a linha dos totais e da contagem de linhas.**"""
"component.table-cell.prop.aggregate_over.doc" = """Quais linhas o total conta. `table` é toda linha visível do corpo, o que faz um total geral. `section` são as linhas do **`<tbody>` desta célula**, o que faz um subtotal, porque vários `<tbody>` são o agrupamento do próprio HTML."""
"component.table-section.prop.name.doc" = """Como esta faixa se chama na marcação, e a raiz dos ids de que uma faixa recolhível precisa. Vários `<tbody>` numa tabela são o agrupamento de linhas do próprio HTML, como uma sequência de faturas por cliente, e isto os distingue."""
"component.table-section.prop.label.doc" = """O nome do grupo, desenhado como uma linha acima das linhas dele. Desejado na prática por `collapsible`, porque uma dobra sem nome esconde um número desconhecido de coisas. Ela atravessa a tabela, então nenhuma coluna precisa abrir espaço."""
"component.table-section.prop.collapsible.doc" = """Se as linhas do grupo se dobram atrás do título delas. **Vários grupos podem ficar abertos ao mesmo tempo**, então fechar um nunca abre outro. As linhas nascem abertas e o script desenha o controle, então uma dobra sem volta nunca chega à página."""
