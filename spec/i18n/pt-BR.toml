# --- Conteúdo das páginas -------------------------------------------------

"icons.body" = "O conjunto é declarado uma vez e todo o resto decorre dele: o enum, as duas implementações, o manifesto e esta página. Acrescentar um ícone é uma tabela na especificação e um desenho ao lado dela — não há lista nenhuma aqui para manter em dia."
