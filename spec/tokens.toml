# noctua-design — the non-color token source.
#
# This file is the only thing a developer edits to change a token. Everything
# under crates/noctua-design-tokens/src/, packages/tokens/ and dist/ is
# generated from it by `cargo xtask build` and must never be hand-edited.
#
# Colors are NOT here. They come from `noctua-colors`, vendored into
# packages/tokens/vendor/, and a missing color is a one-line change *there*
# (NOCTUA.md §8.8). A source gate fails the build on a color literal in this
# repository, including in this file.
#
# Every value below is chosen to satisfy NOCTUA.md §9.7: large default text,
# generous spacing, a narrow measure whatever the screen. Where a number is not
# obvious, the reason is written beside it — a value without a reason gets
# "tidied" by the next agent who has a different instinct.

[meta]
# The custom-property namespace. `noctua` produces `--noctua-space-4`.
#
# Deliberately different from `noctua-colors`' `nc`: the two token sets are
# generated by different repositories on different clocks, and a shared prefix
# would make "which repository owns this name" unanswerable at a glance. It is
# also what lets the source gates tell a color token from a design token
# without a lookup table.
prefix = "noctua"


# --- Spacing --------------------------------------------------------------
#
# One scale, and everything is spaced from it. Siblings share spacing, padding
# and radius — a row of controls that disagrees on padding reads as broken
# (§9.7).

[space]
# The base step, stated rather than implied. Every step is a multiple of it, so
# the whole scale moves together and no component can land between two steps.
base = "0.25rem"

# Multipliers of `base`. The sequence is roughly geometric past step 4, because
# a purely linear scale gives too many indistinguishable large values and too
# few small ones.
#
# `0` exists so "no space" is a token rather than a literal `0`, which the
# token-literal gate would otherwise have to special-case.
steps = [0, 1, 2, 3, 4, 6, 8, 12, 16, 24, 32, 48, 64]

# The gaps a reader actually feels, named so a component asks for a purpose
# rather than a number. These are the ones §9.7's "generously spaced" binds.
[space.named]
# Between a label and the control it labels — the tightest legitimate gap.
tight = 2
# Inside a control: the padding of a button, an input, a chip.
inset = 3
# Between sibling controls in a row or a form.
gap = 4
# Between paragraphs. Generous, per §9.7.
paragraph = 6
# Between a heading and the text under it.
heading = 8
# Between sections of a page.
section = 16
# Between major regions of a layout.
region = 24


# --- Radii ----------------------------------------------------------------

[radius]
# `none` is a token for the same reason `space-0` is.
none = "0"
# Controls: buttons, inputs, chips. One value, shared, because siblings that
# disagree on radius read as broken just as surely as ones that disagree on
# padding.
control = "0.5rem"
# Larger surfaces, on the rare occasion one is justified (§9.7 discourages
# cards; this exists for the case that earns one).
surface = "0.75rem"
# A pill: a capsule control, where the radius must exceed half the height.
pill = "9999px"


# --- Typography -----------------------------------------------------------
#
# Large by default (§9.7). The body size is 1.125rem rather than the browser
# default 1rem, which is the single change that does most of the work.

[type]
# The `ch` cap on line length. Applied to prose, never to the page.
#
# 66 characters is the middle of the 45–75 band typography research
# consistently lands on, and it is deliberately *not* a max-width on a
# container: the page may be as wide as the screen, the line may not (§9.7).
measure = 66

# The narrower cap for text set at a larger size, where the same character
# count spans a physically longer line.
measure_lead = 52

[type.size]
# A modular scale, ratio ~1.2 at the small end and widening at the display end
# so headings separate clearly at a glance.
#
# `body` is the anchor. Everything else is stated absolutely rather than as a
# multiplier, because a reader of this file should be able to see the value
# without doing arithmetic.
caption = "0.9375rem"
small = "1rem"
body = "1.125rem"
lead = "1.3125rem"
h4 = "1.375rem"
h3 = "1.75rem"
h2 = "2.25rem"
h1 = "3rem"
display = "3.75rem"

[type.leading]
# Line height, unitless so it scales with the size it is applied to.
#
# Tighter as the size grows: at display sizes the default 1.5 opens gaps that
# read as separate lines rather than one heading.
tight = 1.15
heading = 1.25
body = 1.6
loose = 1.75

[type.weight]
regular = 400
medium = 500
semibold = 600
bold = 700

[type.tracking]
# Letter spacing. Negative at display sizes, where the default spacing of a
# text-optimized face reads as loose.
tight = "-0.02em"
normal = "0"
wide = "0.02em"
# For all-caps runs, which need more space than lowercase to stay readable.
caps = "0.06em"


# --- Motion ---------------------------------------------------------------
#
# Every duration carries its reduced-motion collapse, so honouring
# `prefers-reduced-motion` is a property of the token rather than something a
# component has to remember. `NOCTUA.md §9.7` forbids flicker; this is how.
#
# `reduced` is not always 0: a color or opacity change at 0ms reads as a
# glitch, while a *movement* at 0ms is exactly what a motion-sensitive user
# asked for. So transitions that move collapse to 0 and transitions that only
# recolor collapse to something very short.

[motion.duration]
instant = { normal = "70ms", reduced = "70ms" }
fast = { normal = "120ms", reduced = "70ms" }
base = { normal = "180ms", reduced = "0ms" }
slow = { normal = "280ms", reduced = "0ms" }

[motion.easing]
# The standard pair. `out` for things entering or responding to input — it
# starts fast, so the interface feels answerable; `in-out` for things moving
# between two on-screen positions.
out = "cubic-bezier(0.16, 1, 0.3, 1)"
in_out = "cubic-bezier(0.65, 0, 0.35, 1)"
# Linear, for anything whose rate must be honest: a progress bar, a spinner.
linear = "linear"


# --- Layers ---------------------------------------------------------------
#
# Named z-indices, spaced by 100 so something can be slipped between two
# without renumbering. A component that writes a raw z-index is a component
# that will one day sit behind a dialog for reasons nobody can reconstruct.

[layer]
base = 0
raised = 100
sticky = 200
overlay = 300
dialog = 400
popover = 500
toast = 600
tooltip = 700


# --- Breakpoints ----------------------------------------------------------
#
# Mobile-first: every one is a minimum width, and the base styles are the
# narrow ones. §9.7 requires mobile friendliness from the first commit, and a
# max-width-first scale makes that an afterthought by construction.
#
# 320px is the narrowest screen still in real use and is the floor every layout
# must survive; it is not a breakpoint because it is the default.

[breakpoint]
sm = "30rem"
md = "48rem"
lg = "64rem"
xl = "80rem"


# --- Focus ----------------------------------------------------------------
#
# Focus is an accessibility requirement, not a decoration (§9.8), so its
# geometry is a token rather than a per-component decision.

[focus]
# Thick enough to be visible against a busy background at a glance.
width = "2px"
# The gap between the control and its ring, so the ring reads as separate from
# the border rather than as a thicker border.
offset = "2px"


# --- Borders --------------------------------------------------------------
#
# The only widths this system draws. One hairline, shared by every rule, every
# input outline and the pattern layer's mesh — a system whose separators
# disagree about their weight reads as unfinished.

[border]
hairline = "1px"
strong = "2px"
# THE MARK ON A WRONG ANSWER, and it is not a border — it is a rule down the
# side of a whole question, which is why it is five pixels rather than the next
# doubling. The measurement is the pattern's whole point: a bar thin
# enough to read as an edge is one nobody notices, and the thing it has to do
# is be noticed. `NOCTUA.md §8.8.6` — the sentence beside it is what carries
# the meaning; this is what carries the eye.
rule = "5px"


# --- The scene ------------------------------------------------------------
#
# What a `Lineage` cell is worth. The layout engine
# (crates/noctua-design-lineage) works in dimensionless cells and never sees a
# length — which is what lets the whole scene rescale from here, and why a raw
# `px` in that crate would be a defect rather than a shortcut.
#
# The depth is real. A figure is a slab with a measurable thickness, the planes
# are a measurable distance apart, and the camera has a measurable focal
# length: turn the scene and it behaves like an object rather than like a
# picture of one. `NOCTUA.md §4` chose real DOM in 3D over rasterising to a
# texture, and these are the numbers that make that choice visible.
#
# THERE IS NO SHADOW TOKEN, and there will not be one. `NOCTUA.md §9.7`:
# separation is a hairline, never elevation. Depth here is bought with
# perspective and with thickness.

[scene]
# THE PITCH: one cell down and back, and at most one across.
#
# Down and back it is fixed — a reader's text never shrinks to fit a window,
# because text that scales with a layout is text that becomes unreadable the
# moment the layout is wide. Across, the stylesheet may compress the pitch to
# `squeeze` of this before the scene pans instead, which trades a little
# horizontal air (never any text) for fitting a family on a laptop.
cell = "9rem"
# The hard floor of that compression — measured against the longest single
# word a card holds, not chosen: at 0.8 the word "Gramps" was one pixel wider
# than its card and ellipsised. Below the floor, panning is cheaper than the
# squint: the platform's own scrolling with no script, the camera with one.
squeeze = "0.85"
# What `size` multiplies EVERYTHING by — lengths and type together, so the
# proportions cannot drift. Narrow, because at 0.85 the smallest text is still
# twelve pixels and at 1.15 a scene still fits a documentation page.
scale-small = "0.85"
scale-large = "1.15"
# The pitch DOWN the page, one generation to the next. Taller than `cell`,
# because the air between two rows of figures is where the brackets, their
# labels and the little stems into each card all live — at one cell the stem
# into a card's top was nine pixels and the rows read as crowded.
row = "10rem"
# How much of its across-pitch a figure fills. Not all of it: two siblings are
# one pitch apart, so a figure the width of its pitch touches its neighbour
# exactly, in every scene, always — which is what happened, three times.
figure = "0.86"
# A figure's height, fixed. Sized to its worst content — a portrait, a name on
# two lines, a date — so nothing is ever clipped or ellipsised to fit. The sum
# is 8 padding + 28 portrait + 34.5 name + 17 date + two 4-pixel gaps + 8
# padding, and at 6.5rem the flexbox squeezed the name to one line and an
# ellipsis ("Gramps…").
card = "7rem"
# A union point's diameter.
mark = "1.25rem"
# A portrait's diameter.
face = "1.75rem"
# How thick a figure is. `thickness` doubles it.
slab = "0.625rem"
# A connection's thickness.
line = "0.1875rem"
# The camera's focal length. Shorter exaggerates; longer flattens.
perspective = "64rem"
# Where the camera rests. Enough pitch to show that the figures are solids,
# not so much that the text is read at an angle.
tilt = "12deg"
turn = "0deg"
# And in the deep view, where planes stacked behind one another need a turn
# before the depth does any work at all.
turn-deep = "26deg"
# How far a focused or picked figure comes toward the reader. It also has a
# border and a label, because depth alone is not a signal (`NOCTUA.md §9.8`).
lift = "1.25rem"


# --- Glass ----------------------------------------------------------------
#
# The frosted surface. Two dimensionless numbers, and NOT a pre-mixed color.
#
# That distinction is load-bearing. A `--noctua-glass-surface:
# color-mix(in oklab, var(--nc-color-surface) 88%, transparent)` declared at
# :root would freeze to the PAGE's palette, exactly as --nc-color-surface
# itself does, and a themed component would show the page's frost. The
# color-mix has to be written where the token is used, where the palette is
# already correct. A source gate enforces it.

[glass.blur]
subtle = "10px"
full = "20px"

# The percentage of the surface color that survives. Lower is more
# transparent.
#
# These were 92 and 82, which is why the "glass" read as a solid panel: at 92%
# there is nothing to see through, so the blur behind it had nothing to do and
# the effect was a tint with extra cost. Real glass is mostly what is behind it.
#
# The floor is set by readability rather than by taste: below about 55 the text
# over it starts fighting the page, and `readability.spec.js` measures it.
[glass.opacity]
subtle = 78
full = 58

# Saturation and brightness of what shows THROUGH.
#
# This is most of what separates glass from a translucent rectangle. Real glass
# concentrates the color behind it and lifts it slightly; without these the
# blur alone reads as a smudge. Dimensionless, so they multiply the sampled
# backdrop rather than naming a color.
[glass.saturate]
subtle = "1.4"
full = "1.8"

[glass.brightness]
subtle = "1.02"
full = "1.06"

# The lit edge, as a percentage of the raised-surface color.
#
# A pane catches light along its top edge and nowhere else. One hairline, one
# gradient — never a `box-shadow`, which §9.7 forbids and which a browser test
# asserts the absence of.
[glass.edge]
subtle = 34
full = 52

# The inner sheen: how strongly the top of the surface picks up that light,
# falling off over one spacing step.
[glass.sheen]
subtle = 12
full = 20


# --- Background effects ---------------------------------------------------
#
# Alpha ceilings, not values. Each is the most ink an effect may put over the
# page, and each is what makes "patterns never hurt readability" a bounded,
# measurable claim rather than a promise.

[effect.alpha]
# The worst case for a glyph is a background pixel moved 4% toward the text
# color. That bound is what the contrast test measures against.
pattern = 4
grain = 6
# A DOT IS NOT A GRID, AND THAT IS WHY IT HAS ITS OWN NUMBER.
#
# The ceiling above is per-pixel: the most any one background pixel may be moved
# toward the text colour. `mesh`, `checks` and `diagonals` all cover a large,
# connected share of their tile, so at 4% they read as a texture. `dots` covers
# about a fortieth of its own, in specks a few pixels across with nothing
# touching them — at the same number it reads as a smudge on the screen, which
# is a setting a reader turns on and cannot tell they turned on.
#
# So dots are allowed more ink, and the same test proves it costs nothing: every
# pattern, on every backdrop, in both modes, is measured against the darkest ink
# a heading paints and must clear 4.5:1. This number moved because that
# measurement said it could.
dots = 10

# There was an `[effect.blur] glow` here — the aurora's 64px stops — and an
# `[effect.duration]` table holding `drift` and `breathe`. The aurora is gone,
# and it was the last thing on a page that moved: nothing now animates a
# background, so there is no infinite duration left to keep out of
# `[motion.duration]` and nothing for reduced motion to switch off.


# --- Radius presets -------------------------------------------------------
#
# The reader-facing corner setting. Named presets, not a multiplier on
# [radius]: `9999px * 0.5` is still a pill, and a multiplier produces
# fractional radii nobody designed and that anti-alias badly at small sizes.
#
# Token NAMES never change, so no component is touched by this feature.
#
# Emitted as `[data-noctua-radius="x"]` — a bare attribute selector, not
# `:root[data-noctua-radius]` — which is what lets a themed component carry its
# own corners by plain custom-property inheritance, with no JavaScript at all.
#
# A top-level table rather than `[radius.preset]`: TOML would then make
# `[radius]` a mixed table of values and sub-tables, and the parser cannot both
# flatten the values and reject unknown keys — which is a guarantee worth more
# than the nesting.

[preset.radius.square]
none = "0"
control = "0"
surface = "0"
pill = "0"

# Must equal [radius] exactly. A test asserts it, so "the default preset" and
# "no preset" can never drift into meaning different things.
[preset.radius.soft]
none = "0"
control = "0.5rem"
surface = "0.75rem"
pill = "9999px"

[preset.radius.round]
none = "0"
control = "0.875rem"
surface = "1.25rem"
pill = "9999px"

[preset.radius.circular]
none = "0"
control = "9999px"
surface = "1.5rem"
pill = "9999px"
