[package]
name = "noctua-design-lineage"
description = "Reads a relationship graph and places it in three dimensions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/noctua-world/noctua-design"
readme = "README.md"
keywords = ["graph", "layout", "3d", "design-system", "visualization"]
categories = ["gui", "visualization"]

# NO RUNTIME DEPENDENCIES, like every other crate a consumer of the design
# system inherits. A graph layout is arithmetic and sorting; a parser generator,
# a graph library or a linear-algebra crate would all be a permanent commitment
# to somebody else's decisions in exchange for code that fits in one file.
#
# It is not `no_std`, unlike `noctua-design-grammars`, and for one reason:
# `f64::sqrt` lives in `std`. It is the only transcendental this crate uses, it
# is exactly rounded by IEEE-754 in Rust and in every JavaScript engine, and
# that is precisely what lets `layout.js` be a transcription rather than an
# approximation of this file.

[dev-dependencies]
# The blessed cases are TOML, and this crate is checked against them rather than
# against its own twin — see `tests/blessed.rs`. A dev-dependency reaches no
# consumer.
noctua-design-spec = { path = "../noctua-design-spec" }

[lints]
workspace = true
