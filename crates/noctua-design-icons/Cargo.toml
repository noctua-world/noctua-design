[package]
name = "noctua-design-icons"
description = "The Noctua design system's icon drawings, one associated const each, so an application that draws one icon carries one drawing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/noctua-world/noctua-design"
readme = "README.md"
keywords = ["icons", "svg", "design-system", "ui", "dioxus"]
categories = ["gui", "web-programming"]

[features]
# `ALL` and `IconDrawing::parse`, the two things that name every icon.
#
# OFF, and that is the whole design. Every icon is an associated `const`, and a
# `const` is materialised at its use sites and nowhere else — so an application
# that draws one icon carries one drawing. An array of all of them is a use site
# for all of them, which is exactly the payload this arrangement exists to
# avoid, so reaching the catalogue is something a consumer has to ask for.
#
# The documentation site's gallery asks for it. Nothing else should.
catalogue = []

[lints]
workspace = true
