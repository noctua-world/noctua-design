[package]
name = "noctua-design-grammars"
description = "Syntax grammars and the hand-written scanner behind the Noctua design system's code blocks. No dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/noctua-world/noctua-design"
readme = "README.md"
keywords = ["syntax-highlighting", "grammar", "scanner", "design-system"]
categories = ["parsing", "gui"]

# NO DEPENDENCIES, like every other generated data crate here. A consumer of the
# design system should not inherit a regex engine, a parser generator or a
# grammar runtime in order to show a code block — which is also why the scanner
# is written by hand against tables rather than compiled from a grammar format.

[lints]
workspace = true
