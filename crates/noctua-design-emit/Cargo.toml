[package]
name = "noctua-design-emit"
description = "Formats a validated token spec into CSS, Rust and TypeScript."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Like `noctua-colors`' emit crate, this one performs no computation. It
# formats values that arrive already validated. A target that computed one
# would let the checked model and the shipped output disagree.

[dependencies]
noctua-design-spec = { path = "../noctua-design-spec" }
# The shipped browser behaviour, as `include_str!` constants. A dependency
# rather than a path `xtask` reads at build time — which is how `lineage`'s
# twin arrives — because a file renamed out from under an emitter should be a
# compile error naming the file, not an artifact that emits empty.
noctua-design-runtime = { path = "../noctua-design-runtime" }
indexmap.workspace = true

[lints]
workspace = true
