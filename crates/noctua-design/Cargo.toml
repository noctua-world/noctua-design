[package]
name = "noctua-design"
description = "The Noctua design system, as Dioxus components."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/noctua-world/noctua-design"
readme = "../../README.md"
keywords = ["dioxus", "design-system", "components", "ui"]
categories = ["gui", "web-programming"]
# The stylesheets a consumer links live in `dist/`, at the repository root,
# which Cargo cannot include from here. Consumption is by git tag today
# (`NOCTUA.md §8.6`), where the whole tree is present. What a crates.io
# consumer would link is the one question left open before the first publish.
publish = false

[dependencies]
dioxus.workspace = true
noctua-design-grammars.workspace = true
noctua-design-icons.workspace = true
noctua-design-lineage.workspace = true
noctua-design-theme.workspace = true
noctua-design-tokens.workspace = true

[dev-dependencies]
# Renders a component to an HTML string so the tests can assert on the markup a
# scope actually produces. Not a runtime dependency: choosing a renderer stays
# the application's decision.
dioxus-ssr.workspace = true

[lints]
workspace = true
