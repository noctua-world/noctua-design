# The gate, a determinism check, and the browser suite.
#
# `cargo xtask check` is the whole first job, and `cargo xtask docs --verify`
# the whole browser job. Not a reimplementation of either step list in YAML —
# that is precisely how the two drift until "passes locally, fails in CI"
# becomes a normal sentence, and it is why `NOCTUA.md §19.4` makes this a rule
# rather than a preference.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; each job asks for what it needs.
permissions: {}

jobs:
  # The gate runs on Linux, macOS and Windows: both packages have to behave the
  # same wherever they are built. A step that cannot run on a system says so by
  # name in the gate's own output.
  check:
    name: cargo xtask check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml decides the version, the components and the
      # wasm target. Nothing is pinned twice.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # Deliberately no Node. The Rust half of this repository must build and
      # test without it (NOCTUA.md §9.11), and the surest way to keep that true
      # is for the job that proves it never to have Node available. `check`
      # also asserts it structurally, so the promise is covered twice.
      - run: cargo xtask check

  # The install the publish workflow does, on every push rather than once a tag
  # exists. Two releases died here — a lockfile that did not know about a new
  # package, then an install script nobody had approved — and both times the
  # failure arrived after the tag was pushed, which is the one moment it cannot
  # be fixed cheaply. Nothing else in CI runs pnpm, so nothing else could see it.
  install:
    name: pnpm install --frozen-lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile

  # The browser suite: geometry, paint, focus and accessibility measured in a
  # real Chrome against the built site, the conformance cases driving both
  # implementations, and the fuzzy corpus replayed through the matcher that
  # ships. Its own job because it is the one thing here that needs Node and a
  # browser, which the `check` matrix must never have (NOCTUA.md §9.11). Linux
  # only: what it measures is the static site and the shipped modules, which
  # are the same bytes whichever system built them, and `check` already holds
  # the build to that on all three.
  #
  # `pages` does NOT wait for this job, on purpose. Rerunning a job reruns its
  # dependents, so a site deploy hanging off the browser suite would redeploy
  # Pages every time a flaky spec was retried — and a second retry would then
  # fail on a duplicate `github-pages` artifact, turning `main` red over a site
  # that never changed. A failure here is still a red `main`; it just cannot
  # republish anything.
  #
  # Split four ways. The suite is five thousand tests, and a runner's two
  # workers would take longer over it than the rest of CI together; each part
  # builds the same site and runs the same command, and `playwright.config.js`
  # reads which part from NOCTUA_SHARD. A flaky part is rerun alone.
  browser:
    name: cargo xtask docs --verify (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile

      # THE SUITE MEASURES THE MACHINE'S NOTO SANS. The site's faces are
      # `font-display: optional` and its pages do not preload them, so a fresh
      # browser context — which every test is — paints before they arrive and
      # keeps whatever the machine calls "Noto Sans" for the page's lifetime.
      # A bare runner has none and falls through the stack to DejaVu Sans,
      # which is wider: four geometry specs failed on it and on nothing else.
      #
      # ONLY THE LATIN FACES, taken out of Ubuntu's package rather than the
      # whole package installed. `scripts.spec.js` proves the site's own Thai,
      # Arabic and the rest render by measuring each against the browser's
      # fallback, which has to be tofu; with every Noto script installed the
      # fallback drew real Thai and the guard failed for a font the site never
      # served. So the runner gets the Noto Sans the site names and no script.
      - name: Install the Latin Noto faces the site names
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update
          apt-get download fonts-noto-core
          dpkg-deb -x fonts-noto-core_*.deb noto
          mkdir -p ~/.local/share/fonts
          cp noto/usr/share/fonts/truetype/noto/NotoSans-*.ttf \
             noto/usr/share/fonts/truetype/noto/NotoSansDisplay-*.ttf \
             ~/.local/share/fonts/
          fc-cache -f
          fc-match "Noto Sans"
          if fc-list :lang=th family | grep -q .; then
            echo "::error::a Thai face is installed, so scripts.spec.js cannot see tofu"
            exit 1
          fi

      # The React example is not committed (`.gitignore` says why), and a site
      # built without it renders no implementation switch — so every spec that
      # holds React's markup against Dioxus's would have nothing to hold.
      - name: Bundle the React example
        run: pnpm --filter @noctua-world/docs-site run build:example

      - run: cargo xtask docs --verify
        env:
          # The runner's own Chrome, which the suite drives through
          # `executablePath` exactly as it drives a developer's — never
          # Playwright's download (`playwright.config.js` says why).
          NOCTUA_CHROME: /usr/bin/google-chrome
          NOCTUA_SHARD: ${{ matrix.shard }}/4

      # What a failing spec left behind, so a red run can be read without
      # reproducing it.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  determinism:
    name: Two builds, byte-identical
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # Generated output is committed, so a build that is not reproducible
      # makes every diff untrustworthy: a reviewer cannot tell a real change
      # from build noise. `NOCTUA.md §16.4`.
      #
      # Two full builds rather than a build and a `git diff`, because the second
      # catches a generator that depends on what was already on disk — which a
      # single build against a clean checkout cannot.
      - name: Build twice and compare
        run: |
          cargo xtask build
          cp -r dist /tmp/dist-first
          cp crates/noctua-design-tokens/src/lib.rs /tmp/tokens-first.rs
          cp -r packages/tokens /tmp/tokens-first

          cargo xtask build
          diff -r /tmp/dist-first dist
          diff /tmp/tokens-first.rs crates/noctua-design-tokens/src/lib.rs
          diff -r /tmp/tokens-first packages/tokens

      # And the committed output must equal what a build produces, or the
      # repository ships something no spec describes.
      - name: The committed output matches the spec
        run: |
          if ! git diff --exit-code; then
            echo "::error::the generated output is out of sync — run \`cargo xtask build\`"
            exit 1
          fi

  pages:
    name: Publish the documentation site
    # Only from main, and only once the gate is green: a broken site is worse
    # than a stale one.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - run: cargo xtask docs

      # Every URL is a directory, so Pages has to serve each one's index.html.
      # Jekyll would also eat any path beginning with an underscore; nothing
      # here has one today, and a marker file is cheaper than remembering.
      - run: touch docs-site/dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
