# The React package and the generated TypeScript tokens.
#
# Node's role here is bounded and deliberate (NOCTUA.md §9.11): pnpm for the
# React package, Playwright for the conformance runner, and nothing else. The
# Rust half of this repository builds and tests with none of it installed, which
# `cargo xtask check` proves rather than assumes.
packages:
  - "packages/*"
  # The documentation site's one JavaScript module. It is here so the React
  # example imports `@noctua-world/design-react` by its published name, exactly
  # as a consumer would — an example that reached into the source tree with
  # `../../packages/react/src` would be demonstrating something no user can do.
  - "docs-site"
# esbuild compiles the React example into `docs-site/assets/react/`, and its
# install script is what fetches the platform binary that does it. pnpm refuses
# to run an install script nobody approved — as an error, not a warning, which
# is why this line is a decision and not a formality.
allowBuilds:
  esbuild: true
